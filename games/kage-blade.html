<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0a12">
  <title>Kage Blade: Stickman Ninja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
/* Kage Blade — mobile-first UI: black lacquer, vermilion and gold. */
:root {
  --bg: #0d0a12; --panel: #17121f; --panel2: #201a2b; --line: #3a2e44; --ink: #f4ecdc; --muted: #a89cb4;
  --red: #d0303a; --red2: #8a1a22; --gold: #ffcf5a; --gold2: #c8901e; --green: #5fd17a; --blue: #5aa8ff;
  --r0: #b8c0cc; --r1: #5aa8ff; --r2: #b46aff; --r3: #ffb02e; --r4: #ff4a6a;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 500 14px/1.35 'Zen Kaku Gothic New', system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
.hidden { display: none !important; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.num { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.5px; }
#app { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; background: var(--bg); box-shadow: 0 0 60px rgba(0,0,0,0.6); overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* ---------- Title ---------- */
#title { align-items: center; justify-content: flex-end; }
#titleCv { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-wrap { position: relative; text-align: center; padding: 0 24px calc(60px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; background: linear-gradient(0deg, rgba(13,10,18,0.95) 30%, rgba(13,10,18,0)); }
.logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; }
.logo .jp { font: 900 26px 'Zen Kaku Gothic New', serif; color: var(--red); letter-spacing: 8px; text-shadow: 0 0 18px rgba(208,48,58,0.6); }
.logo b { font: 400 64px/0.95 'Bebas Neue', Impact, sans-serif; letter-spacing: 4px; background: linear-gradient(180deg, #fff6dc, #ffcf5a 55%, #c8701e); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #3a0a10) drop-shadow(0 0 20px rgba(255,180,60,0.35)); }
.logo i { font-style: normal; font-weight: 700; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-size: 12px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 12px; font-weight: 900; background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 3px 0 rgba(0,0,0,0.5); transition: transform 0.08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.5); }
.btn[disabled], .btn.off { opacity: 0.45; filter: grayscale(0.6); }
.btn-red { background: linear-gradient(180deg, #e8424c, #a8202a); border-color: #ff7a7a55; color: #fff; text-shadow: 0 1px 0 #5a0a10; }
.btn-gold { background: linear-gradient(180deg, #ffe08a, #e0a030); border-color: #fff2c055; color: #3a2004; }
.btn-blue { background: linear-gradient(180deg, #6ab0ff, #2a6ad0); color: #fff; }
.btn-xl { font-size: 20px; padding: 14px 40px; border-radius: 16px; letter-spacing: 1px; animation: pulse 1.6s infinite; }
.btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 9px; }
@keyframes pulse { 50% { transform: scale(1.04); filter: brightness(1.15); } }

/* ---------- Stage & HUD ---------- */
#stageWrap { position: relative; width: 100%; aspect-ratio: 360 / 300; max-height: 46vh; flex: none; overflow: hidden; background: #000; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: absolute; left: 0; right: 0; top: 0; padding: 8px 10px 0; pointer-events: none; }
#hud button { pointer-events: auto; }
.hud-row { display: flex; align-items: center; gap: 6px; }
.res { display: flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border-radius: 99px; background: rgba(10,6,14,0.62); border: 1px solid rgba(255,255,255,0.12); font: 400 17px 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.6px; backdrop-filter: blur(3px); }
.ic { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.ic.coin { background: radial-gradient(circle at 35% 30%, #fff1a0, #ffcf3a 45%, #a8740a); box-shadow: inset 0 0 0 1.5px #a8740a; }
.ic.gemi { border-radius: 4px; transform: rotate(45deg) scale(0.8); background: linear-gradient(135deg, #e0f4ff, #5ac8ff 45%, #2a6ad0); box-shadow: 0 0 8px rgba(90,200,255,0.7); }
.spacer { flex: 1; }
.pow { padding: 3px 10px; border-radius: 99px; background: rgba(10,6,14,0.62); border: 1px solid rgba(255,207,90,0.35); color: var(--gold); font: 400 16px 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.6px; }
.iconbtn.spd { width: auto; min-width: 38px; padding: 0 8px; border-radius: 99px; font: 400 17px 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.5px; }
.iconbtn.spd.on { background: linear-gradient(180deg, #ffe08a, #e0a030); color: #3a2004; border-color: #fff2c0; box-shadow: 0 0 10px rgba(255,207,90,0.6); }
.iconbtn { width: 30px; height: 30px; border-radius: 50%; background: rgba(10,6,14,0.62); border: 1px solid rgba(255,255,255,0.15); font-size: 16px; }
.stage-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.stage { display: flex; flex-direction: column; line-height: 1; text-shadow: 0 2px 4px #000; }
.stage b { font: 400 24px 'Bebas Neue', Impact, sans-serif; letter-spacing: 1px; color: #fff; }
.stage span { font-size: 10px; font-weight: 900; color: #ffe8c8; letter-spacing: 1px; text-transform: uppercase; }
.bar { position: relative; height: 12px; border-radius: 99px; background: rgba(10,6,14,0.7); border: 1px solid rgba(255,255,255,0.15); overflow: hidden; flex: 1; }
.bar i { position: absolute; inset: 0; width: 0; background: linear-gradient(90deg, #ffcf5a, #ff8a3a); transition: width 0.15s; }
.bar span { position: absolute; inset: 0; text-align: center; font: 900 9px/12px system-ui; color: #fff; text-shadow: 0 1px 2px #000; }
.bar.boss { height: 14px; } .bar.boss i { background: linear-gradient(90deg, #ff4a5a, #a8101e); } .bar.boss span { line-height: 14px; }
#bossHud, #dunHud { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bossname { width: 100%; font: 900 12px system-ui; color: #ffb0b0; text-shadow: 0 1px 3px #000; letter-spacing: 0.5px; }
.timer { font: 400 20px 'Bebas Neue', Impact, sans-serif; color: #fff; min-width: 34px; text-align: right; text-shadow: 0 2px 4px #000; }
.timer.low { color: #ff5a5a; animation: pulse 0.5s infinite; }
#heroHp { position: absolute; left: 14%; width: 26%; bottom: 6%; height: 6px; flex: none; }
#heroHp i { background: linear-gradient(90deg, #5fd17a, #2a9a4a); }
#banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font: 400 34px 'Bebas Neue', Impact, sans-serif; letter-spacing: 3px; color: #fff; text-shadow: 0 0 20px rgba(208,48,58,0.9), 0 3px 0 #3a0a10; pointer-events: none; animation: bannerIn 1.8s forwards; }
#banner small { display: block; font: 900 12px 'Zen Kaku Gothic New', system-ui; letter-spacing: 4px; color: #ffcf5a; }
@keyframes bannerIn { 0% { transform: scale(2.2); opacity: 0; } 12% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(0.95); } }
#bossBtn { position: absolute; right: 10px; bottom: 12px; padding: 8px 14px; font-size: 13px; animation: pulse 1.2s infinite; }
#stageNav { position: absolute; left: 6px; bottom: 34%; display: flex; flex-direction: column; gap: 6px; opacity: 0.6; }
.navbtn { width: 26px; height: 26px; border-radius: 50%; background: rgba(10,6,14,0.62); border: 1px solid rgba(255,255,255,0.18); font: 900 18px/1 system-ui; }

/* ---------- Skill bar ---------- */
#skillBar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: linear-gradient(180deg, #1c1526, #120e18); border-top: 1px solid #3a2e44; border-bottom: 1px solid #000; }
.skills { display: flex; gap: 8px; flex: 1; }
.sk { position: relative; width: 52px; height: 52px; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #3a2e48, #1a1424); border: 2px solid var(--line); font-size: 26px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.sk.ready { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,207,90,0.45); }
.sk.empty { opacity: 0.45; font-size: 16px; color: var(--muted); }
.sk .cd { position: absolute; inset: 0; background: conic-gradient(rgba(5,3,8,0.78) var(--p), transparent 0); }
.sk .cdt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 400 18px 'Bebas Neue', Impact, sans-serif; color: #fff; text-shadow: 0 1px 3px #000; }
.sk .lv { position: absolute; right: 3px; bottom: 1px; font: 900 9px system-ui; color: var(--gold); text-shadow: 0 1px 2px #000; }
.auto { width: 54px; height: 52px; border-radius: 14px; font: 400 17px 'Bebas Neue', Impact, sans-serif; letter-spacing: 1px; background: #241c30; border: 2px solid var(--line); color: var(--muted); }
.auto.on { background: linear-gradient(180deg, #e8424c, #a8202a); color: #fff; border-color: #ff8a8a; box-shadow: 0 0 12px rgba(208,48,58,0.6); }

/* ---------- Panel ---------- */
#panel { flex: 1; overflow-y: auto; padding: 10px 10px 16px; -webkit-overflow-scrolling: touch; background: radial-gradient(120% 60% at 50% 0%, #1c1528, var(--bg)); }
#panel h3 { margin: 6px 2px 8px; font: 900 14px 'Zen Kaku Gothic New', system-ui; letter-spacing: 1px; color: var(--gold); display: flex; align-items: center; gap: 8px; }
#panel h3 .right { margin-left: auto; }
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 8px; box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
.row { display: flex; align-items: center; gap: 10px; }
.stat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
.stat .ico { width: 40px; height: 40px; border-radius: 10px; background: #2a2236; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
.stat .info { flex: 1; min-width: 0; }
.stat .info b { display: block; font-weight: 900; }
.stat .info span { font-size: 12px; color: var(--muted); }
.stat .info em { font-style: normal; color: var(--green); font-weight: 900; }
.buy { min-width: 92px; flex-direction: column; gap: 0; padding: 6px 10px; line-height: 1.1; }
.buy small { font: 400 15px 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
.seg { display: flex; background: #120e18; border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg button { padding: 4px 10px; border-radius: 8px; font-weight: 900; font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--red); color: #fff; }

/* gear */
.hero-card { display: flex; gap: 10px; align-items: stretch; }
.hero-card canvas { width: 120px; height: 140px; border-radius: 12px; background: radial-gradient(circle at 50% 60%, #2a2238, #120e18); flex: none; }
.hero-card .eq { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.eqslot { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 10px; background: #120e18; border: 1px solid var(--line); }
.eqslot canvas { width: 40px; height: 40px; border-radius: 8px; }
.eqslot b { font-size: 13px; display: block; }
.eqslot span { font-size: 11px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.item { position: relative; aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--r0); overflow: hidden; background: #120e18; }
.item canvas { width: 100%; height: 100%; display: block; }
.item.locked { opacity: 0.35; filter: grayscale(1) brightness(0.6); }
.item .lv { position: absolute; left: 3px; top: 2px; font: 900 10px system-ui; text-shadow: 0 1px 2px #000; }
.item .cnt { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 5px; border-radius: 4px; background: rgba(0,0,0,0.7); overflow: hidden; }
.item .cnt i { position: absolute; inset: 0; width: 0; background: var(--green); }
.item.can::after { content: '▲'; position: absolute; right: 3px; top: 1px; font-size: 10px; color: var(--green); text-shadow: 0 0 4px #000; animation: pulse 1s infinite; }
.item.eq { box-shadow: 0 0 0 2px #fff inset; }
.item.eq::before { content: 'E'; position: absolute; right: 3px; bottom: 9px; font: 900 10px system-ui; background: var(--red); color: #fff; border-radius: 4px; padding: 0 3px; }
.r0 { border-color: var(--r0); } .r1 { border-color: var(--r1); } .r2 { border-color: var(--r2); } .r3 { border-color: var(--r3); box-shadow: 0 0 10px rgba(255,176,46,0.35); } .r4 { border-color: var(--r4); box-shadow: 0 0 12px rgba(255,74,106,0.45); }
.tr0 { color: var(--r0); } .tr1 { color: var(--r1); } .tr2 { color: var(--r2); } .tr3 { color: var(--r3); } .tr4 { color: var(--r4); }

/* skills tab */
.skrow { display: flex; align-items: center; gap: 10px; padding: 8px; }
.skrow .sk { width: 48px; height: 48px; flex: none; }
.skrow .info { flex: 1; min-width: 0; }
.skrow .info b { display: block; }
.skrow .info span { font-size: 12px; color: var(--muted); }
.skrow.locked { opacity: 0.4; }
.copies { height: 6px; border-radius: 4px; background: #0a080e; overflow: hidden; margin-top: 4px; }
.copies i { display: block; height: 100%; background: var(--green); }

/* summon */
.banner { position: relative; overflow: hidden; padding: 12px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 10px; }
.banner.weapon { background: linear-gradient(135deg, #3a1018, #1a0e1c 60%); }
.banner.armor { background: linear-gradient(135deg, #10203a, #0e1220 60%); }
.banner.skill { background: linear-gradient(135deg, #2a1040, #120e20 60%); }
.banner h4 { margin: 0 0 2px; font: 900 18px 'Zen Kaku Gothic New', system-ui; letter-spacing: 1px; }
.banner .lvl { font-size: 12px; color: var(--muted); }
.banner .bg { position: absolute; right: -10px; top: -14px; font-size: 92px; opacity: 0.12; transform: rotate(-12deg); }
.banner .btns { display: flex; gap: 8px; margin-top: 10px; }
.banner .btns .btn { flex: 1; flex-direction: column; gap: 0; line-height: 1.1; }
.rates { display: flex; gap: 6px; font-size: 10px; margin-top: 6px; flex-wrap: wrap; }
.pulls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
.pull { position: relative; aspect-ratio: 1; border-radius: 10px; border: 2px solid; overflow: hidden; opacity: 0; transform: rotateY(90deg) scale(0.6); animation: flip 0.45s forwards; background: #120e18; }
.pull canvas { width: 100%; height: 100%; display: block; }
.pull .new { position: absolute; left: 2px; top: 2px; font: 900 8px system-ui; background: var(--red); color: #fff; border-radius: 4px; padding: 1px 3px; }
.pull .em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; }
@keyframes flip { to { opacity: 1; transform: none; } }

/* dungeon */
.dun { padding: 12px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.dun.gold { background: linear-gradient(135deg, #4a3208, #1a120a 70%); }
.dun.trial { background: linear-gradient(135deg, #0a2a40, #0e1220 70%); }
.dun h4 { margin: 0; font: 900 18px 'Zen Kaku Gothic New', system-ui; }
.dun .bg { position: absolute; right: 8px; top: 4px; font-size: 64px; opacity: 0.2; }
.keys { display: flex; gap: 4px; margin: 6px 0; }

/* quests */
.quest { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
.quest .info { flex: 1; }
.quest .info b { font-size: 13px; }
.quest.done { opacity: 0.5; }
.toggle { width: 46px; height: 26px; border-radius: 99px; background: #2a2236; position: relative; border: 1px solid var(--line); flex: none; }
.toggle::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #8a7e96; transition: left 0.15s; }
.toggle.on { background: var(--red); } .toggle.on::after { left: 23px; background: #fff; }
input.code { flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0a080e; color: var(--ink); font: 700 14px system-ui; text-transform: uppercase; }

/* ---------- Tabs ---------- */
#tabs { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); background: #0a080e; border-top: 1px solid #3a2e44; padding-bottom: var(--safe-b); }
#tabs button { position: relative; display: flex; flex-direction: column; align-items: center; padding: 7px 0 6px; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: 0.3px; }
#tabs button i { font-style: normal; font-size: 20px; line-height: 1.1; filter: grayscale(0.7); }
#tabs button.on { color: #fff; background: linear-gradient(180deg, rgba(208,48,58,0.25), transparent); }
#tabs button.on i { filter: none; }
#tabs button.on::before { content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 3px; border-radius: 0 0 3px 3px; background: var(--red); }
#tabs button .dot { position: absolute; top: 5px; right: 22%; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px #0a080e; }

/* ---------- Modal & toast ---------- */
#modal { position: absolute; inset: 0; background: rgba(5,3,8,0.75); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; backdrop-filter: blur(3px); }
#modal .box { width: 100%; max-width: 420px; max-height: 88%; overflow-y: auto; background: linear-gradient(180deg, #241c30, #16111e); border: 1px solid #4a3a56; border-radius: 18px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); text-align: center; animation: pop 0.22s; }
#modal h2 { margin: 2px 0 8px; font: 900 22px 'Zen Kaku Gothic New', system-ui; color: var(--gold); letter-spacing: 1px; }
#modal p { margin: 6px 0; }
#modal .acts { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
#modal .acts .btn { flex: 1; }
.big-reward { display: flex; justify-content: center; gap: 14px; margin: 10px 0; font: 400 28px 'Bebas Neue', Impact, sans-serif; letter-spacing: 1px; }
.big-reward span { display: flex; align-items: center; gap: 6px; }
.item-detail canvas { width: 120px; height: 120px; border-radius: 16px; border: 3px solid; }
.kv { display: flex; justify-content: space-between; padding: 5px 2px; border-bottom: 1px dashed #3a2e44; font-size: 13px; text-align: left; }
.kv b { color: var(--green); }
@keyframes pop { from { transform: scale(0.85); opacity: 0; } }
#toast { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
#toast div { padding: 8px 14px; border-radius: 12px; background: rgba(10,6,14,0.92); border: 1px solid var(--line); font-weight: 900; font-size: 13px; animation: toast 2.2s forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translateY(10px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
@media (min-height: 760px) { .sk { width: 58px; height: 58px; } }

</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen">
    <canvas id="titleCv"></canvas>
    <div class="title-wrap">
      <div class="logo"><span class="jp">影刃</span><b>KAGE BLADE</b><i>Stickman Ninja Idle</i></div>
      <button class="btn btn-red btn-xl" id="startBtn">Tap to begin</button>
      <p class="muted small">Offline game · progress saves on this device</p>
    </div>
  </section>

  <section id="main" class="screen hidden">
    <div id="stageWrap">
      <canvas id="cv"></canvas>
      <div id="hud">
        <div class="hud-row">
          <div class="res"><span class="ic coin"></span><b id="hGold">0</b></div>
          <div class="res gem"><span class="ic gemi"></span><b id="hGems">0</b></div>
          <div class="spacer"></div>
          <div class="pow">⚔ <b id="hPow">0</b></div>
          <button class="iconbtn spd" id="spdBtn" aria-label="Game speed">1×</button>
          <button class="iconbtn" data-a="settings" aria-label="Settings">⚙</button>
        </div>
        <div class="stage-row">
          <div class="stage"><b id="hStage">1-1</b><span id="hRegion">Bamboo Forest</span></div>
          <div class="bar" id="progBar"><i id="progFill"></i><span id="progText"></span></div>
        </div>
        <div id="bossHud" class="hidden"><div class="bossname" id="bossName"></div><div class="bar boss"><i id="bossFill"></i><span id="bossHp"></span></div><div class="timer" id="bossTimer"></div></div>
        <div id="dunHud" class="hidden"><div class="bossname" id="dunName"></div><div class="timer" id="dunTimer"></div></div>
      </div>
      <div id="heroHp" class="bar hp"><i id="hpFill"></i></div>
      <div id="banner" class="hidden"></div>

};

<script>
/* =====================================================================
 * Ruang Main portal codes.
 * Codes made in the portal's admin menu are cached in localStorage by the
 * portal page (key "ruangmain.codes"). Games served from the same portal
 * check this list after their own built-in codes. Only a hash of each
 * code is stored here, never the code itself.
 * ===================================================================== */
var RMCodes = (function () {
  const KEY = 'ruangmain.codes';
  const norm = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '');
  function fnv(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); }
  /** Portal hash of a code (same function in the portal page). */
  const hash = code => { const n = norm(code); return fnv('ruangmain:' + n) + fnv(n + ':rm'); };
  function list() { try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); return d && Array.isArray(d.codes) ? d.codes : []; } catch (e) { return []; } }
  /** Returns a game-ready entry { hash, label, reward, start, expires } or null. */
  function find(code, game) {
    const n = norm(code); if (!n) return null;
    const ph = hash(n), e = list().find(c => c && c.ph === ph && c.active !== false && (c.game === 'all' || c.game === game));
    if (!e) return null;
    const reward = {}; for (const k in (e.reward || {})) { const v = Math.floor(+e.reward[k]); if (v > 0) reward[k] = v; }
    return { hash: 'rm:' + ph, label: e.label || 'Gift', reward, start: e.start || null, expires: e.expires || null };
  }
  return { find, hash, norm };
})();

</script>

  const dayKey = T => { const d = new Date(T); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const KINDS = { weapon: { list: KB.WEAPONS, key: 'weapons' }, armor: { list: KB.ARMORS, key: 'armors' }, skill: { list: KB.SKILLS, key: 'skills' } };

<script>

 * Kage Blade — fx.js

 * skill spectacles, enemy projectiles, coins, weather and screen shake.

    step(dt); coins(g);
    shake = Math.max(0, shake - dt * 20);
    if (flash) { flash.t += dt; if (flash.t > flash.life) flash = null; }
  }
  const shakeOffset = () => shake > 0.2 ? [rnd(-shake, shake), rnd(-shake, shake)] : [0, 0];
  function drawUnder(c) { drawParts(c, 'under'); }
  function drawAmb(c) { drawParts(c, 'amb'); }
  function drawOver(c, g, t) { drawTrail(c, t); drawShots(c, g, t); drawObjs(c, g, t); drawParts(c, 'over'); for (const cn of coinsFly) coin(c, cn.x, cn.y, 4, cn.rot); }
  function drawFlash(c) { if (!flash) return; c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(' + flash.rgb + ',' + 0.4 * (1 - flash.t / flash.life) + ')'; c.fillRect(0, 0, W, H); c.restore(); }
  function kick(n) { shake = Math.max(shake, n); }
  return { update, drawUnder, drawAmb, drawOver, drawFlash, shakeOffset, pushTip, kick, emit, burst, shuriken, coin, EL, count: () => parts.length };
})();

</script>
<script>
/* =====================================================================
 * Kage Blade — render.js
 * Draw order for one battle frame, fitted to the canvas.
 * ===================================================================== */
KB.Render = (function () {
  const W = KB.W, H = KB.H, A = KB.Actors, FX = KB.FX, SC = KB.Scene;
  let lastT = null;
  const ATT = ['slash', 'rise', 'thrust'];
  function draw(cv, g) {
    const c = cv.getContext('2d'), t = g.t;
    const dt = lastT == null || g.t < lastT ? 0 : Math.min(0.1, g.t - lastT); lastT = g.t;
    FX.update(g, dt);
    const k = Math.max(cv.width / W, cv.height / H);
    const [sx, sy] = FX.shakeOffset();
    c.setTransform(1, 0, 0, 1, 0, 0);
    const ox = (cv.width - W * k) / 2, oy = (cv.height - H * k);
    c.setTransform(k, 0, 0, k, ox + sx * k, oy + sy * k);
    const reg = g.region;
    SC.back(c, reg, g.scroll);
    FX.drawUnder(c);
    // enemies far to near: flyers behind, then by x descending so the front foe is on top
    const es = g.enemies.slice().sort((a, b) => (b.fy - a.fy) || (b.x - a.x));
    for (const e of es) A.enemy(c, e, t);
    for (const cl of g.clones) A.clone(c, cl, g, t);
    // hero shadow
    c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(g.hero.x + 4, KB.GROUND + 2, 18, 4, 0, 0, Math.PI * 2); c.fill();
    const tip = A.hero(c, g, t);
    if (tip) FX.pushTip(tip, ATT.includes(g.hero.anim) && g.hero.at > g.hero.dur * 0.3 && g.hero.at < g.hero.dur * 0.75, KB.RARITY[g.st.weapon.r].glow || '230,236,248', t);
    FX.drawOver(c, g, t);
    SC.fore(c, reg, g.scroll);
    FX.drawAmb(c);
    // damage numbers
    c.textAlign = 'center';
    for (const x of g.texts) {
      const p = 1 - x.t / x.max, a = Math.min(1, x.t * 3), sc = x.crit ? 1 + Math.max(0, 0.2 - p) * 3 : 1;
      c.save(); c.globalAlpha = a; c.translate(x.x, x.y); c.scale(sc, sc);
      c.font = (x.crit ? '900 15px ' : x.dot ? '700 9px ' : '800 11px ') + '"Bebas Neue", Impact, system-ui';
      const txt = (x.hero ? '-' : '') + KB.fmt(x.v);
      c.lineWidth = 3.2; c.strokeStyle = 'rgba(10,6,14,0.85)'; c.strokeText(txt, 0, 0);
      c.fillStyle = x.hero ? '#ff6a6a' : x.crit ? '#ffd34a' : x.el === 'fire' ? '#ffb070' : x.el === 'ice' ? '#bfeaff' : x.el === 'thunder' ? '#fff27a' : '#ffffff';
      c.fillText(txt, 0, 0);
      if (x.crit) { c.font = '900 8px system-ui'; c.fillStyle = '#ff5a3a'; c.fillText('CRIT', 0, -12); }
      c.restore();
    }
    FX.drawFlash(c);
  }
  return { draw };
})();

</script>
<script>
/* =====================================================================
 * Kage Blade — ui.js
 * Screens, HUD, tabs, modals and the main loop.
 * ===================================================================== */
(function () {
  const S = KB.State, $ = id => document.getElementById(id), fmt = KB.fmt;
  const app = KB.App = { save: S.load(), game: null, tab: 'hero', mult: 1, started: false, hidden: 0 };
  const sfx = n => { if (app.save.settings.sound) KB.Audio.play(n); };
  const RAR = KB.RARITY;
  const kindList = k => k === 'weapon' ? KB.WEAPONS : k === 'armor' ? KB.ARMORS : KB.SKILLS;
  const ownKey = k => k === 'weapon' ? 'weapons' : k === 'armor' ? 'armors' : 'skills';

  /* ---------------- Helpers ---------------- */
  function toast(msg) { const d = document.createElement('div'); d.textContent = msg; $('toast').appendChild(d); setTimeout(() => d.remove(), 2300); }
  let modalHandler = null;
  function modal(html, onClick) { $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); modalHandler = onClick || null; paintCanvases($('modalBox')); }
  function closeModal() { $('modal').classList.add('hidden'); modalHandler = null; }
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('modalBox').querySelector('[data-lock]')) return closeModal(); if (e.target.closest('[data-close]')) { sfx('click'); closeModal(); } if (modalHandler) modalHandler(e); });
  function fail(r) { toast(r.reason || 'Not possible'); sfx('error'); }
  let lastSave = 0;
  function persist(force) { const n = performance.now(); if (force || n - lastSave > 4000) { S.save(app.save); lastSave = n; } }
  const goldIc = '<span class="ic coin"></span>', gemIc = '<span class="ic gemi"></span>';
  function banner(text, sub) { const b = $('banner'); b.innerHTML = text + (sub ? '<small>' + sub + '</small>' : ''); b.classList.remove('hidden'); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.add('hidden'), 1800); }

  /** Paints item/skill canvases inside a root element. */
  function paintCanvases(root) {
    root.querySelectorAll('canvas[data-item]').forEach(cv => { const [kind, id] = cv.dataset.item.split(':'); cv.width = cv.height = 96; KB.Actors.itemIcon(cv, kind, S.byId(kind, id), 0.4); });
    root.querySelectorAll('canvas[data-hero]').forEach(cv => { cv.width = 240; cv.height = 280; KB.Actors.heroPortrait(cv, app.save, 0.5); });
  }

  /* ---------------- Title ---------------- */
  function titleLoop() {
    if (app.started) return;
    const cv = $('titleCv'), r = cv.getBoundingClientRect(); if (cv.width !== Math.round(r.width * 2)) { cv.width = Math.round(r.width * 2); cv.height = Math.round(r.height * 2); }
    const c = cv.getContext('2d'), t = performance.now() / 1000, reg = KB.REGIONS[Math.floor(t / 8) % KB.REGIONS.length];
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#0d0a12'; c.fillRect(0, 0, cv.width, cv.height);
    const k = Math.max(cv.width / KB.W, cv.height * 0.62 / KB.H); c.setTransform(k, 0, 0, k, (cv.width - KB.W * k) / 2, 0);
    KB.Scene.back(c, reg, t * 20);
    const look = KB.Actors.heroLook(S.heroStats(app.save), app.save);
    const u = (t % 3) / 3, P = u < 0.5 ? KB.Rig.idle(t) : KB.Rig.heroPose(['slash', 'rise', 'thrust'][Math.floor(t / 3) % 3], (u - 0.5) * 2, t);
    c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(KB.W / 2, KB.GROUND + 2, 26, 6, 0, 0, 6.3); c.fill();
    KB.Rig.draw(c, KB.W / 2 - 10, KB.GROUND, 36, 1, P, look, t, { hero: true, band: '#d0303a' });
    requestAnimationFrame(titleLoop);
  }
  $('startBtn').addEventListener('click', () => {
    KB.Audio.ensure(); sfx('click'); app.started = true;
    $('title').classList.add('hidden'); $('main').classList.remove('hidden');
    if (app.save.settings.music) KB.Audio.startMusic('battle');
    enterMain();
  });

  /* ---------------- Main ---------------- */
  function newStageGame() { app.game = new KB.Game(app.save); app.ui = {}; if (app.started) buildSkills(); }
  function enterMain() {
    S.rollover(app.save);
    const off = S.offline(app.save);
    newStageGame(); buildSkills(); setTab(app.tab); last = performance.now(); requestAnimationFrame(loop);
    if (off) offlineModal(off);
    persist(true);
  }
  function offlineModal(off) {
    const h = Math.floor(off.sec / 3600), m = Math.floor(off.sec % 3600 / 60);
    modal('<h2>Welcome back, shinobi</h2><p class="muted">Your shadow trained for ' + (h ? h + 'h ' : '') + m + 'm while you were away.</p><div class="big-reward"><span>' + goldIc + fmt(off.gold) + '</span></div><p class="muted small">' + fmt(off.kills) + ' foes defeated · max ' + KB.OFFLINE_CAP_H + 'h</p>' +
      '<div class="acts" data-lock><button class="btn" data-claim="1">Claim</button><button class="btn btn-gold" data-claim="2">×2 for 50 ' + gemIc + '</button></div>', e => {
      const b = e.target.closest('[data-claim]'); if (!b) return;
      const r = S.claimOffline(app.save, off, b.dataset.claim === '2'); if (!r.ok) return fail(r);
      sfx('coin'); toast('+' + fmt(r.gold) + ' gold'); closeModal(); persist(true); refresh();
    });
  }

  /* ---------------- Loop ---------------- */
  let last = 0, hudT = 0, tabT = 0;
  function loop(now) {
    try { frame(now); } catch (e) { console.error('[Kage Blade]', e); last = now; }
    requestAnimationFrame(loop);
  }
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000); last = now;
    const g = app.game;
    if (g && $('modal').classList.contains('hidden') || g && g.mode === 'stage') {
      let rem = dt * (app.save.settings.speed === 2 ? 2 : 1); while (rem > 0) { const s = Math.min(1 / 30, rem); g.update(s); rem -= s; }
    }
    handleEvents(g);
    const cv = $('cv'), r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1) * (app.save.settings.quality === 'low' ? 0.6 : 1);
    if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
    KB.Render.draw(cv, app.game);
    hudT -= dt; if (hudT <= 0) { hudT = 0.1; hud(); }
    tabT -= dt; if (tabT <= 0) { tabT = 0.5; if (app.tab === 'hero') renderTab(); dots(); persist(); }
  }
  KB.FX.onCoin = n => sfx('coin');
  function handleEvents(g) {
    for (const e of g.events) {
      switch (e.kind) {
        case 'sfx': sfx(e.name); break;
        case 'boss': banner(e.region ? 'BOSS' : 'CAPTAIN', e.name); if (app.save.settings.music) KB.Audio.setMood('boss'); break;
        case 'clear': KB.Audio.setMood('battle'); sfx('clear'); banner('STAGE CLEAR', e.gems ? '+' + e.gems + ' gems' : KB.stageLabel(e.stage)); if (KB.isRegionBoss(e.stage) && e.stage % KB.STAGES_PER_REGION === 0) setTimeout(() => toast('New region: ' + KB.region(e.stage + 1).name), 1600); buildSkills(); persist(true); if (app.tab !== 'hero') renderTab(); break;
        case 'bossFail': KB.Audio.setMood('battle'); toast(e.why === 'time' ? 'Time ran out! Train and challenge again.' : 'Defeated by the boss! Train and try again.'); break;
        case 'toast': toast(e.text); break;
        case 'end': setTimeout(() => dungeonResult(e.result), 600); break;
      }
    }
    g.events.length = 0;
  }

  /* ---------------- HUD ---------------- */
  function hud() {
    const g = app.game, s = app.save;
    $('hGold').textContent = fmt(s.gold); $('hGems').textContent = fmt(s.gems); $('hPow').textContent = fmt(S.power(s));
    const isStage = g.mode === 'stage';
    $('hStage').textContent = isStage ? KB.stageLabel(s.stage) : g.mode === 'gold' ? 'CAVE ' + g.lv : 'TRIAL ' + g.lv;
    $('hRegion').textContent = g.region.name + (KB.realm(s.stage) && isStage ? ' · Realm ' + (KB.realm(s.stage) + 1) : '');
    const boss = isStage && g.phase === 'boss' && g.boss || g.mode === 'trial' && g.boss;
    $('bossHud').classList.toggle('hidden', !boss); $('progBar').classList.toggle('hidden', !!boss || !isStage);
    $('dunHud').classList.toggle('hidden', isStage || g.mode === 'trial');
    if (boss) {
      $('bossName').textContent = (g.boss.regionBoss ? '👹 ' : '⚔ ') + g.boss.name;
      $('bossFill').style.width = Math.max(0, g.boss.hp / g.boss.maxHp * 100) + '%'; $('bossHp').textContent = fmt(Math.max(0, g.boss.hp)) + ' / ' + fmt(g.boss.maxHp);
      const tm = isStage ? g.bossTimer : g.timer; $('bossTimer').textContent = Math.ceil(tm); $('bossTimer').classList.toggle('low', tm < 8);
    } else if (isStage) { const k = Math.min(g.kills, KB.KILLS_PER_STAGE); $('progFill').style.width = k / KB.KILLS_PER_STAGE * 100 + '%'; $('progText').textContent = s.autoBoss ? k + ' / ' + KB.KILLS_PER_STAGE : 'Farming · ' + fmt(g.kills) + ' kills'; }
    if (g.mode === 'gold') { $('dunName').textContent = '🪙 Golden Cavern · ' + g.kills + ' slain'; $('dunTimer').textContent = Math.ceil(g.timer); }
    $('hpFill').style.width = Math.max(0, g.hero.hp / g.st.hp * 100) + '%';
    $('bossBtn').classList.toggle('hidden', !(isStage && !s.autoBoss && g.phase !== 'boss'));
    $('stageNav').classList.toggle('hidden', !isStage);
    // skills
    const ids = s.equip.skills; let needBuild = false;
    document.querySelectorAll('#skills .sk').forEach((el, i) => {
      const id = ids[i]; if (!id) return;
      if (!el.querySelector('.cd')) { needBuild = true; return; }
      const def = KB.SKILLS.find(x => x.id === id), cd = g.cds[i], full = def.cd * KB.skillCdMult(s.skills[id].lv);
      el.classList.toggle('ready', cd <= 0); el.querySelector('.cd').style.setProperty('--p', (cd > 0 ? cd / full * 100 : 0) + '%'); el.querySelector('.cdt').textContent = cd > 0 ? Math.ceil(cd) : '';
    });
    $('autoBtn').classList.toggle('on', s.autoSkill);
    const sp = s.settings.speed === 2; $('spdBtn').textContent = sp ? '2×' : '1×'; $('spdBtn').classList.toggle('on', sp);
    if (needBuild) buildSkills();
  }
  function buildSkills() {
    const s = app.save, open = S.slotsOpen(s);
    $('skills').innerHTML = s.equip.skills.map((id, i) => {
      if (i >= open) return '<button class="sk empty" data-sk="' + i + '">🔒</button>';
      if (!id) return '<button class="sk empty" data-sk="' + i + '">＋</button>';
      const d = KB.SKILLS.find(x => x.id === id); return '<button class="sk" data-sk="' + i + '">' + d.icon + '<div class="cd"></div><div class="cdt"></div><span class="lv">Lv' + s.skills[id].lv + '</span></button>';
    }).join('');
  }
  $('skills').addEventListener('click', e => {
    const b = e.target.closest('[data-sk]'); if (!b) return; const i = +b.dataset.sk, s = app.save;
    if (i >= S.slotsOpen(s)) return toast('Slot unlocks at stage ' + KB.stageLabel(KB.SKILL_SLOT_UNLOCK[i]));
    if (!s.equip.skills[i]) return setTab('skills');
    if (app.game.cast(i)) { /* cast */ } else sfx('error');
  });
  $('autoBtn').addEventListener('click', () => { app.save.autoSkill = !app.save.autoSkill; sfx('click'); hud(); });
  $('spdBtn').addEventListener('click', () => { const s = app.save; s.settings.speed = s.settings.speed === 2 ? 1 : 2; sfx('click'); toast('Speed ' + s.settings.speed + '×'); hud(); persist(true); });
  $('bossBtn').addEventListener('click', () => { app.game.challengeBoss(); sfx('click'); toast('The boss will appear!'); });
  document.querySelector('#hud').addEventListener('click', e => { if (e.target.closest('[data-a=settings]')) settings(); });
  $('stageNav').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const s = app.save;

  /* ---------------- Tabs ---------------- */
  document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { sfx('click'); setTab(b.dataset.tab); } });
  function setTab(t) { app.tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); $('panel').scrollTop = 0; renderTab(); }
  function refresh() { app.game.refreshStats(false); renderTab(); hud(); buildSkills(); dots(); }
  function renderTab() {
    const html = ({ hero: tabHero, gear: tabGear, skills: tabSkills, summon: tabSummon, dungeon: tabDungeon, more: tabMore })[app.tab]();
    $('panel').innerHTML = html; paintCanvases($('panel'));
  }
  function dots() {
    const s = app.save, any = (kind) => Object.keys(s[ownKey(kind)]).some(id => S.canLevel(s, kind, id));
    const flags = { gear: any('weapon') || any('armor'), skills: any('skill') || (s.equip.skills.slice(0, S.slotsOpen(s)).includes(null) && Object.keys(s.skills).some(id => !s.equip.skills.includes(id))), summon: s.freeSummon || s.gems >= KB.SUMMON_COST.ten, dungeon: s.keys.gold + s.keys.trial > 0, more: !s.gift || KB.QUESTS.some(q => !s.questDone[q.id] && (s.quests[q.id] || 0) >= q.goal) };
    document.querySelectorAll('#tabs button').forEach(b => { const on = !!flags[b.dataset.tab]; let d = b.querySelector('.dot'); if (on && !d) { d = document.createElement('span'); d.className = 'dot'; b.appendChild(d); } if (!on && d) d.remove(); });
  }

  /* --- Train --- */
  function statText(k, L) {
    const v = KB.statValue[k](L);
    switch (k) { case 'atk': return fmt(v); case 'hp': return fmt(v); case 'regen': return (v * 100).toFixed(2) + '%/s'; case 'crit': return (Math.min(0.95, v) * 100).toFixed(1) + '%'; case 'critDmg': return Math.round(v * 100) + '%'; case 'speed': return v.toFixed(2) + 'x'; }
  }
  function tabHero() {

    for (const k of KB.STAT_ORDER) {

    }
    return h;
  }
  // one tap = one upgrade (no auto-repeat: the panel re-renders under the finger)
  $('panel').addEventListener('click', e => {
    const b = e.target.closest('[data-up]'); if (!b) return;
    const r = S.upgradeStat(app.save, b.dataset.up, app.mult);

  });

  /* --- Gear --- */
  function itemTile(kind, it) {
    const s = app.save, own = s[ownKey(kind)][it.id], eq = s.equip[kind] === it.id;
    if (!own) return '<div class="item locked r' + it.r + '" data-item="' + kind + ':' + it.id + '"><canvas data-item="' + kind + ':' + it.id + '"></canvas><span class="lv">?</span></div>';

  }
  function tabGear() {
    const s = app.save, st = S.heroStats(s), w = st.weapon, a = st.armor;
    let h = '<div class="card hero-card"><canvas data-hero="1"></canvas><div class="eq">' +
      '<div class="eqslot"><canvas data-item="weapon:' + w.id + '"></canvas><div><b class="tr' + w.r + '">' + w.name + '</b><span>Lv ' + s.weapons[w.id].lv + ' · ATK +' + fmt(KB.gearEquip(w, s.weapons[w.id].lv) * 100) + '%</span></div></div>' +
      '<div class="eqslot"><canvas data-item="armor:' + a.id + '"></canvas><div><b class="tr' + a.r + '">' + a.name + '</b><span>Lv ' + s.armors[a.id].lv + ' · HP +' + fmt(KB.gearEquip(a, s.armors[a.id].lv) * 100) + '%</span></div></div>' +
      '<div class="row"><button class="btn btn-sm btn-gold" data-a="enhanceAll" style="flex:1">▲ Enhance all</button><button class="btn btn-sm" data-a="bestGear" style="flex:1">Equip best</button></div></div></div>';
    h += '<h3>Weapons <span class="right muted small">Owned bonus: ATK +' + fmt(KB.WEAPONS.reduce((t, x) => t + (s.weapons[x.id] ? KB.gearOwn(x, s.weapons[x.id].lv) : 0), 0) * 100) + '%</span></h3><div class="grid">' + KB.WEAPONS.map(x => itemTile('weapon', x)).join('') + '</div>';
    h += '<h3 style="margin-top:14px">Armor <span class="right muted small">Owned bonus: HP +' + fmt(KB.ARMORS.reduce((t, x) => t + (s.armors[x.id] ? KB.gearOwn(x, s.armors[x.id].lv) : 0), 0) * 100) + '%</span></h3><div class="grid">' + KB.ARMORS.map(x => itemTile('armor', x)).join('') + '</div>';
    return h;
  }
  function itemModal(kind, id) {
    const s = app.save, it = S.byId(kind, id), own = s[ownKey(kind)][id], lv = own ? own.lv : 1, stat = kind === 'weapon' ? 'ATK' : 'HP';
    const need = KB.dupesFor(lv);
    modal('<div class="item-detail"><canvas data-item="' + kind + ':' + id + '" style="border-color:' + RAR[it.r].color + '"></canvas></div><h2 class="tr' + it.r + '" style="color:' + RAR[it.r].color + '">' + it.name + '</h2><p class="muted small">' + RAR[it.r].name + ' ' + kind + (it.fx ? ' · ' + it.fx + ' aura' : '') + '</p>' +
      '<div class="kv"><span>Level</span><b>' + (own ? lv + ' / ' + KB.GEAR_MAX_LEVEL : 'Not owned') + '</b></div><div class="kv"><span>Equipped ' + stat + '</span><b>+' + fmt(KB.gearEquip(it, lv) * 100) + '%</b></div><div class="kv"><span>Owned ' + stat + ' (always on)</span><b>+' + fmt(KB.gearOwn(it, lv) * 100) + '%</b></div>' +
      (own ? '<div class="kv"><span>Copies</span><b>' + own.n + ' / ' + need + '</b></div>' : '') +
      '<div class="acts">' + (own ? '<button class="btn" data-eq="1"' + (s.equip[kind] === id ? ' disabled' : '') + '>' + (s.equip[kind] === id ? 'Equipped' : 'Equip') + '</button><button class="btn btn-gold" data-lvl="1"' + (S.canLevel(s, kind, id) ? '' : ' disabled') + '>▲ Enhance</button>' : '<button class="btn" data-close>Find it in Summon</button>') + '</div>', e => {
      if (e.target.closest('[data-eq]')) { S.equip(s, kind, id); sfx('upgrade'); closeModal(); refresh(); }
      if (e.target.closest('[data-lvl]')) { const r = S.levelItem(s, kind, id); if (!r.ok) return fail(r); sfx('upgrade'); refresh(); itemModal(kind, id); }
    });
  }

  /* --- Skills --- */
  function tabSkills() {
    const s = app.save, open = S.slotsOpen(s);
    let h = '<h3>Equipped <span class="right muted small">' + open + ' / 4 slots</span></h3><div class="card row" style="justify-content:space-around">' + [0, 1, 2, 3].map(i => { const id = s.equip.skills[i]; const d = id && KB.SKILLS.find(x => x.id === id); return '<div class="sk ' + (i >= open ? 'empty' : '') + '" style="width:56px;height:56px">' + (i >= open ? '🔒' : d ? d.icon : '＋') + '</div>'; }).join('') + '</div>';
    h += '<p class="muted small" style="margin:2px 4px 8px">Slots unlock at stages ' + KB.SKILL_SLOT_UNLOCK.map(KB.stageLabel).join(', ') + '. Tap a skill to equip it. Copies from summons level skills up.</p>';
    for (const d of KB.SKILLS) {
      const own = s.skills[d.id], eq = s.equip.skills.includes(d.id), lv = own ? own.lv : 1, need = KB.dupesFor(lv);
      h += '<div class="card skrow ' + (own ? '' : 'locked') + '" data-skill="' + d.id + '"><div class="sk r' + d.r + '" style="border-color:' + RAR[d.r].color + '">' + d.icon + '</div><div class="info"><b>' + d.name + ' <span class="tr' + d.r + ' small">' + RAR[d.r].name + '</span></b><span>' + d.desc + '</span>' +
        (own ? '<div class="small"><span class="muted">Lv ' + lv + ' · ' + (d.pct ? Math.round(d.pct * KB.skillMult(lv) * 100) + '% ATK' + (d.hits > 1 ? ' ×' + d.hits : '') + ' · ' : '') + (d.cd * KB.skillCdMult(lv)).toFixed(1) + 's</span></div><div class="copies"><i style="width:' + Math.min(100, own.n / need * 100) + '%"></i></div>' : '<div class="small muted">Not owned · summon to unlock</div>') + '</div>' +
        (own ? (S.canLevel(s, 'skill', d.id) ? '<button class="btn btn-sm btn-gold" data-sklv="' + d.id + '">▲</button>' : '') + '<button class="btn btn-sm ' + (eq ? 'btn-red' : '') + '" data-skeq="' + d.id + '">' + (eq ? 'Remove' : 'Equip') + '</button>' : '') + '</div>';
    }
    return h;
  }

  /* --- Summon --- */
  function tabSummon() {
    const s = app.save;
    const B = [['weapon', 'Blade Shrine', '⚔️'], ['armor', 'Armor Shrine', '🛡️'], ['skill', 'Scroll Shrine', '📜']];
    let h = '<h3>Summon <span class="right">' + gemIc + ' <b class="num" style="font-size:18px">' + fmt(s.gems) + '</b></span></h3>';
    for (const [b, name, ic] of B) {
      const lv = s.summonLv[b], need = KB.summonLevelNeed(lv), rates = KB.summonRates(lv);
      h += '<div class="banner ' + b + '"><div class="bg">' + ic + '</div><h4>' + name + '</h4><div class="lvl">Shrine level ' + lv + (lv < 10 ? ' · ' + s.summonXp[b] + ' / ' + need + ' summons to next' : ' (max)') + '</div>' +
        '<div class="rates">' + rates.map((r, i) => '<span class="tr' + i + '">' + RAR[i].name + ' ' + (r * 100).toFixed(1) + '%</span>').join('') + '</div>' +
        '<div class="btns">' + (s.freeSummon ? '<button class="btn btn-blue" data-sum="' + b + ':free">Free ×1<small class="small">daily</small></button>' : '') +
        '<button class="btn" data-sum="' + b + ':1">×1<small class="num">' + KB.SUMMON_COST.one + ' 💎</small></button><button class="btn btn-gold" data-sum="' + b + ':10">×10<small class="num">' + KB.SUMMON_COST.ten + ' 💎</small></button></div></div>';
    }
    h += '<p class="muted small" style="text-align:center">Gems come from bosses, quests, dungeons and the daily gift. No real money, ever.</p>';
    return h;
  }
  function doSummon(b, n) {
    const s = app.save, free = n === 'free', r = S.summon(s, b, free ? 1 : +n, Math.random, free);
    if (!r.ok) return fail(r);
    sfx('summon'); const best = Math.max(...r.out.map(o => o.r)); if (best >= 3) setTimeout(() => sfx('rare'), 300);
    const tile = (o, i) => { const it = S.byId(b, o.id); return '<div class="pull" style="border-color:' + RAR[o.r].color + ';animation-delay:' + (i * 0.08) + 's;box-shadow:' + (o.r >= 3 ? '0 0 14px ' + RAR[o.r].color : 'none') + '">' + (b === 'skill' ? '<div class="em">' + it.icon + '</div>' : '<canvas data-item="' + b + ':' + o.id + '"></canvas>') + (o.res === 'new' ? '<span class="new">NEW</span>' : '') + '</div>'; };
    modal('<h2>' + (best >= 3 ? '✨ ' + RAR[best].name + '! ✨' : 'Summon results') + '</h2><div class="pulls">' + r.out.map(tile).join('') + '</div>' + (r.out.equipped ? '<p class="small" style="color:var(--green)">A stronger item was equipped automatically.</p>' : '') +
      '<div class="acts"><button class="btn" data-close>OK</button><button class="btn btn-gold" data-again="1">Again ×10</button></div>', e => { if (e.target.closest('[data-again]')) { closeModal(); doSummon(b, 10); } });
    persist(true); refresh();
  }

  /* --- Dungeon --- */
  function tabDungeon() {
    const s = app.save; let h = '<h3>Dungeons <span class="right muted small">Keys refill daily</span></h3>';
    for (const k of ['gold', 'trial']) {
      const D = KB.DUNGEONS[k];
      h += '<div class="dun ' + k + '"><div class="bg">' + D.icon + '</div><h4>' + D.name + ' <span class="muted small">Lv ' + s.dungeon[k] + '</span></h4><p class="small muted" style="margin:4px 0">' + D.desc + '</p>' +
        '<div class="small">' + (k === 'gold' ? 'Reward: about <b>' + fmt(KB.killGold(s.maxStage) * 2.2 * 22 * KB.soulBonus(s.souls)) + '</b> gold for 22 kills (22+ kills levels it up)' : 'Reward: <b>' + KB.trialGems(s.dungeon.trial) + '</b> gems · a failed trial returns its key') + '</div>' +
        '<div class="row" style="margin-top:8px"><div class="keys">' + '🗝️'.repeat(Math.min(6, s.keys[k])) + (s.keys[k] ? '' : '<span class="muted small">No keys</span>') + '</div><div class="spacer"></div><button class="btn ' + (s.keys[k] ? 'btn-red' : 'off') + '" data-dun="' + k + '">Enter</button></div></div>';
    }
    return h;
  }
  function enterDungeon(k) {
    const s = app.save; if (app.game.mode !== 'stage') return toast('Already in a dungeon');
    if (s.keys[k] <= 0) return fail({ reason: 'No keys left (more tomorrow or in the shop)' });
    s.keys[k]--; app.game = new KB.Game(s, { mode: k }); sfx('boss'); banner(KB.DUNGEONS[k].name.toUpperCase(), k === 'gold' ? '30 seconds · slay them all' : '40 seconds · defeat the guardian'); renderTab(); persist(true);
  }
  function dungeonResult(r) {
    const s = app.save, win = r.win;
    const rw = r.mode === 'gold' ? '<span>' + goldIc + fmt(r.reward.gold) + '</span>' : r.reward.gems ? '<span>' + gemIc + r.reward.gems + '</span>' : '';
    modal('<h2>' + (r.mode === 'gold' ? 'Cavern cleared' : win ? 'Trial passed!' : 'Trial failed') + '</h2>' + (r.mode === 'gold' ? '<p class="muted">' + r.reward.kills + ' foes slain</p>' : '') + (rw ? '<div class="big-reward">' + rw + '</div>' : '<p class="muted">Your key was returned. Grow stronger and try again.</p>') +
      '<div class="acts" data-lock><button class="btn btn-gold" data-back="1">Return</button></div>', e => { if (e.target.closest('[data-back]')) { closeModal(); sfx(win ? 'clear' : 'click'); newStageGame(); refresh(); persist(true); } });
  }

  /* --- Quests & more --- */
  function tabMore() {
    const s = app.save, souls = KB.ascendSouls(s.maxStage);
    let h = '<div class="card row"><div style="font-size:30px">🎁</div><div style="flex:1"><b>Daily gift</b><div class="muted small">80 gems and a bag of gold</div></div><button class="btn ' + (s.gift ? 'off' : 'btn-gold') + '" data-a="gift">' + (s.gift ? 'Claimed' : 'Claim') + '</button></div>';
    h += '<h3>Daily quests</h3>';
    for (const q of KB.QUESTS) { const v = Math.min(q.goal, s.quests[q.id] || 0), done = s.questDone[q.id]; h += '<div class="card quest ' + (done ? 'done' : '') + '"><div class="info"><b>' + q.name + '</b><div class="copies"><i style="width:' + (v / q.goal * 100) + '%"></i></div><span class="muted small">' + v + ' / ' + q.goal + '</span></div><button class="btn btn-sm ' + (done ? 'off' : v >= q.goal ? 'btn-gold' : 'off') + '" data-q="' + q.id + '">' + (done ? '✓' : q.gems + ' 💎') + '</button></div>'; }
    h += '<h3>Shop <span class="right muted small">gems only</span></h3>';
    for (const it of S.SHOP) h += '<div class="card row"><div style="font-size:26px">' + it.icon + '</div><div style="flex:1"><b>' + it.name + '</b><div class="muted small">' + (it.gold ? fmt(it.gold(s)) + ' gold' : '+1 key') + '</div></div><button class="btn btn-sm btn-blue" data-buy="' + it.id + '">' + it.gems + ' 💎</button></div>';
    h += '<h3>Ascension</h3><div class="card"><div class="row"><div style="font-size:30px">🌕</div><div style="flex:1"><b>Ascend</b><div class="muted small">Restart from stage 1-1 and turn your progress into Souls. Each Soul gives +10% ATK, HP and gold forever. Gear, skills and gems are kept.</div></div></div>' +
      '<div class="kv"><span>Souls owned</span><b>' + s.souls + ' (×' + KB.soulBonus(s.souls).toFixed(1) + ')</b></div><div class="kv"><span>Souls if you ascend now</span><b>+' + souls + '</b></div><div class="kv"><span>Best stage</span><b>' + KB.stageLabel(s.bestStage) + '</b></div>' +
      '<button class="btn ' + (souls ? 'btn-red' : 'off') + '" data-a="ascend" style="width:100%;margin-top:8px">' + (souls ? 'Ascend for +' + souls + ' souls' : 'Unlocks at stage ' + KB.stageLabel(KB.ASCEND_STAGE)) + '</button></div>';
    h += '<h3>Records</h3><div class="card"><div class="kv"><span>Foes slain</span><b>' + fmt(s.totals.kills) + '</b></div><div class="kv"><span>Bosses slain</span><b>' + fmt(s.totals.bosses) + '</b></div><div class="kv"><span>Summons</span><b>' + fmt(s.totals.summons) + '</b></div><div class="kv"><span>Ascensions</span><b>' + s.ascensions + '</b></div></div>';
    h += '<button class="btn" data-a="settings" style="width:100%">⚙ Settings & redeem code</button>';
    return h;
  }
  function settings() {
    const s = app.save, tg = (k, on) => '<button class="toggle ' + (on ? 'on' : '') + '" data-tg="' + k + '"></button>';
    modal('<h2>Settings</h2><div class="kv" style="align-items:center"><span>Sound effects</span>' + tg('sound', s.settings.sound) + '</div><div class="kv" style="align-items:center"><span>Music</span>' + tg('music', s.settings.music) + '</div><div class="kv" style="align-items:center"><span>High quality effects</span>' + tg('quality', s.settings.quality !== 'low') + '</div>' +
      '<h3 style="text-align:left;color:var(--gold);margin:14px 0 6px">Redeem code</h3><div class="row"><input class="code" id="codeIn" maxlength="20" placeholder="ENTER CODE"><button class="btn btn-gold" data-redeem="1">Redeem</button></div>' +
      '<p class="muted small" style="margin-top:14px">Kage Blade · an original offline idle game. Progress is saved on this device.</p>' +
      '<div class="acts"><button class="btn" data-reset="1">Reset progress</button><button class="btn btn-red" data-close>Close</button></div>', e => {
      const t = e.target.closest('[data-tg]');
      if (t) { const k = t.dataset.tg; if (k === 'quality') s.settings.quality = s.settings.quality === 'low' ? 'high' : 'low'; else s.settings[k] = !s.settings[k]; if (k === 'music') { if (s.settings.music) KB.Audio.startMusic(); else KB.Audio.stopMusic(); } t.classList.toggle('on'); sfx('click'); persist(true); }
      if (e.target.closest('[data-redeem]')) { const r = S.redeem(s, $('codeIn').value); if (!r.ok) return fail(r); sfx('rare'); toast('Redeemed: ' + (r.rw.gems ? r.rw.gems + ' gems ' : '') + (r.rw.gold ? r.rw.gold + ' gold' : '')); $('codeIn').value = ''; persist(true); refresh(); }
      if (e.target.closest('[data-reset]')) { if (confirmReset()) { localStorage.removeItem(KB.SAVE_KEY); app.save = S.defaults(); newStageGame(); closeModal(); refresh(); toast('Progress reset'); } }
    });
  }
  let resetArm = 0;
  function confirmReset() { const n = Date.now(); if (n - resetArm < 3000) return true; resetArm = n; toast('Tap reset again to erase everything'); return false; }

  /* ---------------- Panel clicks ---------------- */
  $('panel').addEventListener('click', e => {
    const s = app.save, t = e.target;
    const m = t.closest('[data-mult]'); if (m) { app.mult = +m.dataset.mult; sfx('click'); return renderTab(); }
    const it = t.closest('.item[data-item]'); if (it) { sfx('click'); const [k, id] = it.dataset.item.split(':'); return itemModal(k, id); }
    const a = t.closest('[data-a]');
    if (a) switch (a.dataset.a) {
      case 'enhanceAll': { const n = S.levelAll(s, 'weapon') + S.levelAll(s, 'armor'); if (!n) return fail({ reason: 'Not enough copies yet' }); S.autoEquip(s); sfx('upgrade'); toast(n + ' enhancements'); return refresh(); }
      case 'bestGear': S.autoEquip(s); sfx('click'); return refresh();
      case 'gift': { const r = S.claimGift(s); if (!r.ok) return fail(r); sfx('rare'); toast('+' + r.gems + ' gems, +' + fmt(r.gold) + ' gold'); persist(true); return refresh(); }
      case 'settings': return settings();
      case 'ascend': {
        const n = KB.ascendSouls(s.maxStage); if (!n) return fail({ reason: 'Reach stage ' + KB.stageLabel(KB.ASCEND_STAGE) + ' first' });
        return modal('<h2>Ascend?</h2><p>You return to stage 1-1 with <b>+' + n + ' souls</b> (×' + KB.soulBonus(s.souls + n).toFixed(1) + ' ATK, HP and gold).</p><p class="muted small">Stat training and gold reset. Gear, skills, gems and dungeon levels stay.</p><div class="acts"><button class="btn" data-close>Not yet</button><button class="btn btn-red" data-asc="1">Ascend</button></div>', ev => {
          if (!ev.target.closest('[data-asc]')) return; const r = S.ascend(s); if (!r.ok) return fail(r); closeModal(); sfx('rare'); banner('ASCENDED', '+' + r.souls + ' souls'); newStageGame(); persist(true); refresh();
        });
      }
    }
    const sk = t.closest('[data-skeq]'); if (sk) { const r = S.equipSkill(s, sk.dataset.skeq); if (!r.ok) return fail(r); sfx('click'); app.game.cds = app.game.cds.map(c => Math.max(c, 1)); return refresh(); }
    const sl = t.closest('[data-sklv]'); if (sl) { const r = S.levelItem(s, 'skill', sl.dataset.sklv); if (!r.ok) return fail(r); sfx('upgrade'); return refresh(); }
    const su = t.closest('[data-sum]'); if (su) { const [b, n] = su.dataset.sum.split(':'); return doSummon(b, n); }
    const du = t.closest('[data-dun]'); if (du) return enterDungeon(du.dataset.dun);
    const q = t.closest('[data-q]'); if (q) { const r = S.claimQuest(s, q.dataset.q); if (!r.ok) return fail(r); sfx('rare'); toast('+' + r.gems + ' gems'); persist(true); return refresh(); }
    const bu = t.closest('[data-buy]'); if (bu) { const r = S.buy(s, bu.dataset.buy); if (!r.ok) return fail(r); sfx('coin'); toast(r.gold ? '+' + fmt(r.gold) + ' gold' : '+1 key'); persist(true); return refresh(); }
  });

  /* ---------------- Lifecycle ---------------- */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { persist(true); app.hidden = Date.now(); KB.Audio.stopMusic(); return; }
    if (!app.started) return;
    if (app.save.settings.music) KB.Audio.startMusic();
    S.rollover(app.save);
    const off = app.hidden && Date.now() - app.hidden > 60000 ? S.offline(Object.assign({}, app.save, { lastSeen: app.hidden })) : null;
    app.hidden = 0; last = performance.now();
    if (off && app.game.mode === 'stage') offlineModal(off);
  });
  window.addEventListener('pagehide', () => persist(true));
  setInterval(() => { if (app.started && S.rollover(app.save)) { toast('A new day! Quests and keys refreshed.'); refresh(); } }, 30000);
  requestAnimationFrame(titleLoop);
})();

</script>
</body>
</html>
