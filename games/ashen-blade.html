<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<title>Ashen Blade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0a12; --panel: #1a1420; --panel2: #241b2c; --line: rgba(232, 184, 74, 0.28); --gold: #e8b84a; --gold2: #ffd98a; --text: #f2e9da; --muted: #a99bb0;
  --red: #e2483a; --blue: #5fb0ff; --green: #6ad46a; --ember: #ff8a3a;
  --r: 14px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3, .serif { font-family: 'Cinzel', Georgia, 'Times New Roman', serif; letter-spacing: 0.02em; }
#stage { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; background: linear-gradient(#3a2e44, #2a2032); border: 1px solid rgba(255, 255, 255, 0.12); font-weight: 800; color: var(--text); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); transition: transform 0.08s, filter 0.15s; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.gold { background: linear-gradient(#ffd98a, #e8a83a 55%, #b8782a); color: #2a1606; border-color: #fff1c0; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35); }
.btn.red { background: linear-gradient(#ff7a5a, #c9382a); border-color: #ffb8a0; }
.btn.ghost { background: rgba(255, 255, 255, 0.06); }
.btn:disabled { filter: grayscale(0.8) brightness(0.6); cursor: default; }
.btn.big { min-height: 58px; font-size: 1.2rem; padding: 12px 28px; font-family: 'Cinzel', Georgia, serif; font-weight: 900; letter-spacing: 0.05em; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(10, 6, 14, 0.7); border: 1px solid var(--line); font-weight: 800; font-size: 0.95rem; }

/* ---------- hub ---------- */
#hub { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; }
#hub > * { pointer-events: auto; }
.topbar { display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) 14px 8px; }
.logo { font-family: 'Cinzel', Georgia, serif; font-weight: 900; font-size: 1.25rem; line-height: 1; color: var(--gold2); text-shadow: 0 2px 0 #5a2a0a, 0 0 18px rgba(255, 140, 50, 0.5); margin-right: auto; }
.logo small { display: block; font-size: 0.6rem; letter-spacing: 0.3em; color: var(--muted); text-shadow: none; margin-top: 3px; }
.hub-mid { flex: 1; position: relative; pointer-events: none; }
.hero-name { position: absolute; left: 0; right: 0; top: 8px; text-align: center; pointer-events: none; }
.hero-name h2 { margin: 0; font-size: 1.7rem; color: var(--gold2); text-shadow: 0 2px 0 #000, 0 0 20px rgba(0, 0, 0, 0.8); }
.hero-name p { margin: 2px 0 0; color: var(--muted); font-weight: 700; text-shadow: 0 1px 2px #000; }
.hero-arrow { position: absolute; top: 45%; width: 46px; height: 46px; border-radius: 50%; background: rgba(10, 6, 14, 0.7); border: 1px solid var(--line); font-size: 1.4rem; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
.hero-arrow.l { left: 12px; } .hero-arrow.r { right: 12px; }
.hero-info { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: auto; }
.skills-row { display: flex; gap: 8px; }
.skill-pill { width: 52px; height: 52px; border-radius: 12px; background: rgba(10, 6, 14, 0.75); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; position: relative; }
.skill-pill.ult { border-color: var(--gold); box-shadow: 0 0 10px rgba(232, 184, 74, 0.35); }
.stats-line { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.stats-line .chip { font-size: 0.85rem; padding: 4px 10px; }
.hub-bottom { padding: 8px 14px calc(10px + var(--safe-b)); display: flex; flex-direction: column; gap: 10px; background: linear-gradient(transparent, rgba(8, 5, 12, 0.92) 30%); }
.tiers { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tiers::-webkit-scrollbar { display: none; }
.tier { flex: none; padding: 7px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); font-weight: 800; font-size: 0.85rem; white-space: nowrap; }
.tier.on { background: linear-gradient(#5a1a2a, #3a0e1a); border-color: #ff7a5a; color: #ffd0c0; }
.tier.locked { opacity: 0.4; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); font-weight: 800; font-size: 0.8rem; }
.nav button span { font-size: 1.4rem; line-height: 1; }
.nav .dot { position: relative; } .nav .dot::after { content: ''; position: absolute; top: 6px; right: 22%; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }

/* ---------- sheets ---------- */
#sheet { position: absolute; inset: 0; background: rgba(5, 3, 8, 0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet-in { width: 100%; max-width: 560px; max-height: 88%; background: linear-gradient(var(--panel2), var(--panel)); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.sheet-head h2 { margin: 0; font-size: 1.3rem; color: var(--gold2); flex: 1; }
.sheet-body { overflow-y: auto; padding: 12px 14px calc(18px + var(--safe-b)); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.x { width: 40px; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, 0.07); font-size: 1.2rem; }
.sec { margin: 4px 0 14px; }
.sec h3 { margin: 0 0 8px; font-size: 0.95rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 8px; }
.row .ic { width: 44px; height: 44px; flex: none; border-radius: 10px; background: rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; } .row .tx small { color: var(--muted); font-weight: 600; }
.lv { color: var(--gold); font-weight: 900; font-size: 0.85rem; }
.equip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border-radius: 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px; text-align: center; min-height: 118px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.slot canvas { width: 54px; height: 54px; }
.slot .nm { font-size: 0.72rem; font-weight: 800; line-height: 1.15; }
.slot .empty { color: var(--muted); font-size: 0.8rem; margin-top: 18px; }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.item { position: relative; aspect-ratio: 1; border-radius: 12px; background: rgba(0, 0, 0, 0.35); border: 2px solid; display: flex; align-items: center; justify-content: center; }
.item canvas { width: 80%; height: 80%; }
.item .il { position: absolute; bottom: 2px; right: 4px; font-size: 0.65rem; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000; }
.item.eq::before { content: 'E'; position: absolute; top: 2px; left: 4px; font-size: 0.65rem; font-weight: 900; color: var(--gold2); }
.item.up::after { content: '▲'; position: absolute; top: 2px; right: 4px; font-size: 0.7rem; color: var(--green); }
.detail { border-radius: 14px; padding: 12px; background: rgba(0, 0, 0, 0.35); border: 1px solid; margin-bottom: 12px; }
.detail h4 { margin: 0 0 4px; font-family: 'Cinzel', Georgia, serif; font-size: 1.05rem; }
.detail ul { margin: 6px 0 10px; padding-left: 18px; font-weight: 700; }
.detail .acts { display: flex; gap: 8px; }
.cmp-up { color: var(--green); } .cmp-dn { color: var(--red); }
.field { display: flex; gap: 8px; }
.field input { flex: 1; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); color: var(--text); padding: 0 14px; font: inherit; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); margin-bottom: 8px; font-weight: 800; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); }
.help p { margin: 0 0 10px; color: #ddd0c4; line-height: 1.45; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(8px + var(--safe-t)) 10px 0; display: flex; gap: 8px; align-items: flex-start; }
.hpbox { flex: 1; max-width: 300px; }
.hpbar { position: relative; height: 22px; border-radius: 11px; background: rgba(10, 4, 8, 0.85); border: 2px solid #5a2a2a; overflow: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
.hpbar i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(#ff7a6a, #c92a2a 60%, #8a1a1a); transition: transform 0.15s; }
.hpbar i.lag { background: #ffd0a0; transition: transform 0.6s 0.2s; }
.hpbar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; text-shadow: 0 1px 2px #000; }
.hud-sub { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.hud-sub .chip { font-size: 0.8rem; padding: 3px 9px; }
.hud-btn { pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; background: rgba(10, 6, 14, 0.75); border: 1px solid var(--line); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
.bossbar { position: absolute; left: 50%; top: calc(76px + var(--safe-t)); transform: translateX(-50%); width: min(86vw, 520px); text-align: center; }
.bossbar b { font-family: 'Cinzel', Georgia, serif; font-size: 0.95rem; color: #ffd0c0; text-shadow: 0 2px 2px #000; }
.bossbar .bar { height: 14px; margin-top: 3px; border-radius: 7px; background: rgba(10, 4, 8, 0.85); border: 2px solid #7a2a1a; overflow: hidden; }
.bossbar .bar i { display: block; height: 100%; background: linear-gradient(#ffb84a, #e2482a); transform-origin: left; transition: transform 0.2s; }
.actions { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(16px + var(--safe-b)); width: 210px; height: 210px; pointer-events: none; }
.act-btn { pointer-events: auto; position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(90, 70, 110, 0.9), rgba(25, 16, 32, 0.92)); border: 2px solid rgba(232, 184, 74, 0.45); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6); overflow: hidden; touch-action: none; }
.act-btn.down { transform: scale(0.92); filter: brightness(1.3); }
.act-btn.atk { width: 92px; height: 92px; right: 6px; bottom: 6px; font-size: 2.4rem; border-color: var(--gold); }
.act-btn.dash { width: 58px; height: 58px; right: 108px; bottom: 0; }
.act-btn.s1 { width: 60px; height: 60px; right: 112px; bottom: 70px; }
.act-btn.s2 { width: 60px; height: 60px; right: 62px; bottom: 116px; }
.act-btn.ult { width: 64px; height: 64px; right: 0; bottom: 120px; border-color: #ffb33a; }
.act-btn .cd { position: absolute; inset: 0; background: conic-gradient(rgba(5, 2, 8, 0.78) var(--p, 0%), transparent 0); display: flex; align-items: center; justify-content: center; font-size: 0.95rem; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000; }
.potion-btn { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(20px + var(--safe-b)); pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; }
.potion-btn em { position: absolute; right: -2px; top: -2px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); font-style: normal; font-size: 0.75rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
#knobBase { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; background: rgba(255, 255, 255, 0.07); border: 2px solid rgba(255, 255, 255, 0.18); display: none; pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f2e9da, #a99bb0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
.hint { position: absolute; left: 50%; bottom: calc(240px + var(--safe-b)); transform: translateX(-50%); padding: 8px 14px; border-radius: 12px; background: rgba(10, 6, 14, 0.8); border: 1px solid var(--line); font-weight: 800; font-size: 0.9rem; white-space: nowrap; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: 0.6; } }
#lowhp { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(200, 0, 0, 0.55); opacity: 0; transition: opacity 0.3s; }

/* ---------- banners, toasts, modal ---------- */
#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; z-index: 15; }
#banner .in { display: inline-block; padding: 14px 34px; background: linear-gradient(90deg, transparent, rgba(8, 4, 10, 0.85) 20%, rgba(8, 4, 10, 0.85) 80%, transparent); animation: bannerIn 2.4s forwards; }
#banner small { display: block; color: var(--gold); font-weight: 900; letter-spacing: 0.3em; font-size: 0.75rem; }
#banner b { display: block; font-family: 'Cinzel', Georgia, serif; font-size: 1.8rem; color: #fff3dc; text-shadow: 0 0 20px rgba(255, 140, 60, 0.6); }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(1.2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
#toasts { position: absolute; left: 50%; top: calc(110px + var(--safe-t)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 30; width: 92%; }
.toast { padding: 9px 14px; border-radius: 12px; background: rgba(12, 8, 16, 0.92); border: 1px solid var(--line); font-weight: 800; font-size: 0.9rem; animation: toast 2.6s forwards; display: flex; align-items: center; gap: 8px; }
.toast canvas { width: 34px; height: 34px; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#modal { position: absolute; inset: 0; z-index: 25; background: rgba(4, 2, 6, 0.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-in { width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto; background: linear-gradient(var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 20px; padding: 18px; text-align: center; animation: pop 0.25s ease-out; touch-action: pan-y; }
@keyframes pop { from { transform: scale(0.9); opacity: 0; } }
.modal-in h2 { margin: 0 0 4px; color: var(--gold2); font-size: 1.6rem; }
.modal-in .sub { color: var(--muted); font-weight: 700; margin: 0 0 14px; }
.boons { display: grid; gap: 10px; }
.boon { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; text-align: left; background: linear-gradient(135deg, rgba(90, 60, 120, 0.35), rgba(30, 20, 40, 0.6)); border: 1px solid rgba(232, 184, 74, 0.35); animation: pop 0.3s ease-out backwards; }
.boon:nth-child(2) { animation-delay: 0.08s; } .boon:nth-child(3) { animation-delay: 0.16s; }
.boon:active { transform: scale(0.98); }
.boon .bi { width: 52px; height: 52px; flex: none; border-radius: 14px; background: radial-gradient(circle, rgba(255, 200, 100, 0.35), rgba(0, 0, 0, 0.4)); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; }
.boon b { display: block; font-family: 'Cinzel', Georgia, serif; font-size: 1.05rem; color: var(--gold2); }
.boon small { font-weight: 700; color: #e4d8cc; }
.boon .stk { margin-left: auto; font-weight: 900; color: var(--muted); font-size: 0.8rem; }
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.res-grid div { padding: 10px 4px; border-radius: 12px; background: rgba(0, 0, 0, 0.3); font-weight: 900; }
.res-grid small { display: block; color: var(--muted); font-weight: 700; font-size: 0.75rem; }
.loot-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 8px 0 14px; }
.loot-row .item { width: 56px; }
.modal-acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
@media (orientation: landscape) and (max-height: 500px) {
  .hero-name h2 { font-size: 1.3rem; } .hub-bottom { flex-direction: row; align-items: center; } .tiers { flex: 1; } .nav { width: 300px; }
  .actions { transform: scale(0.85); transform-origin: right bottom; }
  .skills-row { display: none; } .hero-info { bottom: 4px; }
}

</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hub">
    <div class="topbar">
      <div class="logo">ASHEN BLADE<small>HACK &amp; SLASH</small></div>
      <span class="chip" id="hGold">🪙 0</span>
      <span class="chip" id="hGems">💎 0</span>
    </div>
    <div class="hub-mid">
      <div class="hero-name"><h2 id="heroName">Aldric</h2><p id="heroTitle">Knight of the Dawn</p></div>
      <button class="hero-arrow l" id="heroPrev" aria-label="Previous hero">‹</button>
      <button class="hero-arrow r" id="heroNext" aria-label="Next hero">›</button>
      <div class="hero-info">
        <div class="skills-row" id="heroSkills"></div>
        <div class="stats-line" id="heroStats"></div>
      </div>
    </div>
    <div class="hub-bottom">
      <div class="tiers" id="tiers"></div>
      <button class="btn gold big" id="startBtn">⚔ Enter the Crypt</button>
      <div class="nav">
        <button data-sheet="forge"><span>⚒</span>Forge</button>
        <button data-sheet="upgrades"><span>⬆</span>Upgrades</button>
        <button data-sheet="codex"><span>📜</span>Codex</button>
        <button data-sheet="more"><span>⚙</span>More</button>
      </div>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hpbox">
        <div class="hpbar"><i class="lag" id="hpLag"></i><i id="hpFill"></i><span id="hpText">100 / 100</span></div>
        <div class="hud-sub"><span class="chip" id="hudRoom">Act I · 1/5</span><span class="chip" id="hudGold">🪙 0</span><span class="chip" id="hudGems" hidden>💎 0</span></div>
      </div>
      <button class="hud-btn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
    <div class="bossbar" id="bossBar" hidden><b id="bossName">Boss</b><div class="bar"><i id="bossFill"></i></div></div>
    <div id="lowhp"></div>
    <div class="hint" id="hint" hidden></div>
    <button class="act-btn potion-btn" id="potBtn" aria-label="Drink potion">🧪<em id="potN">1</em></button>
    <div class="actions">
      <button class="act-btn atk" id="atkBtn" aria-label="Attack">⚔</button>
      <button class="act-btn dash" id="dashBtn" aria-label="Dash">💨<div class="cd" id="cdDash"></div></button>
      <button class="act-btn s1" id="s1Btn"><span></span><div class="cd" id="cd0"></div></button>
      <button class="act-btn s2" id="s2Btn"><span></span><div class="cd" id="cd1"></div></button>
      <button class="act-btn ult" id="ultBtn"><span></span><div class="cd" id="cd2"></div></button>
    </div>
  </div>
  <div id="knobBase"><div id="knob"></div></div>

  <div id="banner" hidden></div>
  <div id="toasts"></div>
  <div id="sheet" hidden></div>
  <div id="modal" hidden></div>
</div>

<script>
/* =====================================================================
 * Ruang Main portal codes.
 * Codes made in the portal's admin menu are cached in localStorage by the
 * portal page (key "ruangmain.codes"). Games served from the same portal
 * check this list after their own built-in codes. Only a hash of each
 * code is stored here, never the code itself.
 * ===================================================================== */
var RMCodes = (function () {
  const KEY = 'ruangmain.codes';
  const norm = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '');
  function fnv(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); }
  /** Portal hash of a code (same function in the portal page). */

    const reward = {}; for (const k in (e.reward || {})) { const v = Math.floor(+e.reward[k]); if (v > 0) reward[k] = v; }

  }

<script>
/* =====================================================================
 * Ashen Blade — state.js
 * Save data, permanent progression, gear and redeem codes.
 * ===================================================================== */
AB.util = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: Math.random,
  pick(arr) { return arr[Math.floor(AB.util.rand() * arr.length)]; },
  weighted(list) { let t = 0; for (const [, w] of list) t += w; let r = AB.util.rand() * t; for (const [v, w] of list) { r -= w; if (r <= 0) return v; } return list[list.length - 1][0]; },
  fmt(n) { n = Math.floor(n); if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K'; return String(n); },
  uid: () => Math.random().toString(36).slice(2, 9),
};

AB.State = (function () {
  const U = AB.util, C = AB.CONFIG;
  function fresh() {
    return {
      v: C.VERSION, gold: 200, gems: 0, hero: 'knight', heroes: { knight: true },
      upgrades: {}, inv: [], equip: { weapon: null, armor: null, charm: null },
      best: { act: 0, tier: 0 }, tier: 0, maxTier: 0, runs: 0, kills: 0, bossKills: 0,
      redeemed: [], settings: { sound: true, shake: true }, seenIntro: false,
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(C.SAVE_KEY); if (!raw) return fresh();
      const s = Object.assign(fresh(), JSON.parse(raw));
      s.equip = Object.assign({ weapon: null, armor: null, charm: null }, s.equip || {});
      s.settings = Object.assign({ sound: true, shake: true }, s.settings || {});
      return s;
    } catch (e) { return fresh(); }
  }
  function save(s) { try { localStorage.setItem(C.SAVE_KEY, JSON.stringify(s)); } catch (e) { /* storage blocked */ } }

  const upLevel = (s, id) => s.upgrades[id] || 0;
  const upCost = (s, id) => { const u = AB.UPGRADES[id], L = upLevel(s, id); return L >= u.max ? null : Math.round(u.cost * Math.pow(u.grow, L)); };
  function buyUpgrade(s, id) { const c = upCost(s, id); if (c == null || s.gold < c) return false; s.gold -= c; s.upgrades[id] = upLevel(s, id) + 1; return true; }

  const gearById = (s, id) => s.inv.find(g => g.id === id) || null;
  /** Total bonus stats from equipped gear. */
  function gearStats(s) {
    const out = { atk: 0, hp: 0, crit: 0, critDmg: 0, armor: 0, atkSpd: 0, cdr: 0, lifesteal: 0 };
    for (const slot of ['weapon', 'armor', 'charm']) { const g = gearById(s, s.equip[slot]); if (!g) continue; out[AB.GEAR[g.slot].main] += g.main; for (const a of g.affixes) out[a.k] += a.v; }
    return out;
  }
  /** Player stats at the start of a run. */
  function heroStats(s, heroId) {
    const h = AB.HEROES[heroId], g = gearStats(s), up = id => upLevel(s, id) * AB.UPGRADES[id].val, tier = s.tier || 0;
    const maxHp = Math.round((h.hp + g.hp) * (1 + up('vitality')));
    return {
      hero: heroId, maxHp, hp: maxHp, atk: (h.atk + g.atk) * (1 + up('might')),
      crit: h.crit + g.crit + up('precision'), critDmg: 1.6 + g.critDmg, armor: Math.min(0.75, h.armor + g.armor + up('guard')),
      atkSpd: 1 + g.atkSpd, cdr: Math.min(0.6, g.cdr + up('focus')), lifesteal: g.lifesteal, speed: h.speed,
      dmgMul: 1, speedMul: 1, goldMul: 1 + up('fortune'), thorns: 0, burn: 0, chain: 0, orbit: 0, explode: 0, revives: 0,
      potions: 1 + upLevel(s, 'potion'), tier,

  }
  function power(s, heroId) { const p = heroStats(s, heroId || s.hero); return Math.round(p.atk * (1 + p.crit * (p.critDmg - 1)) * p.atkSpd * 4 + p.maxHp * 0.6 / (1 - p.armor)); }

  /* ---------- gear ---------- */
  function rollRarity(boost = 0) {
    const list = AB.RARITY.map((r, i) => [i, r.w * (i ? 1 + boost * i : Math.max(0.2, 1 - boost))]);
    return U.weighted(list);
  }
  /** Gear item scaled by power level (1 + act/tier). */
  function makeGear(level, rarityIdx, slot) {
    slot = slot || U.pick(['weapon', 'armor', 'charm']);
    const G = AB.GEAR[slot], R = AB.RARITY[rarityIdx], scale = 1 + (level - 1) * 0.45;
    const main = G.base * R.mult * scale * (0.9 + U.rand() * 0.2);
    const keys = Object.keys(AB.AFFIXES).filter(k => k !== G.main), affixes = [];
    for (let i = 0; i < R.affixes; i++) { const k = keys.splice(Math.floor(U.rand() * keys.length), 1)[0]; affixes.push({ k, v: AB.AFFIXES[k].base * scale * (0.8 + U.rand() * 0.5) * (k === 'atk' || k === 'hp' ? 1 : Math.min(2, Math.sqrt(scale))) }); }
    return { id: U.uid(), slot, rarity: rarityIdx, level, main, affixes, name: U.pick(AB.GEAR_PREFIX) + ' ' + U.pick(G.names) };
  }
  function gearScore(g) { const R = AB.RARITY[g.rarity]; return Math.round(g.level * 10 * R.mult + g.affixes.length * 6 * g.level); }
  function salvageValue(g) { return Math.round(15 * AB.RARITY[g.rarity].mult * AB.RARITY[g.rarity].mult * g.level); }
  function addGear(s, g) { s.inv.push(g); if (s.inv.length > 40) { const worst = s.inv.filter(x => !Object.values(s.equip).includes(x.id)).sort((a, b) => gearScore(a) - gearScore(b))[0]; if (worst) { salvage(s, worst.id); } } return g; }
  function equip(s, id) { const g = gearById(s, id); if (!g) return false; s.equip[g.slot] = id; return true; }
  function salvage(s, id) { const g = gearById(s, id); if (!g || Object.values(s.equip).includes(id)) return 0; s.inv = s.inv.filter(x => x.id !== id); const v = salvageValue(g); s.gold += v; return v; }
  function salvageAll(s, maxRarity) { let t = 0; for (const g of s.inv.slice()) if (g.rarity <= maxRarity && !Object.values(s.equip).includes(g.id)) t += salvage(s, g.id); return t; }
  /** Equips any item that beats the currently equipped one. */
  function autoEquip(s) { for (const slot of ['weapon', 'armor', 'charm']) { const cur = gearById(s, s.equip[slot]); let best = cur; for (const g of s.inv) if (g.slot === slot && (!best || gearScore(g) > gearScore(best))) best = g; if (best && best !== cur) s.equip[slot] = best.id; } }

  function unlockHero(s, id) { const h = AB.HEROES[id]; if (s.heroes[id] || s.gems < h.cost) return false; s.gems -= h.cost; s.heroes[id] = true; return true; }

  /* ---------- run rewards ---------- */
  /** Applies the end-of-run result. r = { gold, gems, act, cleared, kills, bosses, loot:[] } */
  function finishRun(s, r) {
    s.runs++; s.gold += Math.round(r.gold); s.gems += r.gems || 0; s.kills += r.kills || 0; s.bossKills += r.bosses || 0;
    for (const g of r.loot || []) addGear(s, g);
    const prog = (s.tier || 0) * 10 + r.act;
    if (prog > s.best.tier * 10 + s.best.act) s.best = { act: r.act, tier: s.tier || 0 };
    if (r.cleared && (s.tier || 0) >= s.maxTier) s.maxTier = (s.tier || 0) + 1;
  }

  /* ---------- redeem ---------- */
  function hashCode(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
  function redeem(s, code) {
    const c = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
    if (!c) return { ok: false, reason: 'Enter a code' };
    let r = AB.CODES[c], h = 'b:' + hashCode(c), label = r && r.label;
    if (!r && typeof RMCodes !== 'undefined') {
      const p = RMCodes.find(c, C.GAME_ID);

  return Run;
})();

</script>
<script>
/* =====================================================================
 * Ashen Blade — input.js
 * Floating virtual joystick (left side of the screen), action buttons,
 * and keyboard controls. Writes into run.input.
 * ===================================================================== */
AB.Input = (function () {
  const st = { run: null, stick: null, keys: new Set(), atkHeld: false, el: null };
  function bind(stage, knobBase, knob) {
    st.el = stage;
    stage.addEventListener('pointerdown', e => {
      if (!st.run || st.stick || e.target.closest('button, #hub, #sheet, #modal, input, label')) return;
      if (e.clientX > window.innerWidth * 0.55) return;
      st.stick = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
      knobBase.style.display = 'block'; knobBase.style.left = e.clientX + 'px'; knobBase.style.top = e.clientY + 'px'; knob.style.transform = 'translate(-50%,-50%)';
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    stage.addEventListener('pointermove', e => {
      const s = st.stick; if (!s || s.id !== e.pointerId) return;
      let dx = e.clientX - s.x, dy = e.clientY - s.y; const m = Math.hypot(dx, dy), R = 52;
      if (m > R) { s.x += dx / m * (m - R); s.y += dy / m * (m - R); dx = e.clientX - s.x; dy = e.clientY - s.y; knobBase.style.left = s.x + 'px'; knobBase.style.top = s.y + 'px'; }
      s.dx = dx / R; s.dy = dy / R; knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
    });
    const end = e => { const s = st.stick; if (!s || s.id !== e.pointerId) return; st.stick = null; knobBase.style.display = 'none'; };
    stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
    window.addEventListener('keydown', e => {
      if (e.repeat) { st.keys.add(e.code); return; }
      st.keys.add(e.code); const r = st.run; if (!r) return;
      if (e.code === 'KeyK' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') r.input.dash = true;
      if (e.code === 'Digit1' || e.code === 'KeyU') r.input.skill[0] = true;
      if (e.code === 'Digit2' || e.code === 'KeyI') r.input.skill[1] = true;
      if (e.code === 'Digit3' || e.code === 'KeyO') r.input.skill[2] = true;
      if (e.code === 'KeyQ') r.input.potion = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => st.keys.delete(e.code));
    window.addEventListener('blur', () => { st.keys.clear(); st.atkHeld = false; st.stick = null; knobBase.style.display = 'none'; });
  }
  /** Hold-to-repeat button. */
  function holdButton(el, onDown, onUp) {
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('down'); onDown(); try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } });
    const up = e => { el.classList.remove('down'); if (onUp) onUp(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  }
  function apply() {
    const r = st.run; if (!r) return;
    let mx = 0, my = 0; const k = st.keys;
    if (k.has('KeyA') || k.has('ArrowLeft')) mx -= 1; if (k.has('KeyD') || k.has('ArrowRight')) mx += 1;
    if (k.has('KeyW') || k.has('ArrowUp')) my -= 1; if (k.has('KeyS') || k.has('ArrowDown')) my += 1;
    if (st.stick) { mx += st.stick.dx; my += st.stick.dy; }
    const m = Math.hypot(mx, my); if (m > 1) { mx /= m; my /= m; }
    r.input.mx = mx; r.input.my = my;
    r.input.attack = st.atkHeld || k.has('KeyJ') || k.has('Space');
  }
  function reset() { st.atkHeld = false; st.stick = null; st.keys.clear(); }
  return { bind, holdButton, apply, reset, st, set run(r) { st.run = r; }, get run() { return st.run; } };
})();

</script>
<script>
/* =====================================================================
 * Ashen Blade — ui.js
 * Hub (camp), sheets (forge, upgrades, codex, more), HUD, modals.
 * ===================================================================== */
AB.UI = (function () {
  const $ = id => document.getElementById(id), U = AB.util, S = AB.State;
  let app = null;
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const pct = v => Math.round(v * 100) + '%';

  /* ---------------- toasts & banners ---------------- */
  function toast(html, painter) {
    const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = html;
    if (painter) { const cv = document.createElement('canvas'); el.prepend(cv); requestAnimationFrame(() => painter(cv)); }
    $('toasts').appendChild(el); setTimeout(() => el.remove(), 2700);
    while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
  }
  function banner(sub, title) { const b = $('banner'); b.hidden = false; b.innerHTML = '<div class="in"><small>' + esc(sub) + '</small><b>' + esc(title) + '</b></div>'; clearTimeout(banner.t); banner.t = setTimeout(() => { b.hidden = true; }, 2500); }

  /* ---------------- hub ---------------- */
  function refreshHub() {
    const s = app.save, id = AB.HERO_ORDER[app.heroIdx], h = AB.HEROES[id], owned = !!s.heroes[id];
    $('hGold').textContent = '🪙 ' + U.fmt(s.gold); $('hGems').textContent = '💎 ' + U.fmt(s.gems);
    $('heroName').textContent = h.name; $('heroTitle').textContent = h.title;
    $('heroSkills').innerHTML = h.skills.map((k, i) => '<div class="skill-pill' + (i === 2 ? ' ult' : '') + '" title="' + esc(AB.SKILLS[k].name) + '">' + AB.SKILLS[k].icon + '</div>').join('');
    const st = S.heroStats(s, id);
    $('heroStats').innerHTML = owned
      ? '<span class="chip">❤ ' + st.maxHp + '</span><span class="chip">⚔ ' + Math.round(st.atk) + '</span><span class="chip">🎯 ' + pct(st.crit) + '</span><span class="chip">⚡ Power ' + U.fmt(S.power(s, id)) + '</span>'
      : '<span class="chip">' + esc(h.desc) + '</span>';
    const b = $('startBtn');
    if (owned) { b.textContent = '⚔ Enter the Crypt'; b.disabled = false; b.className = 'btn gold big'; }
    else { b.textContent = '🔓 Unlock · 💎 ' + h.cost; b.disabled = s.gems < h.cost; b.className = 'btn big' + (s.gems >= h.cost ? ' gold' : ''); }
    const tiers = []; for (let t = 0; t <= Math.min(9, s.maxTier + 1); t++) tiers.push('<button class="tier' + (t === s.tier ? ' on' : '') + (t > s.maxTier ? ' locked' : '') + '" data-tier="' + t + '">' + (t === 0 ? 'Normal' : 'Nightmare ' + toRoman(t)) + (t > s.maxTier ? ' 🔒' : '') + '</button>');
    $('tiers').innerHTML = tiers.join('');
    // forge dot when there is an upgrade to equip
    const nav = document.querySelector('[data-sheet="forge"]'); nav.classList.toggle('dot', hasUpgrade(s));
  }
  const toRoman = n => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][n] || String(n);
  function hasUpgrade(s) { for (const slot of ['weapon', 'armor', 'charm']) { const cur = S.gearById(s, s.equip[slot]); if (s.inv.some(g => g.slot === slot && (!cur || S.gearScore(g) > S.gearScore(cur)))) return true; } return false; }

  /* ---------------- sheets ---------------- */
  let curSheet = null, selGear = null;
  function openSheet(name) { curSheet = name; selGear = null; renderSheet(); $('sheet').hidden = false; AB.Audio.play('click'); }
  function closeSheet() { $('sheet').hidden = true; curSheet = null; refreshHub(); app.persist(); }
  function renderSheet() {
    const titles = { forge: '⚒ Forge', upgrades: '⬆ Upgrades', codex: '📜 Codex', more: '⚙ More' };
    const body = { forge: forgeHtml, upgrades: upgradesHtml, codex: codexHtml, more: moreHtml }[curSheet]();
    $('sheet').innerHTML = '<div class="sheet-in"><div class="sheet-head"><h2>' + titles[curSheet] + '</h2><span class="chip">🪙 ' + U.fmt(app.save.gold) + '</span><button class="x" data-close aria-label="Close">✕</button></div><div class="sheet-body">' + body + '</div></div>';
    paintCanvases($('sheet'));
  }
  function paintCanvases(root) {
    root.querySelectorAll('canvas[data-gear]').forEach(cv => { const g = S.gearById(app.save, cv.dataset.gear) || (app.lastLoot || []).find(x => x.id === cv.dataset.gear); if (g) AB.Art.gearIcon(cv, g); });
    root.querySelectorAll('canvas[data-enemy]').forEach(cv => AB.Art.enemyPortrait(cv, cv.dataset.enemy));
  }
  function gearLines(g) { const G = AB.GEAR[g.slot], main = AB.AFFIXES[G.main]; return ['<li>' + main.name + ' ' + main.fmt(g.main) + '</li>'].concat(g.affixes.map(a => '<li>' + AB.AFFIXES[a.k].name + ' ' + AB.AFFIXES[a.k].fmt(a.v) + '</li>')).join(''); }
  function forgeHtml() {
    const s = app.save, eq = Object.values(s.equip);
    let h = '<div class="sec"><h3>Equipped</h3><div class="equip-grid">';
    for (const slot of ['weapon', 'armor', 'charm']) { const g = S.gearById(s, s.equip[slot]); h += '<button class="slot" data-gsel="' + (g ? g.id : '') + '">' + (g ? '<canvas data-gear="' + g.id + '"></canvas><span class="nm" style="color:' + AB.RARITY[g.rarity].color + '">' + esc(g.name) + '</span><small class="lv">Lv ' + g.level + '</small>' : '<span class="ic">' + AB.GEAR[slot].icon + '</span><span class="empty">No ' + AB.GEAR[slot].name.toLowerCase() + '</span>') + '</button>'; }
    h += '</div></div>';
    const g = selGear && S.gearById(s, selGear);
    if (g) {
      const R = AB.RARITY[g.rarity], cur = S.gearById(s, s.equip[g.slot]), isEq = eq.includes(g.id);
      const diff = cur && !isEq ? S.gearScore(g) - S.gearScore(cur) : 0;
      h += '<div class="detail" style="border-color:' + R.color + '"><h4 style="color:' + R.color + '">' + esc(g.name) + '</h4><small>' + R.name + ' ' + AB.GEAR[g.slot].name + ' · Lv ' + g.level + ' · Score ' + S.gearScore(g) + (diff ? ' <span class="' + (diff > 0 ? 'cmp-up' : 'cmp-dn') + '">(' + (diff > 0 ? '+' : '') + diff + ')</span>' : '') + '</small><ul>' + gearLines(g) + '</ul><div class="acts">' +
        (isEq ? '<span class="chip">Equipped</span>' : '<button class="btn gold" data-equip="' + g.id + '">Equip</button><button class="btn" data-salv="' + g.id + '">Salvage +' + S.salvageValue(g) + ' 🪙</button>') + '</div></div>';
    }
    const items = s.inv.slice().sort((a, b) => b.rarity - a.rarity || S.gearScore(b) - S.gearScore(a));
    h += '<div class="sec"><h3>Inventory (' + s.inv.length + '/40)</h3>';
    if (!items.length) h += '<p style="color:var(--muted)">Clear rooms and slay bosses to find gear in chests.</p>';
    h += '<div class="inv">' + items.map(x => { const cur = S.gearById(s, s.equip[x.slot]); const up = !eq.includes(x.id) && (!cur || S.gearScore(x) > S.gearScore(cur)); return '<button class="item' + (eq.includes(x.id) ? ' eq' : '') + (up ? ' up' : '') + '" style="border-color:' + AB.RARITY[x.rarity].color + (x.id === selGear ? ';box-shadow:0 0 0 2px #fff' : '') + '" data-gsel="' + x.id + '"><canvas data-gear="' + x.id + '"></canvas><span class="il">' + x.level + '</span></button>'; }).join('') + '</div></div>';
    if (items.length) h += '<div class="modal-acts"><button class="btn gold" data-autoeq>Equip best</button><button class="btn" data-salvall="0">Salvage commons</button><button class="btn" data-salvall="1">Salvage ≤ rare</button></div>';
    return h;
  }
  function upgradesHtml() {
    const s = app.save; let h = '<div class="sec"><h3>Permanent upgrades (all heroes)</h3>';
    for (const id in AB.UPGRADES) { const u = AB.UPGRADES[id], L = S.upLevel(s, id), c = S.upCost(s, id); h += '<div class="row"><div class="ic">' + u.icon + '</div><div class="tx"><b>' + u.name + ' <span class="lv">Lv ' + L + '/' + u.max + '</span></b><small>' + u.desc + '</small></div>' + (c == null ? '<span class="chip">MAX</span>' : '<button class="btn' + (s.gold >= c ? ' gold' : '') + '" data-buy="' + id + '"' + (s.gold < c ? ' disabled' : '') + '>🪙 ' + U.fmt(c) + '</button>') + '</div>'; }
    h += '</div><div class="sec"><h3>Heroes</h3>';
    for (const id of AB.HERO_ORDER) { const hd = AB.HEROES[id], own = s.heroes[id]; h += '<div class="row"><div class="ic">' + AB.SKILLS[hd.skills[2]].icon + '</div><div class="tx"><b>' + hd.name + ' · ' + hd.title + '</b><small>' + hd.skills.map(k => AB.SKILLS[k].name).join(' · ') + '</small></div>' + (own ? '<span class="chip">Owned</span>' : '<button class="btn' + (s.gems >= hd.cost ? ' gold' : '') + '" data-unlock="' + id + '"' + (s.gems < hd.cost ? ' disabled' : '') + '>💎 ' + hd.cost + '</button>') + '</div>'; }
    return h + '</div>';
  }
  function codexHtml() {
    const hd = AB.HEROES[AB.HERO_ORDER[app.heroIdx]];
    let h = '<div class="sec"><h3>' + hd.name + "'s skills</h3>" + hd.skills.map((k, i) => { const S2 = AB.SKILLS[k]; return '<div class="row"><div class="ic">' + S2.icon + '</div><div class="tx"><b>' + S2.name + (i === 2 ? ' <span class="lv">ULTIMATE</span>' : '') + '</b><small>' + S2.desc + ' Cooldown ' + S2.cd + 's.</small></div></div>'; }).join('') + '</div>';
    h += '<div class="sec"><h3>Acts & bosses</h3>' + AB.ACTS.map(a => '<div class="row"><canvas data-enemy="' + a.boss + '" style="width:56px;height:56px"></canvas><div class="tx"><b>' + a.sub + ' · ' + a.name + '</b><small>Boss: ' + AB.ENEMIES[a.boss].name + '</small></div></div>').join('') + '</div>';
    const seen = new Set(); h += '<div class="sec"><h3>Bestiary</h3><div class="inv">';
    for (const a of AB.ACTS) for (const [k] of a.pool) if (!seen.has(k)) { seen.add(k); h += '<div class="item" style="border-color:rgba(255,255,255,0.15)" title="' + esc(AB.ENEMIES[k].name) + '"><canvas data-enemy="' + k + '"></canvas></div>'; }
    h += '</div></div><div class="sec"><h3>Boons</h3>' + Object.values(AB.BOONS).map(b => '<div class="row"><div class="ic">' + b.icon + '</div><div class="tx"><b>' + b.name + ' <span class="lv">max ' + b.max + '</span></b><small>' + b.desc + '</small></div></div>').join('') + '</div>';
    return h;
  }
  function moreHtml() {
    const s = app.save;
    return '<div class="sec"><h3>Redeem code</h3><div class="field"><input id="codeIn" placeholder="ENTER CODE" maxlength="40" autocomplete="off" autocapitalize="characters"><button class="btn gold" data-redeem>Redeem</button></div></div>' +
      '<div class="sec"><h3>Settings</h3><label class="toggle">Sound<input type="checkbox" data-set="sound"' + (s.settings.sound ? ' checked' : '') + '></label><label class="toggle">Screen shake<input type="checkbox" data-set="shake"' + (s.settings.shake ? ' checked' : '') + '></label></div>' +
      '<div class="sec"><h3>Records</h3><div class="res-grid"><div>' + s.runs + '<small>Runs</small></div><div>' + U.fmt(s.kills) + '<small>Kills</small></div><div>' + s.bossKills + '<small>Bosses</small></div></div><p style="color:var(--muted);font-weight:700">Best: ' + (s.best.tier ? 'Nightmare ' + toRoman(s.best.tier) + ', ' : '') + 'Act ' + s.best.act + ' cleared</p></div>' +
      '<div class="sec help"><h3>How to play</h3><p><b>Move</b> with the joystick (drag anywhere on the left side) or WASD. <b>Attack</b> with ⚔ (hold to keep swinging) or J / Space. Swings aim at the nearest enemy and can parry arrows.</p><p><b>Dash</b> 💨 (K / Shift) makes you invulnerable for a moment. Use it to escape red danger zones. Skills: 1, 2, 3. Potion: Q.</p><p>Each act has 4 rooms and a boss. After every room pick a <b>boon</b> to grow stronger for this run. Gold, gems and gear you find are kept. Beat Act III to unlock the next <b>Nightmare</b> tier with tougher monsters and better loot.</p></div>';
  }
  function onSheetClick(e) {
    const t = e.target.closest('button,[data-close]'); if (!t) { if (e.target.id === 'sheet') closeSheet(); return; }
    const s = app.save, d = t.dataset;
    if ('close' in d) return closeSheet();
    if (d.gsel !== undefined) { selGear = d.gsel || null; AB.Audio.play('click'); renderSheet(); return; }
    if (d.equip) { S.equip(s, d.equip); AB.Audio.play('boon'); renderSheet(); app.persist(); return; }
    if (d.salv) { const v = S.salvage(s, d.salv); if (v) toast('Salvaged for 🪙 ' + v); selGear = null; renderSheet(); app.persist(); return; }
    if ('autoeq' in d) { S.autoEquip(s); AB.Audio.play('boon'); renderSheet(); app.persist(); return; }
    if (d.salvall !== undefined) { const v = S.salvageAll(s, +d.salvall); toast(v ? 'Salvaged for 🪙 ' + v : 'Nothing to salvage'); renderSheet(); app.persist(); return; }
    if (d.buy) { if (S.buyUpgrade(s, d.buy)) { AB.Audio.play('boon'); app.persist(); } renderSheet(); return; }
    if (d.unlock) { if (S.unlockHero(s, d.unlock)) { AB.Audio.play('victory'); toast(AB.HEROES[d.unlock].name + ' joins you!'); app.persist(); } renderSheet(); return; }
    if ('redeem' in d) { const r = S.redeem(s, $('codeIn').value); if (r.ok) { AB.Audio.play('victory'); toast('🎁 ' + esc(r.label) + ': ' + Object.entries(r.got).map(([k, v]) => U.fmt(v) + (k === 'gold' ? ' 🪙' : ' 💎')).join(' ')); app.persist(); renderSheet(); } else { AB.Audio.play('hurt'); toast(esc(r.reason)); } return; }
  }
  function onSheetChange(e) { const d = e.target.dataset; if (d.set) { app.save.settings[d.set] = e.target.checked; AB.Audio.set(app.save.settings.sound); app.persist(); } }

  /* ---------------- HUD ---------------- */
  function buildHud(run) {
    const sk = run.hd.skills;
    ['s1Btn', 's2Btn', 'ultBtn'].forEach((id, i) => { $(id).querySelector('span').textContent = AB.SKILLS[sk[i]].icon; $(id).setAttribute('aria-label', AB.SKILLS[sk[i]].name); });
    $('atkBtn').textContent = run.heroId === 'berserker' ? '🪓' : '⚔';
    $('hudGems').hidden = true; $('bossBar').hidden = true;
  }
  let lastHp = 1;
  function updateHud(run) {
    const p = run.p, f = Math.max(0, p.hp / p.maxHp);
    $('hpFill').style.transform = 'scaleX(' + f + ')'; $('hpLag').style.transform = 'scaleX(' + Math.max(f, Math.min(lastHp, 1)) + ')'; if (f >= lastHp || Math.random() < 0.03) lastHp = f;
    $('hpText').textContent = Math.ceil(p.hp) + ' / ' + p.maxHp;
    $('lowhp').style.opacity = f < 0.3 ? 0.6 + Math.sin(run.time * 6) * 0.3 : 0;
    $('hudRoom').textContent = AB.ACTS[run.act].sub + ' · ' + (run.isBossRoom ? 'Boss' : (run.roomIdx + 1) + '/' + (AB.ROOMS_PER_ACT + 1));
    $('hudGold').textContent = '🪙 ' + U.fmt(run.gold);
    if (run.gems) { $('hudGems').hidden = false; $('hudGems').textContent = '💎 ' + run.gems; }
    const b = run.boss; $('bossBar').hidden = !(b && !b.dead);
    if (b && !b.dead) { $('bossName').textContent = b.d.name + (b.enraged ? ' — Enraged!' : ''); $('bossFill').style.transform = 'scaleX(' + Math.max(0, b.hp / b.maxHp) + ')'; }
    const cdEl = (el, rem, max) => { if (rem > 0.05) { el.style.setProperty('--p', (rem / max * 100) + '%'); el.textContent = rem >= 1 ? Math.ceil(rem) : ''; } else { el.style.setProperty('--p', '0%'); el.textContent = ''; } };
    for (let i = 0; i < 3; i++) cdEl($('cd' + i), p.cds[i], AB.SKILLS[run.hd.skills[i]].cd * (1 - p.cdr));
    cdEl($('cdDash'), p.dashCd, 0.9);
    $('potN').textContent = p.potions; $('potBtn').style.opacity = p.potions ? 1 : 0.4;
    const hint = $('hint');
    if (run.phase === 'door') { hint.hidden = false; hint.textContent = '⬆ Walk through the door'; }
    else if (run.phase === 'clear' && run.chests.some(c => !c.open)) { hint.hidden = false; hint.textContent = '🎁 Open the chest'; }
    else if (run.time < 5 && run.act === 0 && run.roomIdx === 0 && !app.save.runs) { hint.hidden = false; hint.textContent = 'Drag left side to move · ⚔ to attack'; }
    else hint.hidden = true;
  }

  /* ---------------- modals ---------------- */
  function modal(html) { $('modal').innerHTML = '<div class="modal-in">' + html + '</div>'; $('modal').hidden = false; paintCanvases($('modal')); }
  function closeModal() { $('modal').hidden = true; $('modal').innerHTML = ''; }
  function boonModal(run, choices) {
    modal('<h2>Choose a Boon</h2><p class="sub">Room cleared! Your power grows.</p><div class="boons">' + choices.map(id => { const B = AB.BOONS[id], n = run.p.boons[id] || 0; return '<button class="boon" data-boon="' + id + '"><div class="bi">' + B.icon + '</div><div><b>' + B.name + '</b><small>' + B.desc + '</small></div><span class="stk">' + n + '/' + B.max + '</span></button>'; }).join('') + '</div>');
  }
  function pauseModal(run) {
    const bo = Object.entries(run.p.boons).map(([id, n]) => '<span class="chip">' + AB.BOONS[id].icon + ' ' + AB.BOONS[id].name + (n > 1 ? ' ×' + n : '') + '</span>').join(' ');
    modal('<h2>Paused</h2><p class="sub">' + AB.ACTS[run.act].sub + ' · ' + AB.ACTS[run.act].name + '</p>' + (bo ? '<div class="stats-line" style="margin-bottom:14px">' + bo + '</div>' : '') +
      '<div class="res-grid"><div>' + Math.round(run.p.atk * run.p.dmgMul) + '<small>Attack</small></div><div>' + pct(run.p.crit) + '<small>Crit</small></div><div>' + pct(run.p.armor) + '<small>Armor</small></div></div>' +
      '<label class="toggle">Sound<input type="checkbox" data-set="sound"' + (app.save.settings.sound ? ' checked' : '') + '></label>' +
      '<div class="modal-acts"><button class="btn gold" data-resume>Resume</button><button class="btn red" data-abandon>Abandon run</button></div>');
  }
  function resultModal(run, res) {
    const win = res.cleared;
    app.lastLoot = res.loot;
    modal('<h2>' + (win ? '🏆 Victory!' : '☠ Fallen') + '</h2><p class="sub">' + (win ? 'Malachar is vanquished.' + (app.save.tier < app.save.maxTier ? '' : '') : 'You fell in ' + AB.ACTS[run.act].name + '.') + '</p>' +
      '<div class="res-grid"><div>🪙 ' + U.fmt(res.gold) + '<small>Gold</small></div><div>💎 ' + res.gems + '<small>Gems</small></div><div>' + res.kills + '<small>Kills</small></div></div>' +
      (res.loot.length ? '<p class="sub" style="margin:0">Loot found</p><div class="loot-row">' + res.loot.map(g => '<div class="item" style="border-color:' + AB.RARITY[g.rarity].color + '"><canvas data-gear="' + g.id + '"></canvas><span class="il">' + g.level + '</span></div>').join('') + '</div>' : '') +
      (win ? '<p style="color:#ffd0c0;font-weight:800">Nightmare ' + toRoman(app.save.maxTier) + ' unlocked!</p>' : '') +
      '<div class="modal-acts"><button class="btn gold" data-camp>Back to camp</button><button class="btn" data-again>Play again</button></div>');
  }
  function onModalClick(e) {
    const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
    if (d.boon) { app.run.takeBoon(d.boon); closeModal(); toast(AB.BOONS[d.boon].icon + ' ' + AB.BOONS[d.boon].name); app.paused = false; return; }
    if ('resume' in d) { closeModal(); app.paused = false; return; }
    if ('abandon' in d) { closeModal(); app.endRun(true); return; }
    if ('camp' in d) { closeModal(); app.toHub(); return; }
    if ('again' in d) { closeModal(); app.toHub(); app.startRun(); return; }
  }

  function init(a) {
    app = a;
    $('sheet').addEventListener('click', onSheetClick); $('sheet').addEventListener('change', onSheetChange);
    $('modal').addEventListener('click', onModalClick); $('modal').addEventListener('change', onSheetChange);
    document.querySelectorAll('[data-sheet]').forEach(b => b.addEventListener('click', () => openSheet(b.dataset.sheet)));
    $('heroPrev').addEventListener('click', () => { app.heroIdx = (app.heroIdx + 2) % 3; AB.Audio.play('click'); refreshHub(); });
    $('heroNext').addEventListener('click', () => { app.heroIdx = (app.heroIdx + 1) % 3; AB.Audio.play('click'); refreshHub(); });
    $('tiers').addEventListener('click', e => { const t = e.target.closest('[data-tier]'); if (!t) return; const n = +t.dataset.tier; if (n > app.save.maxTier) { toast('Clear Act III to unlock this tier'); return; } app.save.tier = n; AB.Audio.play('click'); refreshHub(); app.persist(); });
    $('startBtn').addEventListener('click', () => {
      const id = AB.HERO_ORDER[app.heroIdx];
      if (!app.save.heroes[id]) { if (S.unlockHero(app.save, id)) { AB.Audio.play('victory'); toast(AB.HEROES[id].name + ' joins you!'); app.persist(); refreshHub(); } return; }
      app.save.hero = id; app.startRun();
    });
    $('pauseBtn').addEventListener('click', () => { if (!app.run || app.run.phase === 'boon') return; app.paused = true; pauseModal(app.run); });
    const I = AB.Input;
    I.holdButton($('atkBtn'), () => { I.st.atkHeld = true; }, () => { I.st.atkHeld = false; });
    I.holdButton($('dashBtn'), () => { if (app.run) app.run.input.dash = true; });
    ['s1Btn', 's2Btn', 'ultBtn'].forEach((id, i) => I.holdButton($(id), () => { if (app.run) app.run.input.skill[i] = true; }));
    I.holdButton($('potBtn'), () => { if (app.run) app.run.input.potion = true; });
  }
  return { init, refreshHub, toast, banner, buildHud, updateHud, boonModal, resultModal, closeModal, closeSheet, openSheet, modalOpen: () => !$('modal').hidden };
})();

</script>
<script>
/* =====================================================================
 * Ashen Blade — main.js
 * App controller: camp (hub) scene, starting/ending runs, main loop.
 * ===================================================================== */
AB.App = (function () {
  const $ = id => document.getElementById(id), S = AB.State, UI = AB.UI;
  const app = { save: null, run: null, heroIdx: 0, paused: false, cam: { x: 0, y: 0 }, camp: null, embers: [] };
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  app.persist = () => S.save(app.save);

  /* ---------------- runs ---------------- */
  app.startRun = function () {
    const heroId = app.save.hero;
    AB.Audio.ensure();
    app.run = new AB.Run(app.save, heroId); AB.Input.run = app.run; AB.Input.reset(); app.paused = false;
    $('hub').hidden = true; $('hud').hidden = false; UI.closeSheet && ($('sheet').hidden = true);
    UI.buildHud(app.run);
    const r = app.run; app.cam.x = r.p.x; app.cam.y = r.p.y - 60;
    UI.banner(AB.ACTS[0].sub, AB.ACTS[0].name);
  };
  app.endRun = function (abandon) {
    const r = app.run; if (!r || r.ended) return; r.ended = true;
    const res = r.result(); S.finishRun(app.save, res); app.persist();
    if (abandon) { app.toHub(); UI.toast('Run abandoned · kept 🪙 ' + Math.floor(res.gold)); return; }
    UI.resultModal(r, res);
  };
  app.toHub = function () {
    app.run = null; AB.Input.run = null; AB.Input.reset(); app.paused = false;
    $('hud').hidden = true; $('hub').hidden = false; $('knobBase').style.display = 'none';
    app.heroIdx = Math.max(0, AB.HERO_ORDER.indexOf(app.save.hero)); UI.refreshHub();
  };
  function handleEvents(r) {
    for (const e of r.events) {
      if (e.type === 'room' && e.room === 0 && e.act > 0) UI.banner(AB.ACTS[e.act].sub, AB.ACTS[e.act].name);
      else if (e.type === 'boss') { UI.banner('BOSS', AB.ENEMIES[e.kind].name); AB.Audio.play('boss'); }
      else if (e.type === 'boon') UI.boonModal(r, e.choices);
      else if (e.type === 'loot') { const g = e.gear, R = AB.RARITY[g.rarity]; UI.toast('<span style="color:' + R.color + '">' + R.name + ' ' + g.name + '</span>', cvs => AB.Art.gearIcon(cvs, g)); }
      else if (e.type === 'bossDown') UI.banner('VICTORY', AB.ENEMIES[e.kind].name + ' falls');
      else if (e.type === 'act') UI.toast('❤ Rested · +35% HP');
      else if (e.type === 'victory') setTimeout(() => app.endRun(false), 1200);
    }
    r.events.length = 0;
  }

  /* ---------------- camp scene ---------------- */
  function drawCamp(t) {
    const A = AB.Art;
    if (!app.camp) { const room = { w: 15, h: 19, seed: 7 }; app.camp = { room, bake: A.bakeRoom(room, AB.ACTS[0], 1.5) }; }
    const cp = app.camp, T = AB.CONFIG.TILE, k = Math.min(W / 300, H / 420);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0d0a12'; ctx.fillRect(0, 0, cv.width, cv.height);
    const cx = 15 * T / 2, cy = 19 * T * 0.48;
    ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (W / 2 - cx * k), dpr * (H * 0.56 - cy * k));
    ctx.globalAlpha = 0.85; ctx.drawImage(cp.bake, 0, 0, 15 * T, 19 * T); ctx.globalAlpha = 1;
    const act = AB.ACTS[0];
    A.prop(ctx, { kind: 'pillar', x: cx - 110, y: cy - 40 }, act, t); A.prop(ctx, { kind: 'pillar', x: cx + 110, y: cy - 40 }, act, t);
    A.prop(ctx, { kind: 'brazier', x: cx - 80, y: cy + 50 }, act, t); A.prop(ctx, { kind: 'brazier', x: cx + 80, y: cy + 50 }, act, t);
    // hero
    const id = AB.HERO_ORDER[app.heroIdx], hd = AB.HEROES[id], own = !!app.save.heroes[id];
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; A.glow(ctx, cx, cy - 10, 120, own ? hexRgb(hd.color) : '90,90,110', 0.35); ctx.restore();
    A.ell(ctx, cx, cy + 22, 40, 13, 'rgba(0,0,0,0.4)');
    ctx.save(); ctx.translate(cx, cy + 22); if (!own) ctx.filter = 'brightness(0.18)';
    const sw = (t % 3.2) < 0.35 ? (t % 3.2) / 0.35 : 0, wa = sw ? -1.8 + sw * 2.6 : -0.6 + Math.sin(t * 1.5) * 0.08;
    A.hero(ctx, hd.look, 40, { t, moving: false, wAngle: wa, facing: 1 });
    ctx.restore();
    if (sw > 0 && own) A.slash(ctx, cx + 4, cy - 30, -0.4, 2.2, 120, sw, '210,230,255', 1);
    // embers
    if (app.embers.length < 40 && Math.random() < 0.5) app.embers.push({ x: cx + (Math.random() - 0.5) * 320, y: cy + 80, vy: -20 - Math.random() * 30, life: 3 + Math.random() * 2, t: 0 });
    for (const e of app.embers) { e.t += 1 / 60; e.y += e.vy / 60; e.x += Math.sin(e.t * 2 + e.y) * 0.3; ctx.globalAlpha = Math.max(0, 1 - e.t / e.life); ctx.fillStyle = '#ffb35a'; ctx.fillRect(e.x, e.y, 2, 2); }
    ctx.globalAlpha = 1; app.embers = app.embers.filter(e => e.t < e.life);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const vg = ctx.createRadialGradient(cv.width / 2, cv.height * 0.5, cv.height * 0.2, cv.width / 2, cv.height * 0.5, cv.height * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(5,2,8,0.8)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);
  }
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(',');

  /* ---------------- run rendering ---------------- */
  function drawRun(r) {
    const portrait = H >= W, scale = portrait ? Math.min(W / 360, H / 640) : Math.min(H / 400, W / 560);
    const vw = W / scale, vh = H / scale, p = r.p;
    const tx = p.x, ty = p.y - 40;
    app.cam.x += (tx - app.cam.x) * 0.15; app.cam.y += (ty - app.cam.y) * 0.15;
    const clampC = (v, size, view) => size <= view ? size / 2 : Math.max(view / 2 - 20, Math.min(size - view / 2 + 20, v));
    app.cam.x = clampC(app.cam.x, r.W, vw); app.cam.y = clampC(app.cam.y, r.H, vh);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#07050a'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    const bakeScale = Math.min(2, Math.max(1, Math.round(dpr * scale * 2) / 2));
    r.draw(ctx, { x: app.cam.x - vw / 2, y: app.cam.y - vh / 2, bakeScale });
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (r.flash > 0) { ctx.fillStyle = 'rgba(255,40,30,' + (r.flash * 0.35) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (r.phase === 'dead') { ctx.fillStyle = 'rgba(20,0,0,' + Math.min(0.6, (1.6 - r.deadT) * 0.5) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
  }

  /* ---------------- loop ---------------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    try {
      const r = app.run;
      if (r) {
        if (!app.paused && !UI.modalOpen()) { AB.Input.apply(); r.update(dt); }
        else if (r.phase === 'boon' && !app.paused) { AB.Input.apply(); r.input.attack = false; r.update(dt); }
        handleEvents(r);
        if (r.phase === 'dead' && r.deadT <= 0 && !r.ended) app.endRun(false);
        drawRun(r); UI.updateHud(r);
      } else drawCamp(now / 1000);
    } catch (err) { console.error('[Ashen Blade] frame error', err); }
    requestAnimationFrame(frame);
  }

  app.boot = function () {
    app.save = S.load(); AB.Audio.set(app.save.settings.sound);
    app.heroIdx = Math.max(0, AB.HERO_ORDER.indexOf(app.save.hero));
    resize(); window.addEventListener('resize', resize);
    UI.init(app); AB.Input.bind($('stage'), $('knobBase'), $('knob'));
    UI.refreshHub();
    window.addEventListener('pointerdown', () => AB.Audio.ensure(), { capture: true, once: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { app.persist(); if (app.run && !UI.modalOpen() && app.run.phase !== 'dead') { app.paused = true; $('pauseBtn').click(); } } });
    window.addEventListener('beforeunload', () => app.persist());
    requestAnimationFrame(frame);
  };
  app.boot();
  return app;
})();

</script>
