<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Realm Guardians</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
  <style>
/* =====================================================================
 * Realm Guardians — style.css
 * Navy and gold heraldry: stone-dark panels, gilded edges, carved
 * Cinzel display type over a humanist sans for readable body text.
 * ===================================================================== */

:root {
  /* Dusk variant (used when the device prefers a light scheme) */
  --ink: #18234a;
  --navy: #1f2c58;
  --panel: #23336a;
  --panel-2: #2c3f7c;
  --line: rgba(240, 200, 110, 0.35);
  --line-soft: rgba(255, 255, 255, 0.12);
  --gold: #e9bf62;
  --gold-hi: #fbe2a0;
  --gold-deep: #8a5f17;
  --text: #f6efdc;
  --muted: #c3c9dc;
  --emerald: #4cb173;
  --arcane: #9a78e0;
  --blood: #d65a4f;
  --shadow: 0 10px 30px rgba(5, 8, 20, 0.45);
  --display: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif;
  --body: 'Alegreya Sans', 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #070c1d; --navy: #0d1531; --panel: #121c3e; --panel-2: #1a2852;
    --line: rgba(226, 182, 92, 0.3); --line-soft: rgba(255, 255, 255, 0.08);
    --gold: #e2b65c; --gold-hi: #f6d98d; --text: #efe6cf; --muted: #a3abc2;
  }
}
:root[data-theme="dark"] {
  --ink: #070c1d; --navy: #0d1531; --panel: #121c3e; --panel-2: #1a2852;
  --line: rgba(226, 182, 92, 0.3); --line-soft: rgba(255, 255, 255, 0.08);
  --gold: #e2b65c; --gold-hi: #f6d98d; --text: #efe6cf; --muted: #a3abc2;
}

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; background: var(--ink); color: var(--text);
  font: 17px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
.hidden { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; letter-spacing: 0.02em; margin: 0; line-height: 1.2; }

/* ---------- Icons ---------- */
.ico { display: inline-flex; width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.ico svg { width: 100%; height: 100%; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4em;
  min-height: 44px; padding: 0.5em 1.1em; border-radius: 6px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); color: var(--text); font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 0 rgba(0,0,0,0.35);
  transition: transform .08s ease, filter .15s ease, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--gold); filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; }
.btn-gold {
  background: linear-gradient(180deg, #f2cf7e, #c9922e 55%, #a8731c);
  border-color: #6b4a10; color: #2a1a04; text-shadow: 0 1px 0 rgba(255,240,200,0.5);
  box-shadow: inset 0 1px 0 rgba(255,250,220,0.7), 0 2px 0 #4a3108, 0 0 0 1px rgba(0,0,0,0.25);
}
.btn-gold:disabled { filter: grayscale(0.7); opacity: 0.55; }
.btn-lg { min-height: 52px; font-size: 1.08rem; padding: 0.6em 1.4em; }
.btn-block { width: 100%; }
.btn-quiet { background: transparent; box-shadow: none; }
.btn-danger { background: linear-gradient(180deg, #c9483f, #8a221c); border-color: #4a0f0b; }
.btn-danger-quiet { background: transparent; border-color: rgba(214, 90, 79, 0.5); color: #ffb3a8; box-shadow: none; }
.btn-icon {
  width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center;
  background: var(--panel); border: 1px solid var(--line); color: var(--gold-hi); padding: 0;
}
.btn-icon .ico { width: 20px; height: 20px; }
.btn-icon:hover { border-color: var(--gold); }

/* ---------- Generic screen chrome ---------- */
.screen-root { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
.screen { min-height: 100%; padding: 0 clamp(14px, 3vw, 40px) 40px; background: radial-gradient(1200px 600px at 50% -10%, var(--panel-2), var(--ink) 70%); }
.screen.enter { animation: screen-in .28s ease-out; }
@keyframes screen-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px;
  padding: 14px 0; margin-bottom: 18px; background: linear-gradient(180deg, var(--ink) 70%, transparent);
}
.topbar h2 { font-size: clamp(1.3rem, 3vw, 1.9rem); color: var(--gold-hi); flex: 1; }
.btn-back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px 8px 8px; color: var(--muted); min-height: 44px; }
.btn-back:hover { color: var(--text); border-color: var(--gold); }
.purse { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); font-weight: 700; }
.purse .ico { width: 20px; height: 20px; }
.purse span { color: var(--muted); font-weight: 500; }
.screen-lead { max-width: 68ch; color: var(--muted); margin: -4px 0 22px; }
.panel {
  background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%), var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 18px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
}
.sub { font-size: 1.05rem; color: var(--gold); margin-bottom: 12px; }
.note { color: var(--muted); font-size: 0.9rem; margin: 8px 0 0; }
.label { color: var(--muted); font-size: 0.9rem; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px var(--gold); margin-left: 4px; }

.stars { display: inline-flex; gap: 1px; vertical-align: middle; }
.star { width: 16px; height: 16px; color: rgba(255,255,255,0.18); display: inline-flex; }
.star svg { width: 100%; height: 100%; }
.star.on { color: var(--gold-hi); filter: drop-shadow(0 0 3px rgba(246,217,141,0.6)); }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; }
.pip { width: 12px; height: 12px; transform: rotate(45deg); border: 1px solid var(--gold-deep); background: rgba(0,0,0,0.35); }
.pip.on { background: linear-gradient(135deg, var(--gold-hi), var(--gold)); }

/* ---------- Main menu ---------- */
.menu { position: relative; display: grid; place-items: center; padding: 30px 20px 60px; overflow: hidden; background: var(--ink); }
.menu-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.menu-inner { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; width: min(440px, 100%); margin-right: min(22vw, 260px); }
.title { display: flex; flex-direction: column; line-height: 0.92; margin-bottom: 10px; }
.title span {
  font-weight: 800; letter-spacing: 0.06em;
  background: linear-gradient(180deg, #fff6d6 0%, #f2cf7e 38%, #b07a22 62%, #f2cf7e 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #3a2506) drop-shadow(0 10px 22px rgba(0,0,0,0.6));
}
.title .t1 { font-size: clamp(2.4rem, 7vw, 4.2rem); letter-spacing: 0.3em; padding-left: 0.3em; }
.title .t2 { font-size: clamp(2.9rem, 9vw, 5.4rem); }
.title { animation: title-in 1.1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes title-in { from { opacity: 0; letter-spacing: 0.4em; filter: blur(6px); } to { opacity: 1; filter: none; } }
.tagline { color: var(--muted); font-size: 1.1rem; margin: 6px 0 28px; font-style: italic; }
.menu-nav { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.menu-nav .btn { width: 100%; }
.menu-row { display: flex; gap: 10px; }
.menu-row .btn { flex: 1; }
.menu-foot { display: flex; gap: 10px; margin-top: 24px; }
.version { position: absolute; bottom: 8px; left: 12px; margin: 0; color: rgba(255,255,255,0.4); font-size: 0.8rem; }
@media (max-width: 760px) { .menu-inner { margin-right: 0; } }

/* ---------- Campaign ---------- */
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.map-card {
  display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s;
}
.map-card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent); }
.map-card .thumb { width: 100%; aspect-ratio: 16 / 10; display: block; border-bottom: 3px solid var(--accent); }
.map-card.locked .thumb { filter: grayscale(0.85) brightness(0.45); }
.map-info { padding: 14px 16px 16px; }
.region { font-size: 0.85rem; color: var(--accent, var(--gold)); font-weight: 700; }
.map-info h3 { font-size: 1.35rem; color: var(--text); margin: 2px 0; }
.map-info p { margin: 0 0 10px; color: var(--muted); }
.map-meta { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
.map-meta .sep { width: 1px; height: 14px; background: var(--line); margin: 0 6px; }
.map-boss { margin-top: 6px; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 0.9rem; }

/* ---------- Level select ---------- */
.levels-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.region-map { position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
.region-bg { position: absolute; inset: 0; width: 100%; height: 100%; filter: brightness(0.5) saturate(0.7) blur(1.5px); transform: scale(1.03); }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; }
.trail polyline { fill: none; stroke: rgba(246,217,141,0.7); stroke-width: 0.5; stroke-dasharray: 1.4 1.2; vector-effect: non-scaling-stroke; stroke-width: 3; }
.node {
  position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
  background: none; border: 0; padding: 0; gap: 2px;
}
.node-num {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 1.1rem; color: #2a1a04;
  background: radial-gradient(circle at 35% 30%, #fff1c2, #e2b65c 55%, #9a6a1c);
  border: 2px solid #4a3108; box-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 0 3px rgba(0,0,0,0.25);
  transition: transform .12s;
}
.node:hover .node-num { transform: scale(1.08); }
.node.done .node-num { background: radial-gradient(circle at 35% 30%, #d9ffe6, #4cb173 55%, #1f6a3e); border-color: #0f3a20; color: #082414; }
.node.locked .node-num { background: radial-gradient(circle at 35% 30%, #6a6a78, #3a3a48); border-color: #1a1a24; }
.node.boss .node-num { width: 58px; height: 58px; }
.node.boss:not(.locked) .node-num { background: radial-gradient(circle at 35% 30%, #ffd2c2, #d65a4f 55%, #7a1a14); border-color: #3a0a06; }
.node.sel .node-num { box-shadow: 0 0 0 3px var(--gold-hi), 0 0 22px rgba(246,217,141,0.8); }
.node .ico { width: 22px; height: 22px; }
.node .stars .star { width: 13px; height: 13px; }
.level-panel { position: sticky; top: 84px; }
.region-nav { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; text-align: center; gap: 8px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.region-nav h3 { font-size: 1.1rem; }
.ld-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.stage-id { color: var(--gold); font-weight: 700; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.82rem; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
.tag-boss { background: rgba(214,90,79,0.2); color: #ffb3a8; border: 1px solid rgba(214,90,79,0.5); }
.tag-mini { background: rgba(154,120,224,0.2); color: #d5c4ff; border: 1px solid rgba(154,120,224,0.5); }
.level-detail h3 { font-size: 1.45rem; margin: 4px 0 6px; }
.ld-best { color: var(--muted); display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.ld-thumb { width: 100%; aspect-ratio: 16/10; border-radius: 8px; border: 1px solid var(--line-soft); margin: 6px 0 10px; display: block; }
.ld-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 12px; }
.ld-facts div { background: rgba(0,0,0,0.25); border-radius: 6px; padding: 6px 8px; }
.ld-facts dt { font-size: 0.8rem; color: var(--muted); }
.ld-facts dd { margin: 0; font-weight: 700; display: flex; gap: 4px; align-items: center; }
.ld-enemies { margin-bottom: 12px; }
.enemy-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.enemy-chip { width: 44px; height: 44px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--line-soft); display: grid; place-items: center; }
.enemy-chip.boss { border-color: rgba(214,90,79,0.7); background: rgba(214,90,79,0.15); }
.enemy-chip canvas { width: 40px; height: 40px; }
.ld-reward { display: flex; gap: 8px; align-items: flex-start; background: rgba(154,120,224,0.12); border: 1px solid rgba(154,120,224,0.35); padding: 8px 10px; border-radius: 8px; margin-bottom: 14px; font-size: 0.95rem; }
@media (max-width: 860px) {
  .levels-layout { grid-template-columns: 1fr; }
  .level-panel { position: static; }
  .node-num { width: 36px; height: 36px; font-size: 0.95rem; }
  .node.boss .node-num { width: 44px; height: 44px; }
}

/* ---------- Heroes ---------- */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px; }
.hero-card {
  display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, var(--panel)), var(--panel) 55%);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
}
.hero-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.hero-card.locked .hero-portrait { filter: grayscale(1) brightness(0.55); }
.hero-portrait { width: 100%; height: 150px; display: block; }
.hc-body { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.hc-body h3 { font-size: 1.25rem; }
.hc-title { margin: 0; color: var(--accent); font-size: 0.9rem; font-style: italic; }
.hc-role { margin: 0; color: var(--muted); font-size: 0.92rem; }
.hc-level { margin: 6px 0 2px; }
.cost, .req, .maxed { display: inline-flex; align-items: center; gap: 4px; font-size: 0.92rem; color: var(--muted); }
.cost.ok { color: var(--gold-hi); font-weight: 700; }
.maxed { color: var(--emerald); font-weight: 700; }
.hero-detail { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
.hd-left { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.hd-switch { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; width: 100%; }
.hd-portrait { width: 100%; height: 200px; }
.hd-left h3 { font-size: 1.7rem; }
.hd-level { color: var(--muted); display: flex; gap: 8px; align-items: center; }
.hd-blurb { margin: 4px 0; text-align: left; }
.hd-meta { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
.hd-meta span { background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.maxed-big { color: var(--emerald); font-weight: 700; }
.hd-right { display: flex; flex-direction: column; gap: 16px; }
.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.perk { display: flex; gap: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,0.22); border: 1px solid transparent; }
.perk p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
.perk-lv { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: rgba(255,255,255,0.08); color: var(--muted); }
.perk.have { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.perk.have .perk-lv { background: var(--accent); color: #081010; }
.perk.next { border-color: var(--gold); border-style: dashed; }
.perk.next .perk-lv { background: transparent; border: 2px solid var(--gold); color: var(--gold-hi); }
.perk.later { opacity: 0.6; }
.stat-tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.stat-table h4 { font-size: 0.95rem; color: var(--text); margin-bottom: 8px; }
.stat-table dl, .tp-stats { margin: 0; display: flex; flex-direction: column; gap: 3px; }
.stat-table dl div, .tp-stats div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line-soft); padding: 2px 0; }
.stat-table dt, .tp-stats dt { color: var(--muted); }
.stat-table dd, .tp-stats dd { margin: 0; font-weight: 600; text-align: right; }
.up { color: #8de59a; font-weight: 700; margin-left: 4px; }
.tp-stats .up::before { content: '▸ '; opacity: 0.7; }
@media (max-width: 860px) { .hero-detail { grid-template-columns: 1fr; } }

/* ---------- Kingdom ---------- */
.k-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.k-card { display: flex; flex-direction: column; gap: 10px; }
.k-head { display: flex; gap: 10px; align-items: center; }
.k-head .ico { width: 30px; height: 30px; }
.k-card p { margin: 0; color: var(--muted); }
.k-card .btn { margin-top: auto; }

/* ---------- Settings & guide ---------- */
.settings, .howto { display: grid; gap: 16px; max-width: 760px; }
.set-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px dotted var(--line-soft); }
.set-row > span { flex: 1; display: flex; flex-direction: column; }
.set-row small { color: var(--muted); font-size: 0.85rem; }
.set-row input[type=range] { flex: 1; max-width: 260px; accent-color: var(--gold); }
.set-row output { width: 46px; text-align: right; color: var(--muted); }
.set-row select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.toggle { cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 46px; height: 26px; border-radius: 999px; background: rgba(0,0,0,0.4); border: 1px solid var(--line); position: relative; transition: background .15s; flex: none; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle input:checked + .sw { background: color-mix(in srgb, var(--gold) 45%, transparent); }
.toggle input:checked + .sw::after { transform: translateX(20px); background: var(--gold-hi); }
.toggle input:focus-visible + .sw { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.danger-zone p { color: var(--muted); margin: 0 0 10px; }
.warn { color: #ffb3a8 !important; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.credits { color: var(--muted); font-size: 0.85rem; }
.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.howto-heroes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.howto-heroes li { display: flex; gap: 12px; align-items: center; }
.howto-heroes p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.mini-icon { width: 54px; height: 54px; flex: none; }
.tips { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; margin: 0; }
.keys div { display: flex; gap: 10px; align-items: baseline; }
.keys dt { font-weight: 700; color: var(--gold-hi); min-width: 92px; }
.keys dd { margin: 0; color: var(--muted); }

/* ---------- Tooltip ---------- */
.tooltip {
  position: fixed; z-index: 50; max-width: 280px; padding: 8px 12px; border-radius: 8px; pointer-events: none;
  background: rgba(8, 12, 28, 0.96); border: 1px solid var(--line); font-size: 0.9rem; box-shadow: var(--shadow);
}
.tooltip em { color: var(--gold-hi); }

/* =====================================================================
 * Battle screen
 * ===================================================================== */
.battle { position: absolute; inset: 0; display: flex; flex-direction: column; background: #05080f; }
.hud {
  display: flex; align-items: center; gap: 12px; padding: 6px 12px; min-height: 56px; flex: none;
  background: linear-gradient(180deg, var(--panel-2), var(--navy)); border-bottom: 2px solid var(--gold-deep);
  box-shadow: 0 2px 0 rgba(226,182,92,0.25);
}
.hud-btn {
  min-width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; padding: 0 10px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--line); color: var(--gold-hi); font-weight: 800;
}
.hud-btn .ico { width: 20px; height: 20px; }
.hud-btn:hover { border-color: var(--gold); }
.hud-stage { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.hud-stage span:first-child { color: var(--map-accent, var(--gold)); font-weight: 700; font-size: 0.82rem; }
.hud-stage span:last-child { font-family: var(--display); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.hud-stats { display: flex; gap: 8px; flex: 1; justify-content: center; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,0.35); border: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
.stat .ico { width: 20px; height: 20px; }
.stat b { font-size: 1.05rem; min-width: 2ch; }
.stat-gold b { color: var(--gold-hi); }
.stat.danger { border-color: var(--blood); animation: danger 1s ease-in-out infinite; }
@keyframes danger { 50% { background: rgba(214,90,79,0.35); } }
.hud-actions { display: flex; gap: 8px; align-items: center; }
.btn-wave { min-width: 150px; }
.btn-wave.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 1px 0 rgba(255,250,220,0.7), 0 0 0 4px rgba(246,217,141,0.35), 0 0 18px rgba(246,217,141,0.6); } }

.battle-body { flex: 1; display: flex; min-height: 0; }
.stage { position: relative; flex: 1; min-width: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 50%, #111933, #05080f); }
#game-canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(226,182,92,0.25), 0 10px 40px rgba(0,0,0,0.6); }

.buildbar {
  flex: none; width: 112px; display: flex; flex-direction: column; gap: 6px; padding: 8px;
  background: linear-gradient(90deg, var(--navy), var(--panel)); border-left: 2px solid var(--gold-deep); overflow-y: auto;
}
.build-btn {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 4px 6px;
  border-radius: 8px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent, #888) 25%, var(--panel-2)), var(--panel));
  border: 1px solid var(--line); min-height: 44px; flex: none; transition: transform .08s, border-color .12s;
}
.build-btn canvas { width: 64px; height: 50px; }
.build-btn:hover { border-color: var(--accent, var(--gold)); }
.build-btn.active { border-color: var(--gold-hi); box-shadow: 0 0 0 2px var(--gold-hi), 0 0 16px rgba(246,217,141,0.5); }
.bb-name { font-weight: 700; font-size: 0.8rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-cost { display: inline-flex; align-items: center; gap: 3px; font-size: 0.85rem; color: var(--gold-hi); font-weight: 700; font-variant-numeric: tabular-nums; }
.build-btn kbd { position: absolute; top: 3px; left: 5px; font: 700 0.7rem var(--body); color: var(--muted); opacity: 0.8; }
.bb-lock { display: none; position: absolute; inset: 0; place-items: center; background: rgba(5,8,18,0.6); border-radius: 8px; }
.bb-lock .ico { width: 26px; height: 26px; }
.build-btn.locked .bb-lock { display: grid; }
.build-btn.locked canvas { filter: grayscale(1); }
.build-btn.poor .bb-cost { color: #ff8f80; }
.build-btn.poor canvas { opacity: 0.55; }
.smite-btn { --accent: #e2c35a; padding-top: 8px; overflow: hidden; }
.smite-btn > .ico { width: 34px; height: 34px; margin: 6px 0 4px; }
.smite-ring { position: absolute; inset: 0; background: conic-gradient(rgba(5,8,18,0.72) calc(var(--cd, 0) * 360deg), transparent 0); pointer-events: none; }
.smite-btn.cooling > .ico { filter: grayscale(0.8); }

/* Tower panel */
.tower-panel {
  position: absolute; left: 0; top: 0; z-index: 6; width: 260px; padding: 12px; border-radius: 10px;
  background: rgba(10, 16, 36, 0.95); border: 1px solid var(--gold-deep); box-shadow: var(--shadow); font-size: 0.92rem;
  backdrop-filter: blur(4px);
}
.tp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tp-head canvas { width: 48px; height: 48px; flex: none; }
.tp-head div { flex: 1; display: flex; flex-direction: column; line-height: 1.2; }
.tp-head b { font-family: var(--display); font-size: 1.05rem; }
.tp-head span { color: var(--muted); font-size: 0.85rem; }
.tp-close { width: 32px; height: 32px; }
.tp-warn { color: #ffb3a8; margin: 0 0 6px; font-size: 0.85rem; }
.tp-target { display: flex; align-items: center; gap: 4px; margin: 10px 0 6px; flex-wrap: wrap; }
.tp-target span { color: var(--muted); margin-right: 2px; font-size: 0.85rem; }
.tp-target button { flex: 1; min-height: 32px; border-radius: 6px; border: 1px solid var(--line-soft); background: rgba(255,255,255,0.05); font-size: 0.8rem; padding: 0 4px; }
.tp-target button.on { background: var(--gold); color: #2a1a04; border-color: var(--gold); font-weight: 700; }
.tp-foot { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
.tp-actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.tp-actions .btn { min-height: 40px; padding: 0.3em 0.8em; }

/* Banners, toasts, tutorial */
.banner {
  position: absolute; top: 18%; left: 50%; transform: translate(-50%, -10px); z-index: 4; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0;
  transition: opacity .35s, transform .35s;
}
.banner b { font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.6rem); color: var(--gold-hi); text-shadow: 0 3px 0 #3a2506, 0 0 24px rgba(0,0,0,0.9); white-space: nowrap; }
.banner span { color: var(--text); text-shadow: 0 2px 6px #000; font-weight: 600; }
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.banner.boss b { color: #ff9a7a; font-size: clamp(1.8rem, 5vw, 3rem); }
.toasts { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; flex-direction: column; gap: 6px; max-width: min(380px, 70%); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 0.92rem;
  background: rgba(8,12,28,0.92); border: 1px solid var(--line-soft); border-left: 4px solid var(--muted);
  animation: toast-in .25s ease-out; transition: opacity .4s, transform .4s;
}
.toast canvas { width: 34px; height: 34px; flex: none; }
.toast.out { opacity: 0; transform: translateX(-12px); }
.toast-gold { border-left-color: var(--gold); }
.toast-warn { border-left-color: #e8a04a; }
.toast-danger { border-left-color: var(--blood); }
.toast-enemy { border-left-color: var(--arcane); }
.toast-necro { border-left-color: #4fc6a0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
.tutorial {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: min(560px, 90%);
  padding: 10px 16px; border-radius: 10px; background: rgba(20, 28, 62, 0.95); border: 1px solid var(--gold);
  box-shadow: 0 0 24px rgba(226,182,92,0.3); font-weight: 600; display: flex; gap: 10px; align-items: center;
}
.tut-step { flex: none; font-family: var(--display); color: var(--gold-hi); font-size: 0.85rem; }

/* Overlay modals (pause / victory / defeat) */
.overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(4, 6, 14, 0.6); backdrop-filter: blur(3px); overflow-y: auto; }
.modal {
  position: relative; width: min(460px, 100%); padding: 26px 24px 22px; border-radius: 14px; text-align: center; overflow: hidden;
  background: linear-gradient(180deg, var(--panel-2), var(--navy)); border: 1px solid var(--gold); box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  animation: modal-in .35s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes modal-in { from { opacity: 0; transform: scale(0.92); } }
.modal h2 { font-size: clamp(1.8rem, 5vw, 2.4rem); color: var(--gold-hi); text-shadow: 0 3px 0 #3a2506; position: relative; }
.modal-sub { color: var(--muted); margin: 4px 0 16px; position: relative; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; position: relative; }
.modal-actions.col { flex-direction: column; }
.modal-hint { color: var(--muted); font-size: 0.85rem; margin: 14px 0 0; }
.quick-set { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; margin-top: 16px; color: var(--muted); }
.quick-set label { display: inline-flex; gap: 6px; align-items: center; min-height: 32px; cursor: pointer; }
.quick-set input { accent-color: var(--gold); width: 18px; height: 18px; }
.end-rays { position: absolute; inset: -40%; background: repeating-conic-gradient(rgba(246,217,141,0.08) 0 10deg, transparent 10deg 20deg); animation: spin 30s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.end.defeat { border-color: var(--blood); }
.end.defeat h2 { color: #ffb3a8; }
.end-stars { display: flex; justify-content: center; gap: 6px; position: relative; margin: 4px 0; }
.big-star { width: 58px; height: 58px; color: rgba(255,255,255,0.12); display: inline-flex; }
.big-star:nth-child(2) { width: 72px; height: 72px; margin-top: -10px; }
.big-star svg { width: 100%; height: 100%; }
.big-star.on { color: var(--gold-hi); filter: drop-shadow(0 0 10px rgba(246,217,141,0.8)); animation: star-pop .45s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(var(--i) * 0.25s + 0.2s); }
@keyframes star-pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.end-lives { color: var(--muted); margin: 0 0 12px; position: relative; font-size: 0.92rem; }
.end-reward { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 999px; background: rgba(154,120,224,0.2); border: 1px solid rgba(154,120,224,0.5); }
.end-reward .ico { width: 26px; height: 26px; }
.end-reward b { font-size: 1.5rem; font-family: var(--display); }
.end-lines, .end-stats { list-style: none; padding: 0; margin: 10px auto 0; position: relative; max-width: 280px; }
.end-lines li { display: flex; justify-content: space-between; color: var(--muted); }
.end-lines b { color: var(--text); }
.end-stats { display: flex; justify-content: center; gap: 16px; color: var(--muted); font-size: 0.9rem; max-width: none; }
.end-note { color: var(--muted); font-size: 0.9rem; position: relative; }
.end-unlock { position: relative; color: #8de59a; font-weight: 700; margin: 12px 0 0; }
.end-unlock.hero { color: var(--gold-hi); }
.end-tip { position: relative; background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 8px; text-align: left; }

/* ---------- Responsive battle ---------- */
@media (max-width: 900px), (max-height: 520px) and (orientation: landscape) {
  .hud { gap: 6px; padding: 4px 8px; flex-wrap: wrap; min-height: 0; }
  .hud-stage span:last-child { max-width: 120px; font-size: 0.9rem; }
  .stat { padding: 2px 8px; }
  .btn-wave { min-width: 0; padding: 0.4em 0.8em; min-height: 40px; }
}
@media (max-width: 900px) and (orientation: portrait), (max-width: 620px) {
  .battle-body { flex-direction: column; }
  .buildbar { width: auto; flex-direction: row; border-left: 0; border-top: 2px solid var(--gold-deep); overflow-x: auto; overflow-y: hidden; padding: 6px; }
  .build-btn { flex: 1 0 64px; }
  .build-btn canvas { width: 52px; height: 40px; }
  .hud-stats { order: 3; flex-basis: 100%; }
  .tower-panel { width: min(260px, calc(100% - 12px)); }
}
@media (max-width: 620px) and (orientation: portrait) {
  .stage::before {
    content: 'Turn your phone sideways for a bigger battlefield.'; position: absolute; top: 10px; left: 0; right: 0;
    text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 12px;
  }
}
@media (max-height: 520px) and (orientation: landscape) {
  .buildbar { width: 84px; gap: 4px; padding: 4px; }
  .build-btn { padding: 2px 2px 4px; }
  .build-btn canvas { width: 44px; height: 30px; }
  .bb-name { display: none; }
  .smite-btn > .ico { width: 24px; height: 24px; margin: 2px 0; }
  .hud { padding: 2px 6px; }
  .hud-btn { height: 38px; min-width: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

  <script>/* js/config.js */
/* =====================================================================
 * Realm Guardians — config.js
 * Global namespace, balance knobs and small shared utilities.
 * Most difficulty tuning happens here and in js/data/*.js.
 * ===================================================================== */
window.RG = window.RG || {};

RG.CONFIG = {
  VERSION: '1.0.0',
  SAVE_KEY: 'realmGuardians.save.v1',

  // ---- World / grid (logical pixels; the canvas is scaled to fit) ----
  WORLD_W: 960, WORLD_H: 600, TILE: 40, COLS: 24, ROWS: 15,
  PATH_HALF_WIDTH: 20,           // tiles whose centre is this close to a road are road tiles

  // ---- Simulation ----
  STEP: 1 / 60,                  // fixed timestep in seconds (deterministic, speed-independent)
  MAX_STEPS_PER_FRAME: 12,

  // ---- Battle rules ----
  START_LIVES: 20,
  SELL_RATIO: 0.7,               // refund fraction of everything invested in a tower
  EARLY_CALL_BONUS: 10,          // + 2 per wave index when calling a wave while enemies remain
  WAVE_BONUS_BASE: 12,
  WAVE_BONUS_PER_WAVE: 3,
  ELITE: { hp: 2.5, gold: 3, size: 1.25, atk: 1.8 },
  MAX_FX: 650,

  // ---- Stage scaling (g = global stage index 0..49) ----
  hpMult(g) { return 1 + 0.045 * g + 0.001 * g * g; },
  goldMult(g) { return 1.2 + 0.022 * g; },
  startGold(m, l) { return 260 + m * 70 + l * 8; },

  STARS: [0.9, 0.5],             // fraction of lives kept for 3 stars / 2 stars
  CRYSTALS: { base: 12, perStage: 2, starFrac: [0, 0.6, 0.8, 1], replayFrac: 0.15, mapBonus: 50 },
  SMITE: { radius: 80, damage: 90, cooldown: 45, stun: 1.0 },
};

RG.util = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; },
  /** Deterministic PRNG (mulberry32). Returns a function producing [0,1). */
  rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
  pickWeighted(items, weightFn, rnd) {
    let total = 0;
    for (const it of items) total += weightFn(it);
    let r = rnd() * total;
    for (const it of items) { r -= weightFn(it); if (r <= 0) return it; }
    return items[items.length - 1];
  },
  fmt(n) { n = Math.round(n); return n >= 100000 ? Math.round(n / 1000) + 'k' : n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(n); },
  levelLabel(m, l) { return (m + 1) + '-' + (l + 1); },
};

  <script>/* js/data/levels.js */
/* =====================================================================
 * Realm Guardians — data/levels.js
 * Builds the 50-stage campaign (5 maps × 10 levels) from map data.
 * Generation is seeded per stage, so every player gets the same waves.
 *
 * Level shape:
 *   { id:'m-l', mapIdx, lvlIdx, g, name, layoutIdx, startGold,
 *     isMini, isBoss, waves:[{ groups:[{type,count,interval,delay,elite,path}] }] }
 *
 * Hand-authored overrides: put a full level object in RG.LEVEL_OVERRIDES
 * under its id (e.g. '0-0') and it will be used instead of the generator.
 * ===================================================================== */

RG.LEVEL_OVERRIDES = {};

RG.Levels = (function () {
  const C = RG.CONFIG, U = RG.util;
  const LEVELS_PER_MAP = 10;
  const cache = {};

  function spacingFor(def) {
    // Faster enemies spawn closer together in time so they still look like a pack.
    return U.clamp(26 / def.speed + 0.22, 0.32, 1.1);
  }

  function generate(m, l) {
    const map = RG.MAPS[m];
    const g = m * LEVELS_PER_MAP + l;
    const rnd = U.rng(1009 + g * 7919);
    const layoutIdx = l % map.layouts.length;
    const nPaths = map.layouts[layoutIdx].paths.length;
    const nWaves = Math.min(12, 5 + Math.floor(l / 2) + Math.floor(m / 2));
    const pool = map.pool.filter(p => p.from <= l && !RG.ENEMIES[p.type].boss);
    const eliteChance = Math.min(0.6, 0.05 * l + 0.06 * m);
    const waves = [];
    let pathCursor = 0;

    for (let w = 0; w < nWaves; w++) {
      const budget = (6 + 6 * w + 0.8 * w * w) * (1 + 0.07 * l) * (1 + 0.15 * m + 0.03 * m * m) * Math.min(1, 0.72 + 0.02 * g);
      const nGroups = 1 + (w >= 2 ? 1 : 0) + (w >= 5 ? 1 : 0);
      const groups = [];
      let remaining = budget, delay = 0;
      for (let k = 0; k < nGroups; k++) {
        const share = k === nGroups - 1 ? remaining : remaining / (nGroups - k) * (0.8 + rnd() * 0.4);
        remaining -= share;
        // Heavy units only when the budget can afford a handful of them.
        const options = pool.filter(p => RG.ENEMIES[p.type].threat <= Math.max(3, share / 2.5));
        const pick = w === 0 && k === 0
          ? options.reduce((a, b) => (RG.ENEMIES[a.type].threat <= RG.ENEMIES[b.type].threat ? a : b))
          : U.pickWeighted(options, p => p.w * (p.from === l ? 1.5 : 1), rnd);
        const def = RG.ENEMIES[pick.type];
        const count = U.clamp(Math.round(share / def.threat), 1, 40);
        const interval = spacingFor(def);
        groups.push({ type: pick.type, count, interval, delay, elite: false, path: pathCursor++ % nPaths });
        delay += count * interval * 0.55 + 1.5;
      }
      // Elite squads in the second half of later levels.
      if (g >= 3 && w >= nWaves / 2 && rnd() < eliteChance) {
        const ground = pool.filter(p => RG.ENEMIES[p.type].threat >= 1.5 && RG.ENEMIES[p.type].threat < 30);
        if (ground.length) {
          const pick = U.pickWeighted(ground, p => p.w, rnd);
          groups.push({ type: pick.type, count: 1 + Math.floor(m / 2), interval: 1.2, delay: delay + 1, elite: true, path: pathCursor++ % nPaths });
        }
      }
      // Mini-boss on level 5 (index 4) and mid-way through the boss level.
      if ((l === 4 && w === nWaves - 1) || (l === 9 && w === Math.floor(nWaves / 2))) {
        groups.push({ type: map.mini, count: 1, interval: 1, delay: delay + 2, elite: l === 9 && !RG.ENEMIES[map.mini].flying, path: 0 });
      }
      if (l === 9 && w === nWaves - 1) {
        groups.push({ type: map.boss, count: 1, interval: 1, delay: delay + 3, elite: false, path: 0 });
      }
      waves.push({ groups });
    }

    return {
      id: m + '-' + l, mapIdx: m, lvlIdx: l, g, name: map.levelNames[l], layoutIdx,
      startGold: C.startGold(m, l), isMini: l === 4, isBoss: l === 9, waves,
    };
  }

  function get(m, l) {
    const id = m + '-' + l;
    if (!cache[id]) cache[id] = RG.LEVEL_OVERRIDES[id] || generate(m, l);
    return cache[id];
  }

  /** Unique enemy types appearing in a level (for the level preview). */
  function enemyTypes(level) {
    const set = [];
    for (const w of level.waves) for (const gr of w.groups) if (!set.includes(gr.type)) set.push(gr.type);
    return set;
  }

  return { get, enemyTypes, LEVELS_PER_MAP, count: () => RG.MAPS.length * LEVELS_PER_MAP };
})();

  <script>/* js/core/progression.js */
/* =====================================================================
 * Realm Guardians — core/progression.js
 * - RG.computeTowerStats(): the single source of truth for what a tower
 *   does at a given in-match tier (1-4) and permanent hero level (1-5).
 * - RG.Progress: unlock rules, rewards, hero & kingdom upgrades.
 * All functions operate on a plain save object (see core/save.js).
 * ===================================================================== */

RG.MAX_TIER = 4;
RG.MAX_HERO_LEVEL = 5;

RG.computeTowerStats = function (id, tier, heroLevel) {
  const d = RG.TOWERS[id];
  const i = tier - 1, hl = heroLevel;
  const s = {
    id, tier, heroLevel: hl,
    damage: d.damage * d.tiers.dmg[i] * (1 + 0.06 * (hl - 1)),
    rate: d.rate * d.tiers.rate[i],
    range: d.range * d.tiers.range[i],
    dmgType: d.dmgType, armorPierce: d.armorPierce || 0, canHitAir: d.canHitAir !== false,
  };
  switch (id) {
    case 'archer':
      if (hl >= 2) s.rate *= 1.2;
      if (hl >= 3) { s.critChance = 0.2 + 0.03 * i; s.critMult = 2; }
      if (hl >= 4) s.multishot = tier >= 4 ? 2 : 1;
      if (hl >= 5) { s.pierce = 2; s.critMult = 2.5; }
      break;
    case 'mage':
      if (hl >= 2) s.slow = { pct: 0.28 + 0.04 * i, dur: 1.5 };
      if (hl >= 3) { s.chain = 2 + (tier >= 3 ? 1 : 0); s.chainRange = 110; s.chainFalloff = 0.7; }
      if (hl >= 4) { s.range *= 1.1; s.chain += 1; }
      if (hl >= 5) s.nova = { every: 5, radius: 75, mult: 1.5 };
      break;
    case 'cannon':
      s.splash = d.splash * (1 + 0.08 * i);
      if (hl >= 2) s.splash *= 1.25;
      if (hl >= 3) s.damage *= 1.2;
      if (hl >= 4) s.cluster = { count: 3, mult: 0.35, radius: 34 };
      if (hl >= 5) s.stun = 0.5;
      break;
    case 'lich':
      s.curse = { dps: s.damage * 0.9, dur: 4, maxStacks: 1 };
      if (hl >= 2) { s.curse.maxStacks = 2; s.curse.dur = 5; }
      if (hl >= 3) s.curse.weaken = 0.15 + 0.03 * i;
      if (hl >= 4) s.curse.harvest = { gold: 2, soulsPerLife: 25 };
      if (hl >= 5) s.curse.plague = { count: 2, radius: 90 };
      break;
    case 'necro': {
      const tm = d.tiers.dmg[i];
      s.summon = {
        max: 2 + (hl >= 2 ? 1 : 0) + (hl >= 4 ? 1 : 0) + (tier >= 3 ? 1 : 0),
        hp: 110 * tm * (1 + 0.1 * (hl - 1)) * (hl >= 2 ? 1.3 : 1),
        dmg: 9 * tm * (1 + 0.06 * (hl - 1)),
        atkRate: 1.1,
        life: 18 + (hl >= 3 ? 6 : 0),
        armor: hl >= 3 ? 0.25 : 0,
        interval: 5.5 / d.tiers.rate[i],
      };
      if (hl >= 5) s.summon.champion = { every: 24, hpMult: 4, dmgMult: 3, life: 30 };
      break;
    }
  }
  return s;
};

/** Human-readable stat lines shared by the tower panel and hero screen. */
RG.describeStats = function (s) {
  const pct = v => Math.round(v * 100) + '%';
  const lines = [];
  if (s.id === 'necro') {
    const sm = s.summon;
    lines.push(['Skeletons', sm.max + ' max']);
    lines.push(['Skeleton HP', Math.round(sm.hp)]);
    lines.push(['Skeleton hit', Math.round(sm.dmg)]);
    lines.push(['Raise every', sm.interval.toFixed(1) + 's']);
    if (sm.champion) lines.push(['Champion', 'every ' + sm.champion.every + 's']);
    lines.push(['Bone bolt', Math.round(s.damage)]);
  } else {
    lines.push(['Damage', Math.round(s.damage) + (s.dmgType === 'magic' ? ' magic' : ' physical')]);
    lines.push(['Attacks/sec', s.rate.toFixed(2)]);
  }
  lines.push(['Range', Math.round(s.range)]);
  if (s.critChance) lines.push(['Critical', pct(s.critChance) + ' ×' + s.critMult]);
  if (s.multishot) lines.push(['Volley', '+' + s.multishot + ' arrows']);
  if (s.pierce) lines.push(['Pierce', (s.pierce + 1) + ' enemies']);
  if (s.slow) lines.push(['Slow', pct(s.slow.pct)]);
  if (s.chain) lines.push(['Chain', s.chain + ' jumps']);
  if (s.nova) lines.push(['Nova', 'every ' + s.nova.every + ' casts']);
  if (s.splash) lines.push(['Blast radius', Math.round(s.splash)]);
  if (s.armorPierce) lines.push(['Armor pierce', pct(s.armorPierce)]);
  if (s.cluster) lines.push(['Cluster', s.cluster.count + ' bomblets']);
  if (s.stun) lines.push(['Stun', s.stun + 's']);
  if (s.curse) {
    lines.push(['Curse', Math.round(s.curse.dps) + '/s × ' + s.curse.maxStacks]);
    if (s.curse.weaken) lines.push(['Weaken', '+' + pct(s.curse.weaken) + ' dmg taken']);
    if (s.curse.harvest) lines.push(['Harvest', '+' + s.curse.harvest.gold + ' gold']);
    if (s.curse.plague) lines.push(['Plague', 'spreads to ' + s.curse.plague.count]);
  }
  if (!s.canHitAir) lines.push(['Flyers', 'cannot target']);
  return lines;
};

RG.Progress = (function () {
  const C = RG.CONFIG;
  const LPM = 10;

  function key(m, l) { return m + '-' + l; }
  function rec(save, m, l) { return save.levels[key(m, l)] || { stars: 0, completed: false }; }
  function isCompleted(save, m, l) { return !!rec(save, m, l).completed; }

  /** Stage (m,l) is playable when it is the first stage or its predecessor is completed. */
  function isLevelUnlocked(save, m, l) {
    if (m < 0 || m >= RG.MAPS.length || l < 0 || l >= LPM) return false;
    if (m === 0 && l === 0) return true;
    return l > 0 ? isCompleted(save, m, l - 1) : isCompleted(save, m - 1, LPM - 1);
  }
  function isMapUnlocked(save, m) { return isLevelUnlocked(save, m, 0); }
  function mapStars(save, m) { let s = 0; for (let l = 0; l < LPM; l++) s += rec(save, m, l).stars; return s; }
  function totalStars(save) { let s = 0; for (let m = 0; m < RG.MAPS.length; m++) s += mapStars(save, m); return s; }

  function starsFor(lives, maxLives) {
    if (lives <= 0) return 0;
    const f = lives / maxLives;
    return f >= C.STARS[0] ? 3 : f >= C.STARS[1] ? 2 : 1;
  }

  function baseReward(m, l) { return C.CRYSTALS.base + C.CRYSTALS.perStage * (m * LPM + l); }
  function rewardForStars(m, l, stars) { return Math.round(baseReward(m, l) * C.CRYSTALS.starFrac[stars]); }

  /** Preview what a victory would pay right now (for the level panel). */
  function rewardPreview(save, m, l) {
    const r = rec(save, m, l);
    return {
      maxNew: rewardForStars(m, l, 3) - rewardForStars(m, l, r.stars),
      replay: r.completed ? Math.round(baseReward(m, l) * C.CRYSTALS.replayFrac) : 0,
      mapBonus: !r.completed && l === LPM - 1 ? C.CRYSTALS.mapBonus : 0,
    };
  }

  /**
   * Apply a victory. Crystals are only paid for stars not earned before,
   * plus a small replay bonus, so the first-clear reward cannot be farmed.
   */
  function recordVictory(save, m, l, stars) {
    stars = Math.max(1, Math.min(3, stars | 0));
    const r = rec(save, m, l);
    const firstClear = !r.completed;
    const starGain = Math.max(0, rewardForStars(m, l, stars) - rewardForStars(m, l, r.stars));
    const replay = firstClear ? 0 : Math.round(baseReward(m, l) * C.CRYSTALS.replayFrac);
    const mapBonus = firstClear && l === LPM - 1 ? C.CRYSTALS.mapBonus : 0;
    const total = starGain + replay + mapBonus;
    const newlyUnlocked = firstClear ? nextStage(m, l) : null;
    save.levels[key(m, l)] = { stars: Math.max(r.stars, stars), completed: true };
    save.crystals += total;
    save.stats.victories++;
    return { crystals: total, starGain, replay, mapBonus, firstClear, newlyUnlocked, prevStars: r.stars };
  }

  function nextStage(m, l) {
    if (l < LPM - 1) return { m, l: l + 1 };
    if (m < RG.MAPS.length - 1) return { m: m + 1, l: 0 };
    return null;
  }

  // ---- Heroes ----
  function heroReqMet(save, id) {
    const req = RG.TOWERS[id].unlock.requires;
    if (!req) return true;
    const [m, l] = req.split('-').map(Number);
    return isCompleted(save, m, l);
  }
  function canUnlockHero(save, id) {
    const h = save.heroes[id];
    return !h.unlocked && heroReqMet(save, id) && save.crystals >= RG.TOWERS[id].unlock.cost;
  }
  function unlockHero(save, id) {
    if (!canUnlockHero(save, id)) return false;
    save.crystals -= RG.TOWERS[id].unlock.cost;
    save.heroes[id].unlocked = true;
    return true;
  }
  function heroUpgradeCost(save, id) {
    const h = save.heroes[id];
    if (h.level >= RG.MAX_HERO_LEVEL) return null;
    return RG.TOWERS[id].heroCosts[h.level + 1];
  }
  function canUpgradeHero(save, id) {
    const c = heroUpgradeCost(save, id);
    return save.heroes[id].unlocked && c !== null && save.crystals >= c;
  }
  function upgradeHero(save, id) {
    if (!canUpgradeHero(save, id)) return false;
    save.crystals -= heroUpgradeCost(save, id);
    save.heroes[id].level++;
    return true;
  }

  // ---- Kingdom ----
  function kingdomCost(save, k) {
    const lv = save.kingdom[k], def = RG.KINGDOM[k];
    return lv >= def.max ? null : def.costs[lv];
  }
  function buyKingdom(save, k) {
    const c = kingdomCost(save, k);
    if (c === null || save.crystals < c) return false;
    save.crystals -= c;
    save.kingdom[k]++;
    return true;
  }

  return {
    key, rec, isCompleted, isLevelUnlocked, isMapUnlocked, mapStars, totalStars, starsFor,
    baseReward, rewardForStars, rewardPreview, recordVictory, nextStage,
    heroReqMet, canUnlockHero, unlockHero, heroUpgradeCost, canUpgradeHero, upgradeHero,
    kingdomCost, buyKingdom, LPM,
  };
})();

/* =====================================================================
 * Realm Guardians — core/save.js
 * Persists progress in localStorage. Every load goes through validate(),
 * so missing, outdated or corrupted data falls back to safe defaults
 * instead of crashing the game.
 * ===================================================================== */

RG.Save = (function () {
  const KEY = RG.CONFIG.SAVE_KEY;
  let memoryFallback = null; // used when localStorage is unavailable (private mode, sandbox)

  function defaults() {
    const heroes = {};
    for (const id of RG.TOWER_ORDER) heroes[id] = { unlocked: RG.TOWERS[id].unlock.cost === 0 && !RG.TOWERS[id].unlock.requires, level: 1 };
    const kingdom = {};
    for (const k in RG.KINGDOM) kingdom[k] = 0;
    return {
      version: 1,
      crystals: 0,
      heroes,
      levels: {},
      kingdom,
      settings: { music: 0.45, sfx: 0.7, muted: false, damageNumbers: true, showGrid: true, defaultSpeed: 1 },
      stats: { played: 0, victories: 0, kills: 0 },
      seenTutorial: false,
    };
  }

  const num = (v, lo, hi, dflt) => (typeof v === 'number' && isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt);
  const int = (v, lo, hi, dflt) => Math.round(num(v, lo, hi, dflt));
  const bool = (v, dflt) => (typeof v === 'boolean' ? v : dflt);

  function validate(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    d.crystals = int(raw.crystals, 0, 1e7, 0);
    if (raw.heroes && typeof raw.heroes === 'object') {
      for (const id of RG.TOWER_ORDER) {
        const h = raw.heroes[id];
        if (!h || typeof h !== 'object') continue;
        d.heroes[id].unlocked = d.heroes[id].unlocked || bool(h.unlocked, false);
        d.heroes[id].level = int(h.level, 1, RG.MAX_HERO_LEVEL, 1);
      }
    }
    if (raw.levels && typeof raw.levels === 'object') {
      for (const k of Object.keys(raw.levels)) {
        const mm = /^(\d+)-(\d+)$/.exec(k);
        if (!mm) continue;
        const m = +mm[1], l = +mm[2];
        if (m >= RG.MAPS.length || l >= RG.Progress.LPM) continue;
        const r = raw.levels[k] || {};
        const completed = bool(r.completed, false);
        const stars = int(r.stars, 0, 3, 0);
        if (completed) d.levels[k] = { completed: true, stars: Math.max(1, stars) };
      }
    }
    if (raw.kingdom && typeof raw.kingdom === 'object') {
      for (const k in RG.KINGDOM) d.kingdom[k] = int(raw.kingdom[k], 0, RG.KINGDOM[k].max, 0);
    }
    const s = raw.settings || {};
    d.settings.music = num(s.music, 0, 1, d.settings.music);
    d.settings.sfx = num(s.sfx, 0, 1, d.settings.sfx);
    d.settings.muted = bool(s.muted, false);
    d.settings.damageNumbers = bool(s.damageNumbers, true);
    d.settings.showGrid = bool(s.showGrid, true);
    d.settings.defaultSpeed = [1, 2, 3].includes(s.defaultSpeed) ? s.defaultSpeed : 1;
    const st = raw.stats || {};
    d.stats.played = int(st.played, 0, 1e9, 0);
    d.stats.victories = int(st.victories, 0, 1e9, 0);
    d.stats.kills = int(st.kills, 0, 1e12, 0);
    d.seenTutorial = bool(raw.seenTutorial, false);
    return d;
  }

  function storage() {
    try { const ls = window.localStorage; const t = '__rg_test__'; ls.setItem(t, '1'); ls.removeItem(t); return ls; } catch (e) { return null; }
  }

  function load() {
    try {
      const ls = storage();
      const raw = ls ? ls.getItem(KEY) : memoryFallback;
      if (!raw) return defaults();
      return validate(JSON.parse(raw));
    } catch (e) {
      console.warn('[Realm Guardians] Save data unreadable, starting fresh.', e);
      return defaults();
    }
  }

  function save(data) {
    const json = JSON.stringify(data);
    try {
      const ls = storage();
      if (ls) ls.setItem(KEY, json); else memoryFallback = json;
      return true;
    } catch (e) { memoryFallback = json; return false; }
  }

  function reset() {
    try { const ls = storage(); if (ls) ls.removeItem(KEY); } catch (e) { /* ignore */ }
    memoryFallback = null;
    return defaults();
  }

  return { defaults, validate, load, save, reset, isPersistent: () => !!storage() };
})();

/* =====================================================================
 * Realm Guardians — core/audio.js
 * Every sound is synthesised with the Web Audio API: no audio files to
 * download or license. Music is a small generative modal sequencer.
 * The AudioContext is created on the first user gesture (browser rule).
 * To swap in recorded audio later, replace the bodies of SFX entries.
 * ===================================================================== */

RG.Audio = (function () {
  let ctx = null, master, sfxGain, musicGain, noiseBuf = null;
  let settings = { music: 0.45, sfx: 0.7, muted: false };
  const last = {};
  const music = { timer: null, theme: null, step: 0, next: 0, pending: null };

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.connect(ctx.destination);
    sfxGain = ctx.createGain(); sfxGain.connect(master);
    musicGain = ctx.createGain(); musicGain.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    apply();
    if (music.pending) { const p = music.pending; music.pending = null; startMusic(p); }
    return true;
  }

  function apply(s) {
    if (s) settings = s;
    if (!ctx) return;
    master.gain.value = settings.muted ? 0 : 1;
    sfxGain.gain.value = settings.sfx * 0.9;
    musicGain.gain.value = settings.music * 0.32;
  }

  function tone(f, dur, type, vol, f2, delay, dest) {
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t); o.stop(t + dur + 0.05);

    const f = ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || sfxGain);

  const SFX = {
    click() { tone(720, 0.05, 'triangle', 0.1); },
    bow() { noise(0.07, 2600, 0.14, 'bandpass'); tone(520, 0.06, 'triangle', 0.04, 260); },
    magic() { tone(700, 0.16, 'sine', 0.07, 1400); tone(1050, 0.12, 'triangle', 0.03, 1800, 0.02); },
    zap() { noise(0.1, 4500, 0.09, 'highpass'); tone(1800, 0.06, 'square', 0.02, 900); },
    nova() { tone(300, 0.4, 'sine', 0.12, 900); noise(0.3, 1800, 0.1, 'bandpass'); },
    cannon() { noise(0.18, 500, 0.22); tone(140, 0.15, 'sine', 0.18, 60); },
    boom() { noise(0.4, 700, 0.28); tone(90, 0.3, 'sine', 0.24, 35); },
    curse() { tone(240, 0.22, 'sawtooth', 0.035, 120); tone(180, 0.25, 'sine', 0.05, 90); },
    bone() { tone(320, 0.07, 'square', 0.03, 180); },
    summon() { tone(150, 0.35, 'sawtooth', 0.05, 330); noise(0.25, 900, 0.07, 'bandpass'); },
    death() { tone(280, 0.1, 'square', 0.03, 110); },
    leak() { tone(220, 0.3, 'sawtooth', 0.1, 90); noise(0.2, 300, 0.12); },
    place() { noise(0.12, 320, 0.22); tone(150, 0.14, 'sine', 0.18, 80); },
    upgrade() { [523, 659, 784].forEach((f, i) => tone(f, 0.16, 'triangle', 0.09, null, i * 0.07)); },
    sell() { tone(880, 0.07, 'triangle', 0.09); tone(660, 0.12, 'triangle', 0.09, null, 0.06); },
    coin() { tone(1250, 0.05, 'square', 0.03); tone(1650, 0.08, 'square', 0.03, null, 0.05); },
    wave() { tone(196, 0.55, 'sawtooth', 0.06); tone(294, 0.55, 'sawtooth', 0.05, null, 0.06); },
    warcry() { tone(110, 0.5, 'sawtooth', 0.12, 160); noise(0.4, 600, 0.1, 'bandpass'); },
    boss() { tone(65, 1.3, 'sawtooth', 0.16, 42); noise(1.1, 220, 0.18); },
    bossDeath() { noise(1.3, 500, 0.35); tone(95, 1.1, 'sine', 0.3, 30); [392, 494, 587, 784].forEach((f, i) => tone(f, 0.4, 'triangle', 0.08, null, 0.5 + i * 0.12)); },
    smite() { noise(0.6, 3200, 0.22, 'highpass'); tone(1400, 0.45, 'sine', 0.1, 220); tone(110, 0.5, 'sine', 0.2, 50); },
    fire() { noise(0.7, 900, 0.22, 'bandpass'); tone(160, 0.6, 'sawtooth', 0.05, 80); },
    stun() { tone(520, 0.28, 'sine', 0.06, 160); noise(0.2, 2000, 0.06, 'highpass'); },
    victory() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, 'triangle', 0.12, null, i * 0.13)); },
    defeat() { [392, 349, 311, 262].forEach((f, i) => tone(f, 0.55, 'sawtooth', 0.06, null, i * 0.24)); },
    error() { tone(160, 0.12, 'square', 0.05); },
    unlock() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, null, i * 0.08)); },
  };
  const GAP = { bow: 0.05, magic: 0.06, death: 0.035, boom: 0.06, cannon: 0.08, zap: 0.07, bone: 0.08, curse: 0.1, summon: 0.2, coin: 0.05, leak: 0.1, stun: 0.15 };

  function play(name) {
    if (!ctx || settings.muted || settings.sfx <= 0) return;
    const now = ctx.currentTime;
    if (last[name] && now - last[name] < (GAP[name] || 0.03)) return;
    last[name] = now;
    try { if (SFX[name]) SFX[name](); } catch (e) { /* audio must never break the game */ }
  }

  /* ---------- Generative music ---------- */
  const DORIAN = [0, 2, 3, 5, 7, 9, 10];
  const PHRYG = [0, 1, 3, 5, 7, 8, 10];
  const THEMES = {
    menu: { root: 50, scale: DORIAN, tempo: 0.36, prog: [0, 5, 3, 4], pattern: [0, 2, 4, 2, 7, 4, 2, 4] },
    battle: { root: 50, scale: DORIAN, tempo: 0.24, prog: [0, 0, 5, 6], pattern: [0, 4, 7, 4, 2, 4, 7, 9] },
    boss: { root: 45, scale: PHRYG, tempo: 0.18, prog: [0, 1, 0, 6], pattern: [0, 0, 7, 0, 3, 0, 8, 7], drums: true },
  };
  const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

  function startMusic(name, root) {
    if (!ctx) { music.pending = name; music.pendingRoot = root; return; }
    const base = THEMES[name] || THEMES.menu;
    const theme = { ...base, root: root || (music.pendingRoot && name !== 'menu' ? music.pendingRoot : base.root) };
    music.pendingRoot = null;
    if (music.theme && music.theme.name === name && music.theme.root === theme.root) return;
    stopMusic();
    theme.name = name;
    music.theme = theme; music.step = 0; music.next = ctx.currentTime + 0.1;
    music.timer = setInterval(schedule, 90);
  }
  function stopMusic() { if (music.timer) clearInterval(music.timer); music.timer = null; music.theme = null; }

  function note(n, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = type; o.frequency.value = mtof(n);
    f.type = 'lowpass'; f.frequency.value = 1800;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.05);
  }

  function schedule() {
    const th = music.theme;
    if (!th || !ctx) return;
    while (music.next < ctx.currentTime + 0.35) {
      const step = music.step, t = music.next;
      const bar = Math.floor(step / 8) % th.prog.length;
      const deg = th.prog[bar];
      const sc = th.scale;
      const pitch = d => th.root + sc[(deg + d) % 7] + 12 * Math.floor((deg + d) / 7);
      if (step % 8 === 0) {
        for (const d of [0, 2, 4]) note(pitch(d) - 12, t, th.tempo * 8, 'triangle', 0.06);
        note(pitch(0) - 24, t, th.tempo * 8, 'sine', 0.12);
      }
      const p = th.pattern[step % 8];
      if (!(th.name === 'menu' && step % 2)) note(pitch(p) + 12, t, th.tempo * 1.8, 'triangle', 0.05);
      if (th.drums && step % 2 === 0) { noise(0.12, 180, 0.18, 'lowpass', t - ctx.currentTime, musicGain); }
      if (th.drums && step % 4 === 2) { noise(0.08, 2500, 0.06, 'highpass', t - ctx.currentTime, musicGain); }
      music.step++; music.next += th.tempo;
    }
  }

  return { ensure, apply, play, startMusic, stopMusic, ready: () => !!ctx };
})();

  <script>/* js/game/terrain.js */
/* =====================================================================
 * Realm Guardians — game/terrain.js
 * Turns a map layout into pixel paths, a buildable grid and decoration.
 * Pure data (no DOM), so the Node test-suite can use it too.
 *
 * Grid cell values:  0 = buildable  1 = road  2 = blocked scenery  3 = castle
 * ===================================================================== */

RG.Terrain = (function () {
  const C = RG.CONFIG, T = C.TILE;
  const cache = {};

  const tc = p => ({ x: (p[0] + 0.5) * T, y: (p[1] + 0.5) * T });

  function segDist(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - a.x) * dx + (py - a.y) * dy) / len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const x = a.x + dx * t, y = a.y + dy * t;
    return Math.hypot(px - x, py - y);
  }

  function minPathDist(x, y, paths) {
    let best = Infinity;
    for (const p of paths) for (let i = 1; i < p.length; i++) best = Math.min(best, segDist(x, y, p[i - 1], p[i]));
    return best;
  }

  /** Smooth sky route for flyers: a quadratic curve from entrance to castle. */
  function defaultAir(start, end) {
    const mx = (start.x + end.x) / 2, my = (start.y + end.y) / 2;
    const nx = -(end.y - start.y), ny = end.x - start.x;
    const nl = Math.hypot(nx, ny) || 1;
    const off = 70;
    const cx = mx + nx / nl * off, cy = my + ny / nl * off;
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, u = 1 - t;
      pts.push({ x: u * u * start.x + 2 * u * t * cx + t * t * end.x, y: u * u * start.y + 2 * u * t * cy + t * t * end.y });
    }
    return pts;
  }

  function build(mapIdx, layoutIdx) {
    const key = mapIdx + ':' + layoutIdx;
    if (cache[key]) return cache[key];
    const map = RG.MAPS[mapIdx];
    const lay = map.layouts[layoutIdx];
    const paths = lay.paths.map(p => p.map(tc));
    const castle = paths[0][paths[0].length - 1];
    const air = lay.air ? lay.air.map(tc) : defaultAir(paths[0][0], castle);

    const grid = new Uint8Array(C.COLS * C.ROWS);
    const pathDist = new Float32Array(C.COLS * C.ROWS);
    for (let r = 0; r < C.ROWS; r++) {
      for (let c = 0; c < C.COLS; c++) {
        const x = (c + 0.5) * T, y = (r + 0.5) * T, i = r * C.COLS + c;
        const d = minPathDist(x, y, paths);
        pathDist[i] = d;
        if (d <= C.PATH_HALF_WIDTH) grid[i] = 1;
        else if (Math.hypot(x - castle.x, y - castle.y) < 58) grid[i] = 3;
      }
    }

    // Decoration: large pieces block building but never sit right beside the road.
    const rnd = RG.util.rng(4242 + mapIdx * 131 + layoutIdx * 17);
    const decor = [];
    let tries = 0, placed = 0;
    while (placed < map.decor.bigCount && tries++ < 2000) {
      const c = Math.floor(rnd() * C.COLS), r = Math.floor(rnd() * C.ROWS), i = r * C.COLS + c;
      if (grid[i] !== 0 || pathDist[i] < T * 1.9) continue;
      grid[i] = 2;
      placed++;
      decor.push({
        kind: map.decor.big[Math.floor(rnd() * map.decor.big.length)], big: true,
        x: (c + 0.5) * T + (rnd() - 0.5) * 8, y: (r + 0.5) * T + (rnd() - 0.5) * 8,
        s: 0.85 + rnd() * 0.35, seed: rnd(),
      });
    }
    for (let k = 0; k < map.decor.smallCount; k++) {
      const x = rnd() * C.WORLD_W, y = rnd() * C.WORLD_H;
      const c = Math.floor(x / T), r = Math.floor(y / T), i = r * C.COLS + c;
      if (grid[i] === 1 || grid[i] === 3 || pathDist[i] < 26) continue;
      decor.push({ kind: map.decor.small[Math.floor(rnd() * map.decor.small.length)], big: false, x, y, s: 0.7 + rnd() * 0.6, seed: rnd() });
    }
    decor.sort((a, b) => (a.big - b.big) || (a.y - b.y));

    const out = { mapIdx, layoutIdx, paths, air, castle, grid, pathDist, decor };
    cache[key] = out;
    return out;
  }

  return { build, tc, segDist };
})();
