/* =====================================================================
 * Realm Guardians — game/battle.js
 * The deterministic battle simulation. No DOM or canvas access here:
 * the renderer only READS this state, and the UI talks to it through
 * the public methods (placeTower, upgradeTower, sellTower,
 * startNextWave, castSmite, setTargeting) and the onEvent callback.
 *
 * Events emitted via battle.onEvent(type, data):
 *   sfx(name) · toast({text,kind}) · newEnemy(type) · boss(enemy)
 *   wave(index) · waveClear({wave,bonus}) · lifeLost · end({result})
 * ===================================================================== */
(function () {
  const C = RG.CONFIG, U = RG.util, T = C.TILE;

  /* ---------- Path following ---------- */
  class PathTrack {
    constructor(pts) {
      this.pts = pts;
      this.cum = [0];
      for (let i = 1; i < pts.length; i++) this.cum.push(this.cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
      this.length = this.cum[this.cum.length - 1];
    }
    at(d, out) {
      out = out || {};
      const p = this.pts, cum = this.cum, n = p.length - 1;
      if (d <= 0) { out.x = p[0].x; out.y = p[0].y; out.a = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x); return out; }
      if (d >= this.length) { out.x = p[n].x; out.y = p[n].y; out.a = Math.atan2(p[n].y - p[n - 1].y, p[n].x - p[n - 1].x); return out; }
      let i = 1;
      while (cum[i] < d) i++;
      const seg = cum[i] - cum[i - 1], t = seg > 0 ? (d - cum[i - 1]) / seg : 0;
      out.x = p[i - 1].x + (p[i].x - p[i - 1].x) * t;
      out.y = p[i - 1].y + (p[i].y - p[i - 1].y) * t;
      out.a = Math.atan2(p[i].y - p[i - 1].y, p[i].x - p[i - 1].x);
      return out;
    }
    nearest(x, y) {
      let best = { dist: Infinity, d: 0, x: 0, y: 0 };
      const p = this.pts;
      for (let i = 1; i < p.length; i++) {
        const a = p[i - 1], b = p[i], dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
        let t = len2 ? ((x - a.x) * dx + (y - a.y) * dy) / len2 : 0;
        t = U.clamp(t, 0, 1);
        const px = a.x + dx * t, py = a.y + dy * t, dist = Math.hypot(x - px, y - py);
        if (dist < best.dist) best = { dist, d: this.cum[i - 1] + t * Math.sqrt(len2), x: px, y: py };
      }
      return best;
    }
  }
  RG.PathTrack = PathTrack;

  const tmp = {};

  /* ---------- Battle ---------- */
  class Battle {
    /**
     * @param level   level object from RG.Levels.get()
     * @param profile { heroes:{id:{unlocked,level}}, kingdom:{...} } (a save works)
     * @param opts    { seed, damageNumbers }
     */
    constructor(level, profile, opts = {}) {
      this.level = level;
      this.mapIdx = level.mapIdx;
      this.layoutIdx = level.layoutIdx;
      this.map = RG.MAPS[level.mapIdx];
      this.profile = profile;
      this.opts = opts;
      this.rand = U.rng(opts.seed != null ? opts.seed : (Date.now() & 0xffffff));
      this.onEvent = null;

      const terr = RG.Terrain.build(level.mapIdx, level.layoutIdx);
      this.terrain = terr;
      this.grid = terr.grid;
      this.paths = terr.paths.map(p => new PathTrack(p));
      this.airPath = new PathTrack(terr.air);
      this.castle = terr.castle;
      this.towerAt = new Array(C.COLS * C.ROWS).fill(null);

      this.g = level.g;
      this.hpMult = C.hpMult(this.g);
      this.goldMult = C.goldMult(this.g);
      this.atkScale = Math.sqrt(this.hpMult);
      const k = profile.kingdom || {};
      this.gold = level.startGold + 25 * (k.treasury || 0);
      this.maxLives = C.START_LIVES + 2 * (k.walls || 0);
      this.lives = this.maxLives;
      this.bountyMult = 1 + 0.25 * (k.bounty || 0);
      const sl = k.smite || 0;
      this.smite = {
        cd: 8, maxCd: C.SMITE.cooldown - 6 * sl, radius: C.SMITE.radius,
        damage: C.SMITE.damage * (1 + 0.4 * sl) * Math.pow(this.hpMult, 0.85), stun: C.SMITE.stun,
      };

      this.nWaves = level.waves.length;
      this.waveIdx = -1;
      this.spawnQueue = [];
      this.spawning = false;
      this.waveTime = 0;
      this.waveAlive = new Array(this.nWaves).fill(0);
      this.waveSpawnDone = new Array(this.nWaves).fill(false);
      this.waveBonusGiven = new Array(this.nWaves).fill(false);

      this.enemies = [];
      this.towers = [];
      this.projectiles = [];
      this.summons = [];
      this.fx = [];
      this.time = 0;
      this.result = 'playing';
      this.boss = null;
      this.souls = 0;
      this.seen = new Set();
      this.nextId = 1;
      this.shake = 0;
      this.stats = { kills: 0, goldEarned: 0, leaked: 0, towersBuilt: 0 };
    }

    emit(type, data) { if (this.onEvent) this.onEvent(type, data); }
    heroLevel(type) { const h = this.profile.heroes[type]; return h ? h.level : 1; }
    isUnlocked(type) { const h = this.profile.heroes[type]; return !!(h && h.unlocked); }

    /* ---------- Grid & placement ---------- */
    cellAt(x, y) { return { c: Math.floor(x / T), r: Math.floor(y / T) }; }
    inBounds(c, r) { return c >= 0 && r >= 0 && c < C.COLS && r < C.ROWS; }
    canPlace(c, r) {
      if (!this.inBounds(c, r)) return false;
      const i = r * C.COLS + c;
      return this.grid[i] === 0 && !this.towerAt[i];
    }
    towerAtCell(c, r) { return this.inBounds(c, r) ? this.towerAt[r * C.COLS + c] : null; }

    placeTower(type, c, r) {
      const def = RG.TOWERS[type];
      if (!def) return { ok: false, reason: 'Unknown tower' };
      if (this.result !== 'playing') return { ok: false, reason: 'Battle over' };
      if (!this.isUnlocked(type)) return { ok: false, reason: def.name + ' is locked' };
      if (!this.canPlace(c, r)) return { ok: false, reason: 'Can\'t build there' };
      if (this.gold < def.cost) return { ok: false, reason: 'Not enough gold' };
      this.gold -= def.cost;
      const t = {
        id: this.nextId++, type, def, c, r, x: (c + 0.5) * T, y: (r + 0.5) * T,
        tier: 1, invested: def.cost, cd: 0.4, stunned: 0, stunFx: null, targeting: 'first',
        angle: 0, anim: 0, kills: 0, dmgDealt: 0, attackCount: 0,
        summonTimer: 0.5, champTimer: 6, rally: null, built: this.time,
      };
      this.recalcTower(t);
      this.towers.push(t);
      this.towerAt[r * C.COLS + c] = t;
      this.stats.towersBuilt++;
      this.burst(t.x, t.y + 10, '#d8c9a6', 14, 90, 'smoke');
      this.addFx({ kind: 'ring', x: t.x, y: t.y + 8, r0: 6, r1: 34, life: 0.4, max: 0.4, color: '#f1d27a', w: 3 });
      this.emit('sfx', 'place');
      return { ok: true, tower: t };
    }

    recalcTower(t) {
      t.stats = RG.computeTowerStats(t.type, t.tier, this.heroLevel(t.type));
      if (t.type === 'necro') t.rally = this.findRally(t);
    }

    upgradeCost(t) { return t.tier >= RG.MAX_TIER ? null : t.def.upgradeCosts[t.tier - 1]; }

    upgradeTower(t) {
      if (this.result !== 'playing' || !this.towers.includes(t)) return { ok: false, reason: 'No tower' };
      const cost = this.upgradeCost(t);
      if (cost === null) return { ok: false, reason: 'Already at max tier' };
      if (this.gold < cost) return { ok: false, reason: 'Not enough gold' };
      this.gold -= cost;
      t.tier++;
      t.invested += cost;
      this.recalcTower(t);
      this.burst(t.x, t.y - 10, '#ffe08a', 18, 120, 'spark');
      this.addFx({ kind: 'ring', x: t.x, y: t.y + 8, r0: 10, r1: 44, life: 0.5, max: 0.5, color: '#ffe08a', w: 3 });
      this.emit('sfx', 'upgrade');
      return { ok: true };
    }

    sellValue(t) { return Math.floor(t.invested * C.SELL_RATIO); }

    sellTower(t) {
      if (this.result !== 'playing') return { ok: false };
      const idx = this.towers.indexOf(t);
      if (idx < 0) return { ok: false };
      const refund = this.sellValue(t);
      this.gold += refund;
      this.towers.splice(idx, 1);
      this.towerAt[t.r * C.COLS + t.c] = null;
      for (const s of this.summons) if (s.tower === t) s.hp = 0;
      this.burst(t.x, t.y, '#bfae8a', 16, 100, 'smoke');
      this.addFx({ kind: 'text', x: t.x, y: t.y - 20, text: '+' + refund, color: '#ffd76a', life: 1, max: 1, vy: -30 });
      this.emit('sfx', 'sell');
      return { ok: true, refund };
    }

    setTargeting(t, mode) { if (['first', 'last', 'strong', 'close'].includes(mode)) t.targeting = mode; }

    findRally(t) {
      let best = null;
      this.paths.forEach((p, pi) => {
        const n = p.nearest(t.x, t.y);
        if (n.dist <= t.stats.range && (!best || n.dist < best.dist)) best = { path: p, pathIdx: pi, d: n.d, x: n.x, y: n.y, dist: n.dist };
      });
      return best;
    }

    /* ---------- Waves ---------- */
    canStartWave() { return this.result === 'playing' && !this.spawning && this.waveIdx < this.nWaves - 1; }

    startNextWave() {
      if (!this.canStartWave()) return false;
      let bonus = 0;
      if (this.waveIdx >= 0 && this.enemies.length > 0) {
        bonus = Math.round((C.EARLY_CALL_BONUS + 2 * (this.waveIdx + 1)) * this.goldMult);
        this.gold += bonus;
        this.stats.goldEarned += bonus;
      }
      this.waveIdx++;
      const w = this.level.waves[this.waveIdx];
      const q = [];
      for (const gr of w.groups) {
        for (let i = 0; i < gr.count; i++) q.push({ t: gr.delay + i * gr.interval, type: gr.type, elite: gr.elite, pathIdx: gr.path, wave: this.waveIdx });
      }
      q.sort((a, b) => a.t - b.t);
      this.spawnQueue = q;
      this.spawning = q.length > 0;
      this.waveTime = 0;
      if (!this.spawning) this.waveSpawnDone[this.waveIdx] = true;
      this.emit('wave', { index: this.waveIdx, bonus });
      this.emit('sfx', 'wave');
      return true;
    }

    earlyBonus() {
      if (this.waveIdx < 0 || this.enemies.length === 0) return 0;
      return Math.round((C.EARLY_CALL_BONUS + 2 * (this.waveIdx + 1)) * this.goldMult);
    }

    checkWaveBonus(w) {
      if (w < 0 || this.waveBonusGiven[w] || !this.waveSpawnDone[w] || this.waveAlive[w] > 0) return;
      this.waveBonusGiven[w] = true;
      if (this.result !== 'playing') return;
      const bonus = Math.round((C.WAVE_BONUS_BASE + C.WAVE_BONUS_PER_WAVE * w) * this.goldMult * this.bountyMult);
      this.gold += bonus;
      this.stats.goldEarned += bonus;
      this.emit('waveClear', { wave: w, bonus });
    }

    /* ---------- Enemies ---------- */
    spawnEnemy(spec) {
      const def = RG.ENEMIES[spec.type];
      const elite = !!spec.elite;
      const flying = !!def.flying;
      let path, d = spec.d || 0, pathIdx = spec.pathIdx || 0;
      if (flying) path = this.airPath;
      else {
        path = this.paths[pathIdx % this.paths.length];
        if (spec.fromX != null) { // child of a flyer: drop onto nearest road
          const n = path.nearest(spec.fromX, spec.fromY);
          d = n.d;
        }
      }
      const hp = def.hp * this.hpMult * (elite ? C.ELITE.hp : 1);
      const e = {
        uid: this.nextId++, type: spec.type, def, hp, maxHp: hp, path, pathIdx, d,
        x: 0, y: 0, speed: def.speed * (0.95 + this.rand() * 0.1) * (elite ? 1.05 : 1), curSpeed: 0,
        armor: def.armor || 0, mr: def.mr || 0,
        gold: Math.round(def.gold * this.goldMult * (elite ? C.ELITE.gold : 1)),
        lives: def.lives, size: def.size * (elite ? C.ELITE.size : 1), elite, flying,
        heavy: !!(def.heavy || def.boss), boss: !!def.boss, wave: spec.wave,
        slowPct: 0, slowT: 0, stunT: 0, pending: 0, curse: null, weaken: 0, shield: 0, blockedBy: null,
        buffT: 0, buffMult: 1, enraged: false, hitFlash: 0, dead: false, leaked: false,
        offset: flying ? 0 : (this.rand() - 0.5) * 14, anim: this.rand() * 10, facing: 1,
        ab: (def.abilities || []).map(a => (a.every ? a.every * (0.5 + this.rand() * 0.5) : 0)),
      };
      this.positionEnemy(e);
      this.enemies.push(e);
      if (spec.wave >= 0) this.waveAlive[spec.wave]++;
      if (!this.seen.has(spec.type)) { this.seen.add(spec.type); this.emit('newEnemy', spec.type); }
      if (e.boss) { this.boss = e; this.shake = 0.6; this.emit('boss', e); this.emit('sfx', 'boss'); }
      return e;
    }

    positionEnemy(e) {
      e.path.at(e.d, tmp);
      const nx = -Math.sin(tmp.a), ny = Math.cos(tmp.a);
      e.x = tmp.x + nx * e.offset;
      e.y = tmp.y + ny * e.offset;
      const cx = Math.cos(tmp.a);
      if (Math.abs(cx) > 0.2) e.facing = cx > 0 ? 1 : -1;
    }

    damage(e, amount, type, src, opts) {
      if (e.dead || amount <= 0) return 0;
      let m = 1;
      if (type === 'phys') m = 1 - e.armor * (1 - ((opts && opts.ap) || 0));
      else if (type === 'magic') m = 1 - e.mr;
      if (e.weaken > 0) m *= 1 + e.weaken;
      let dmg = amount * m;
      if (e.shield > 0) { const a = Math.min(e.shield, dmg); e.shield -= a; dmg -= a; }
      e.hp -= dmg;
      e.hitFlash = 0.08;
      if (src) src.dmgDealt += dmg;
      if (opts && opts.crit && this.opts.damageNumbers !== false) {
        this.addFx({ kind: 'text', x: e.x, y: e.y - e.size - 8, text: Math.round(dmg) + '!', color: '#ffdf5a', life: 0.7, max: 0.7, vy: -40, big: true });
      }
      if (e.hp <= 0) this.kill(e, src);
      return dmg;
    }

    kill(e, src) {
      if (e.dead) return;
      e.dead = true;
      this.gold += e.gold;
      this.stats.goldEarned += e.gold;
      this.stats.kills++;
      if (src) src.kills++;
      const col = e.boss ? '#ffb347' : e.def.flying ? '#a58bd6' : e.type.startsWith('skeleton') ? '#e8e2d0' : e.type === 'iceWraith' ? '#bfe6ff' : '#9a2f2f';
      this.burst(e.x, e.y - e.size * 0.5, col, e.boss ? 60 : e.elite ? 18 : 9, e.boss ? 220 : 110, 'spark');
      this.burst(e.x, e.y, 'rgba(60,50,40,0.6)', e.boss ? 20 : 4, 50, 'smoke');
      if (this.opts.damageNumbers !== false) this.addFx({ kind: 'text', x: e.x, y: e.y - e.size - 4, text: '+' + e.gold, color: '#ffd76a', life: 0.8, max: 0.8, vy: -28 });
      if (e.blockedBy) e.blockedBy = null;
      this.emit('sfx', e.boss ? 'bossDeath' : 'death');
      if (e.boss) {
        this.shake = 1.0;
        this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 10, r1: 220, life: 1.2, max: 1.2, color: '#ffcf6a', w: 6 });
        this.addFx({ kind: 'flash', x: e.x, y: e.y, r: 260, life: 0.6, max: 0.6, color: '255,220,140' });
        if (this.boss === e) this.boss = null;
        this.emit('toast', { text: e.def.name + ' has fallen!', kind: 'gold' });
      }
      // Death effects that create new enemies run BEFORE the wave counter drops,
      // so a wave never counts as cleared while its spawn is still pending.
      for (const a of e.def.abilities || []) {
        if (a.type === 'spawnOnDeath') {
          for (let i = 0; i < a.count; i++) this.spawnEnemy({ type: a.unit, wave: e.wave, pathIdx: e.pathIdx, d: Math.max(0, e.d - i * 8), fromX: e.flying ? e.x : null, fromY: e.y });
        }
      }
      const cu = e.curse;
      if (cu) {
        if (cu.harvest) {
          this.gold += cu.harvest.gold;
          this.stats.goldEarned += cu.harvest.gold;
          this.souls++;
          if (this.souls >= cu.harvest.soulsPerLife) {
            this.souls = 0;
            if (this.lives < this.maxLives) {
              this.lives++;
              this.addFx({ kind: 'text', x: this.castle.x, y: this.castle.y - 40, text: '+1 life', color: '#9effa8', life: 1.4, max: 1.4, vy: -24, big: true });
            }
          }
          this.addFx({ kind: 'soul', x: e.x, y: e.y - 6, tx: cu.tower ? cu.tower.x : e.x, ty: cu.tower ? cu.tower.y - 30 : e.y - 60, life: 0.7, max: 0.7 });
        }
        if (cu.plague) {
          let n = 0;
          const r2 = cu.plague.radius * cu.plague.radius;
          for (const o of this.enemies) {
            if (n >= cu.plague.count) break;
            if (o.dead || o === e || o.curse) continue;
            if (U.dist2(o.x, o.y, e.x, e.y) > r2) continue;
            o.curse = { ...cu, t: cu.dur, stacks: 1 };
            o.weaken = cu.weaken || 0;
            this.addFx({ kind: 'bolt', pts: [{ x: e.x, y: e.y }, { x: o.x, y: o.y }], life: 0.3, max: 0.3, color: '#9effa8', w: 2 });
            n++;
          }
        }
      }
      if (e.wave >= 0) { this.waveAlive[e.wave]--; this.checkWaveBonus(e.wave); }
    }

    leak(e) {
      e.dead = true;
      e.leaked = true;
      this.lives = Math.max(0, this.lives - e.lives);
      this.stats.leaked++;
      this.shake = Math.max(this.shake, e.boss ? 0.8 : 0.25);
      this.addFx({ kind: 'flash', x: this.castle.x, y: this.castle.y, r: 90, life: 0.4, max: 0.4, color: '255,60,60' });
      this.addFx({ kind: 'text', x: this.castle.x, y: this.castle.y - 46, text: '-' + e.lives, color: '#ff6a5a', life: 1, max: 1, vy: -26, big: true });
      this.emit('sfx', 'leak');
      this.emit('lifeLost', e.lives);
      if (e.boss && this.boss === e) this.boss = null;
      if (e.wave >= 0) { this.waveAlive[e.wave]--; this.checkWaveBonus(e.wave); }
      if (this.lives <= 0) this.finish('defeat');
    }

    applySlow(e, pct, dur) {
      if (e.def.slowImmune) return;
      if (e.boss) pct *= 0.5;
      if (e.slowT <= 0 || pct >= e.slowPct) e.slowPct = pct;
      e.slowT = Math.max(e.slowT, dur);
    }

    applyCurse(e, s, tower) {
      const cs = s.curse;
      if (!e.curse) e.curse = { ...cs, t: cs.dur, stacks: 1, tower };
      else {
        e.curse.stacks = Math.min(cs.maxStacks, e.curse.stacks + 1);
        e.curse.t = cs.dur;
        e.curse.dps = Math.max(e.curse.dps, cs.dps);
        e.curse.maxStacks = Math.max(e.curse.maxStacks, cs.maxStacks);
        if (cs.harvest) e.curse.harvest = cs.harvest;
        if (cs.plague) e.curse.plague = cs.plague;
        if ((cs.weaken || 0) > (e.curse.weaken || 0)) e.curse.weaken = cs.weaken;
        e.curse.tower = tower;
      }
      e.weaken = e.curse.weaken || 0;
    }

    updateEnemies(dt) {
      for (const e of this.enemies) {
        if (e.dead) continue;
        e.anim += dt;
        if (e.hitFlash > 0) e.hitFlash -= dt;
        // Curse damage-over-time (true damage).
        if (e.curse) {
          const cu = e.curse;
          cu.t -= dt;
          this.damage(e, cu.dps * cu.stacks * dt, 'true', cu.tower, null);
          if (cu.t <= 0 && !e.dead) { e.curse = null; e.weaken = 0; }
          if (e.dead) continue;
        }
        const def = e.def;
        if (def.regen) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * def.regen * (e.curse ? 0.5 : 1) * dt);
        if (e.slowT > 0) e.slowT -= dt;
        if (e.stunT > 0) e.stunT -= dt;
        if (e.buffT > 0) e.buffT -= dt;
        if (def.abilities) this.runAbilities(e, dt);

        let spd = e.speed;
        if (e.slowT > 0) spd *= 1 - e.slowPct;
        if (e.buffT > 0) spd *= e.buffMult;
        if (e.enraged) spd *= e.enrageMult;
        if (e.stunT > 0) spd = 0;
        const b = e.blockedBy;
        if (b) {
          if (b.dead) e.blockedBy = null;
          else {
            if (e.boss) spd *= 0.5;
            else if (e.heavy && !b.champion) spd *= 0.5;
            else spd = 0;
            if (def.atk > 0 && e.stunT <= 0) b.hp -= def.atk * this.atkScale * (e.elite ? C.ELITE.atk : 1) * (1 - b.armor) * dt;
          }
        }
        e.curSpeed = spd;
        e.d += spd * dt;
        if (e.d >= e.path.length) { this.leak(e); if (this.result !== 'playing') return; continue; }
        this.positionEnemy(e);
      }
    }

    runAbilities(e, dt) {
      const abs = e.def.abilities;
      for (let i = 0; i < abs.length; i++) {
        const a = abs[i];
        if (a.type === 'enrage') {
          if (!e.enraged && e.hp / e.maxHp <= a.at) {
            e.enraged = true; e.enrageMult = a.mult;
            this.emit('toast', { text: e.def.name + ' is enraged!', kind: 'danger' });
            this.emit('sfx', 'boss');
            this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 20, r1: 160, life: 0.8, max: 0.8, color: '#ff5a2a', w: 5 });
          }
          continue;
        }
        if (!a.every) continue;
        e.ab[i] -= dt;
        if (e.ab[i] > 0) continue;
        e.ab[i] = a.every;
        if (e.stunT > 0) continue;
        switch (a.type) {
          case 'heal': {
            const r2 = a.radius * a.radius;
            let healed = false;
            for (const o of this.enemies) {
              if (o.dead || U.dist2(o.x, o.y, e.x, e.y) > r2 || o.hp >= o.maxHp) continue;
              o.hp = Math.min(o.maxHp, o.hp + o.maxHp * a.pct);
              this.addFx({ kind: 'spark', x: o.x, y: o.y - o.size, vx: 0, vy: -40, life: 0.6, max: 0.6, size: 3, color: '#8dff8a' });
              healed = true;
            }
            if (healed) this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 6, r1: a.radius, life: 0.5, max: 0.5, color: '#8dff8a', w: 2 });
            break;
          }
          case 'shield': {
            const r2 = a.radius * a.radius;
            for (const o of this.enemies) {
              if (o.dead || U.dist2(o.x, o.y, e.x, e.y) > r2) continue;
              o.shield = Math.max(o.shield, o.maxHp * a.pct);
            }
            this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 6, r1: a.radius, life: 0.5, max: 0.5, color: '#7fd3ff', w: 2 });
            break;
          }
          case 'warcry': {
            const r2 = a.radius * a.radius;
            for (const o of this.enemies) {
              if (o.dead || U.dist2(o.x, o.y, e.x, e.y) > r2) continue;
              o.buffT = a.dur; o.buffMult = a.mult;
            }
            this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 10, r1: a.radius, life: 0.6, max: 0.6, color: '#ff4a3a', w: 4 });
            this.emit('sfx', 'warcry');
            break;
          }
          case 'summon': {
            for (let k = 0; k < a.count; k++) {
              this.spawnEnemy({ type: a.unit, wave: e.wave, pathIdx: e.pathIdx, d: Math.max(0, e.d - 14 - k * 10), fromX: e.flying ? e.x : null, fromY: e.y });
            }
            this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 8, r1: 60, life: 0.5, max: 0.5, color: '#c9a2ff', w: 3 });
            break;
          }
          case 'stunTowers': {
            const r2 = a.radius * a.radius;
            const inRange = this.towers.filter(t => U.dist2(t.x, t.y, e.x, e.y) <= r2);
            for (let k = 0; k < a.count && inRange.length; k++) {
              const t = inRange.splice(Math.floor(this.rand() * inRange.length), 1)[0];
              t.stunned = Math.max(t.stunned, a.dur);
              t.stunFx = a.fx;
              const color = a.fx === 'ice' ? '#bfe9ff' : a.fx === 'rock' ? '#a08a6a' : '#ff8a2a';
              this.addFx({ kind: 'bolt', pts: [{ x: e.x, y: e.y - e.size }, { x: t.x, y: t.y - 14 }], life: 0.45, max: 0.45, color, w: a.fx === 'fire' ? 7 : 4, glow: true });
              this.burst(t.x, t.y - 10, color, 14, 90, 'spark');
            }
            if (a.fx === 'ice') this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 10, r1: a.radius, life: 0.7, max: 0.7, color: '#bfe9ff', w: 5 });
            this.emit('sfx', a.fx === 'fire' ? 'fire' : 'stun');
            break;
          }
          case 'boneBolt': {
            let best = null, bd = a.range * a.range;
            for (const s of this.summons) {
              if (s.dead) continue;
              const d2 = U.dist2(s.x, s.y, e.x, e.y);
              if (d2 < bd) { bd = d2; best = s; }
            }
            if (best) this.projectiles.push({ kind: 'enemyBolt', x: e.x, y: e.y - e.size, target: best, speed: 260, dmg: a.dmg * this.atkScale, life: 3 });
            else e.ab[i] = 0.3;
            break;
          }
        }
      }
    }

    /* ---------- Towers ---------- */
    /**
     * Picks a target by the tower's targeting mode. Enemies that already have
     * enough damage in flight to die are skipped first (prevents overkill),
     * falling back to them only when nothing else is in range.
     */
    pickTarget(t, range, exclude) {
      return this.pickTargetPass(t, range, exclude, true) || this.pickTargetPass(t, range, exclude, false);
    }
    pickTargetPass(t, range, exclude, skipDoomed) {
      const r2 = range * range, air = t.stats.canHitAir, mode = t.targeting;
      let best = null, bv = Infinity;
      for (const e of this.enemies) {
        if (e.dead || (e.flying && !air) || (exclude && exclude.has(e))) continue;
        if (skipDoomed && e.pending >= e.hp) continue;
        const d2 = U.dist2(e.x, e.y, t.x, t.y);
        if (d2 > r2) continue;
        let v;
        switch (mode) {
          case 'last': v = -(e.path.length - e.d); break;
          case 'strong': v = -e.hp; break;
          case 'close': v = d2; break;
          default: v = e.path.length - e.d;
        }
        if (v < bv) { bv = v; best = e; }
      }
      return best;
    }

    updateTowers(dt) {
      for (const t of this.towers) {
        if (t.anim > 0) t.anim -= dt;
        if (t.stunned > 0) { t.stunned -= dt; continue; }
        if (t.type === 'necro') this.updateNecro(t, dt);
        t.cd -= dt;
        if (t.cd > 0) continue;
        const tgt = this.pickTarget(t, t.stats.range);
        if (!tgt) { t.cd = 0; continue; }
        t.cd = 1 / t.stats.rate;
        t.anim = 0.18;
        t.angle = Math.atan2(tgt.y - t.y, tgt.x - t.x);
        this.fire(t, tgt);
      }
    }

    fire(t, tgt) {
      const s = t.stats;
      const ox = t.x, oy = t.y - 26;
      switch (t.type) {
        case 'archer': {
          const targets = [tgt];
          if (s.multishot) {
            const ex = new Set(targets);
            for (let k = 0; k < s.multishot; k++) { const o = this.pickTarget(t, s.range, ex); if (!o) break; targets.push(o); ex.add(o); }
          }
          for (const e of targets) {
            const crit = s.critChance && this.rand() < s.critChance;
            const dmg = s.damage * (crit ? s.critMult : 1);
            if (s.pierce) {
              const a = Math.atan2(e.y - oy, e.x - ox);
              this.projectiles.push({ kind: 'arrow', pierce: true, x: ox, y: oy, vx: Math.cos(a) * 640, vy: Math.sin(a) * 640, a, dmg, crit, tower: t, hits: new Set(), left: s.pierce + 1, travel: 0, maxTravel: s.range + 60 });
            } else {
              this.projectiles.push({ kind: 'arrow', x: ox, y: oy, target: e, speed: 600, dmg, crit, tower: t, a: 0, pend: this.expectDmg(e, dmg, 'phys', 0) });
              e.pending += this.expectDmg(e, dmg, 'phys', 0);
            }
          }
          this.emit('sfx', 'bow');
          break;
        }
        case 'mage':
          t.attackCount++;
          this.projectiles.push({ kind: 'orb', x: ox, y: oy - 6, target: tgt, speed: 380, dmg: s.damage, tower: t, nova: s.nova && t.attackCount % s.nova.every === 0, pend: this.expectDmg(tgt, s.damage, 'magic', 0) });
          tgt.pending += this.expectDmg(tgt, s.damage, 'magic', 0);
          this.emit('sfx', 'magic');
          break;
        case 'cannon': {
          const dur = 0.35 + Math.hypot(tgt.x - t.x, tgt.y - t.y) / 600;
          let tx = tgt.x, ty = tgt.y;
          if (!tgt.flying) {
            tgt.path.at(tgt.d + tgt.curSpeed * dur, tmp);
            tx = tmp.x; ty = tmp.y;
          }
          this.projectiles.push({ kind: 'bomb', sx: ox, sy: oy + 6, tx, ty, x: ox, y: oy, z: 0, t: 0, dur, dmg: s.damage, radius: s.splash, tower: t, main: true });
          this.burst(ox + Math.cos(t.angle) * 16, oy + 6 + Math.sin(t.angle) * 10, 'rgba(200,200,200,0.7)', 5, 60, 'smoke');
          this.emit('sfx', 'cannon');
          break;
        }
        case 'lich':
          this.projectiles.push({ kind: 'shadow', x: ox, y: oy - 4, target: tgt, speed: 300, dmg: s.damage, tower: t, pend: this.expectDmg(tgt, s.damage, 'magic', 0) });
          tgt.pending += this.expectDmg(tgt, s.damage, 'magic', 0);
          this.emit('sfx', 'curse');
          break;
        case 'necro':
          this.projectiles.push({ kind: 'bone', x: ox, y: oy, target: tgt, speed: 360, dmg: s.damage, tower: t, spin: 0, pend: this.expectDmg(tgt, s.damage, 'magic', 0) });
          tgt.pending += this.expectDmg(tgt, s.damage, 'magic', 0);
          this.emit('sfx', 'bone');
          break;
      }
    }

    /** Damage an enemy would take right now (used for overkill prediction). */
    expectDmg(e, amount, type, ap) {
      let m = type === 'phys' ? 1 - e.armor * (1 - ap) : type === 'magic' ? 1 - e.mr : 1;
      if (e.weaken > 0) m *= 1 + e.weaken;
      return amount * m;
    }

    explode(x, y, dmg, radius, s, tower, main) {
      for (const e of this.enemies) {
        if (e.dead || e.flying) continue;
        const r = radius + e.size * 0.5;
        const d2 = U.dist2(e.x, e.y, x, y);
        if (d2 > r * r) continue;
        const fall = 1 - 0.4 * Math.sqrt(d2) / r;
        this.damage(e, dmg * fall, 'phys', tower, { ap: s.armorPierce });
        if (main && s.stun && !e.dead) e.stunT = Math.max(e.stunT, e.boss ? s.stun * 0.3 : s.stun);
      }
      this.addFx({ kind: 'flash', x, y, r: radius * 1.3, life: 0.18, max: 0.18, color: '255,190,90' });
      this.addFx({ kind: 'ring', x, y, r0: 4, r1: radius, life: 0.3, max: 0.3, color: '#ffb35a', w: main ? 4 : 2 });
      this.burst(x, y, '#ff9a3a', main ? 12 : 5, 140, 'spark');
      this.burst(x, y, 'rgba(70,60,55,0.7)', main ? 7 : 3, 50, 'smoke');
      if (main) {
        this.addFx({ kind: 'scorch', x, y, r: radius * 0.6, life: 3, max: 3 });
        this.emit('sfx', 'boom');
        if (s.cluster) {
          for (let k = 0; k < s.cluster.count; k++) {
            const a = this.rand() * Math.PI * 2, d = 25 + this.rand() * 25;
            this.projectiles.push({ kind: 'bomb', small: true, sx: x, sy: y, tx: x + Math.cos(a) * d, ty: y + Math.sin(a) * d, x, y, z: 0, t: 0, dur: 0.3 + k * 0.06, dmg: s.damage * s.cluster.mult, radius: s.cluster.radius, tower, main: false });
          }
        }
      }
    }

    onOrbHit(p, e) {
      const t = p.tower, s = t.stats;
      this.damage(e, p.dmg, 'magic', t);
      if (s.slow) this.applySlow(e, s.slow.pct, s.slow.dur);
      this.burst(e.x, e.y - e.size * 0.6, '#9fd9ff', 6, 80, 'spark');
      if (s.chain) {
        const hit = new Set([e]);
        const pts = [{ x: e.x, y: e.y - e.size * 0.6 }];
        let cur = e, dmg = p.dmg;
        const r2 = s.chainRange * s.chainRange;
        for (let k = 0; k < s.chain; k++) {
          let next = null, bd = r2;
          for (const o of this.enemies) {
            if (o.dead || hit.has(o)) continue;
            const d2 = U.dist2(o.x, o.y, cur.x, cur.y);
            if (d2 < bd) { bd = d2; next = o; }
          }
          if (!next) break;
          dmg *= s.chainFalloff;
          hit.add(next);
          pts.push({ x: next.x, y: next.y - next.size * 0.6 });
          this.damage(next, dmg, 'magic', t);
          if (s.slow) this.applySlow(next, s.slow.pct, s.slow.dur);
          cur = next;
        }
        if (pts.length > 1) { this.addFx({ kind: 'bolt', pts, life: 0.22, max: 0.22, color: '#bfe8ff', w: 2.5, jag: true, glow: true }); this.emit('sfx', 'zap'); }
      }
      if (p.nova) {
        const r2 = s.nova.radius * s.nova.radius;
        for (const o of this.enemies) if (!o.dead && U.dist2(o.x, o.y, e.x, e.y) <= r2) this.damage(o, s.damage * s.nova.mult, 'magic', t);
        this.addFx({ kind: 'ring', x: e.x, y: e.y, r0: 8, r1: s.nova.radius, life: 0.4, max: 0.4, color: '#c58bff', w: 5 });
        this.addFx({ kind: 'flash', x: e.x, y: e.y, r: s.nova.radius, life: 0.25, max: 0.25, color: '190,140,255' });
        this.emit('sfx', 'nova');
      }
    }

    updateProjectiles(dt) {
      const list = this.projectiles;
      for (let i = list.length - 1; i >= 0; i--) {
        const p = list[i];
        let done = false;
        if (p.kind === 'bomb') {
          p.t += dt;
          const k = Math.min(1, p.t / p.dur);
          p.x = U.lerp(p.sx, p.tx, k);
          p.y = U.lerp(p.sy, p.ty, k);
          p.z = Math.sin(k * Math.PI) * (p.small ? 18 : 40 + p.dur * 30);
          if (k >= 1) { this.explode(p.tx, p.ty, p.dmg, p.radius, p.tower.stats, p.tower, p.main); done = true; }
        } else if (p.pierce) {
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.travel += 640 * dt;
          for (const e of this.enemies) {
            if (e.dead || p.hits.has(e)) continue;
            const r = e.size + 6;
            if (U.dist2(e.x, e.y - e.size * 0.5, p.x, p.y) > r * r) continue;
            p.hits.add(e);
            this.damage(e, p.dmg, 'phys', p.tower, { crit: p.crit });
            if (--p.left <= 0) { done = true; break; }
          }
          if (p.travel > p.maxTravel || p.x < -40 || p.y < -40 || p.x > C.WORLD_W + 40 || p.y > C.WORLD_H + 40) done = true;
        } else {
          // Homing projectile. If the target dies it flies to the last spot and fizzles.
          const tg = p.target;
          const alive = p.kind === 'enemyBolt' ? tg && !tg.dead && tg.hp > 0 : tg && !tg.dead;
          if (alive) { p.tx = tg.x; p.ty = tg.y - (tg.size || 10) * 0.6; }
          else if (p.tx === undefined) { if (p.pend) tg.pending = Math.max(0, tg.pending - p.pend); list[i] = list[list.length - 1]; list.pop(); continue; }
          const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
          const step = p.speed * dt;
          p.a = Math.atan2(dy, dx);
          if (dist <= step + 4) {
            if (alive) this.projectileHit(p, tg);
            done = true;
          } else { p.x += dx / dist * step; p.y += dy / dist * step; }
          if (p.spin != null) p.spin += dt * 18;
          if (p.kind === 'orb' && this.rand() < 0.5) this.addFx({ kind: 'spark', x: p.x, y: p.y, vx: 0, vy: 0, life: 0.25, max: 0.25, size: 3, color: '#9fd9ff' });
          if (p.kind === 'shadow' && this.rand() < 0.5) this.addFx({ kind: 'spark', x: p.x, y: p.y, vx: 0, vy: -10, life: 0.35, max: 0.35, size: 3, color: '#a77bff' });
        }
        if (done) {
          if (p.pend && p.target) p.target.pending = Math.max(0, p.target.pending - p.pend);
          list[i] = list[list.length - 1]; list.pop();
        }
      }
    }

    projectileHit(p, e) {
      switch (p.kind) {
        case 'arrow': this.damage(e, p.dmg, 'phys', p.tower, { crit: p.crit }); break;
        case 'orb': this.onOrbHit(p, e); break;
        case 'shadow':
          this.damage(e, p.dmg, 'magic', p.tower);
          if (!e.dead) this.applyCurse(e, p.tower.stats, p.tower);
          this.burst(e.x, e.y - e.size * 0.5, '#9a6ad8', 6, 60, 'spark');
          break;
        case 'bone': this.damage(e, p.dmg, 'magic', p.tower); break;
        case 'enemyBolt':
          e.hp -= p.dmg * (1 - e.armor);
          this.burst(e.x, e.y - 8, '#c58bff', 5, 60, 'spark');
          break;
      }
    }

    /* ---------- Necromancer summons ---------- */
    updateNecro(t, dt) {
      const sm = t.stats.summon;
      if (!t.rally) return;
      t.summonTimer -= dt;
      if (t.summonTimer <= 0) {
        let count = 0;
        for (const s of this.summons) if (s.tower === t && !s.champion && !s.dead) count++;
        if (count < sm.max) { this.spawnSummon(t, false); t.summonTimer = sm.interval; }
        else t.summonTimer = 0;
      }
      if (sm.champion) {
        t.champTimer -= dt;
        if (t.champTimer <= 0) {
          const alive = this.summons.some(s => s.tower === t && s.champion && !s.dead);
          if (!alive) { this.spawnSummon(t, true); t.champTimer = sm.champion.every; } else t.champTimer = 1;
        }
      }
    }

    spawnSummon(t, champion) {
      const sm = t.stats.summon, rally = t.rally;
      const used = new Set(this.summons.filter(s => s.tower === t && !s.dead).map(s => s.slot));
      let slot = 0;
      while (used.has(slot)) slot++;
      const spread = champion ? 0 : (slot - (sm.max - 1) / 2) * 22;
      rally.path.at(U.clamp(rally.d + spread, 0, rally.path.length - 30), tmp);
      const hpm = champion ? sm.champion.hpMult : 1;
      const s = {
        id: this.nextId++, tower: t, x: t.x, y: t.y + 4, homeX: tmp.x, homeY: tmp.y,
        hp: sm.hp * hpm, maxHp: sm.hp * hpm, dmg: sm.dmg * (champion ? sm.champion.dmgMult : 1),
        atkRate: sm.atkRate * (champion ? 0.8 : 1), cd: 0.3, life: champion ? sm.champion.life : sm.life,
        armor: sm.armor, champion, slot: champion ? -1 : slot, target: null, dead: false,
        anim: this.rand() * 5, facing: 1, rise: 0.4, size: champion ? 15 : 11,
      };
      this.summons.push(s);
      this.burst(s.x, s.y, champion ? '#7dffc8' : '#4fc6a0', champion ? 24 : 10, 70, 'spark');
      this.addFx({ kind: 'ring', x: t.x, y: t.y + 8, r0: 4, r1: champion ? 40 : 24, life: 0.4, max: 0.4, color: '#4fc6a0', w: 2 });
      this.emit('sfx', 'summon');
      if (champion) this.emit('toast', { text: 'A Skeleton Champion rises!', kind: 'necro' });
    }

    updateSummons(dt) {
      const list = this.summons;
      for (let i = list.length - 1; i >= 0; i--) {
        const s = list[i];
        s.anim += dt;
        if (s.rise > 0) s.rise -= dt;
        s.life -= dt;
        if (s.life <= 0 || s.hp <= 0) {
          s.dead = true;
          if (s.target && s.target.blockedBy === s) s.target.blockedBy = null;
          this.burst(s.x, s.y - 8, '#e8e2d0', 8, 70, 'spark');
          list[i] = list[list.length - 1]; list.pop();
          continue;
        }
        let tg = s.target;
        if (tg && (tg.dead || tg.flying || U.dist2(tg.x, tg.y, s.homeX, s.homeY) > 80 * 80)) {
          if (tg.blockedBy === s) tg.blockedBy = null;
          tg = s.target = null;
        }
        if (!tg) {
          // Prefer an enemy nobody is holding; otherwise help a sibling.
          let best = null, bd = 64 * 64, bestFree = false;
          for (const e of this.enemies) {
            if (e.dead || e.flying) continue;
            const d2 = U.dist2(e.x, e.y, s.homeX, s.homeY);
            if (d2 > 64 * 64) continue;
            const free = !e.blockedBy;
            if ((free && !bestFree) || (free === bestFree && d2 < bd)) { best = e; bd = d2; bestFree = free; }
          }
          tg = s.target = best;
        }
        const gx = tg ? tg.x - tg.facing * (tg.size + 6) : s.homeX;
        const gy = tg ? tg.y + 1 : s.homeY;
        const dx = gx - s.x, dy = gy - s.y, dist = Math.hypot(dx, dy);
        const spd = 70 * dt;
        if (dist > 2 && s.rise <= 0) { const k = Math.min(1, spd / dist); s.x += dx * k; s.y += dy * k; if (Math.abs(dx) > 1) s.facing = dx > 0 ? 1 : -1; }
        if (tg) {
          const contact = U.dist2(tg.x, tg.y, s.x, s.y) <= (tg.size + 16) * (tg.size + 16);
          if (contact) {
            if (!tg.blockedBy) tg.blockedBy = s;
            s.facing = tg.x >= s.x ? 1 : -1;
            s.cd -= dt;
            if (s.cd <= 0) {
              s.cd = 1 / s.atkRate;
              s.swing = 0.2;
              this.damage(tg, s.dmg, 'phys', s.tower);
              if (s.champion) {
                for (const o of this.enemies) if (o !== tg && !o.dead && !o.flying && U.dist2(o.x, o.y, s.x, s.y) < 45 * 45) this.damage(o, s.dmg * 0.5, 'phys', s.tower);
                this.addFx({ kind: 'ring', x: s.x, y: s.y, r0: 6, r1: 40, life: 0.25, max: 0.25, color: '#7dffc8', w: 2 });
              }
            }
          }
        }
        if (s.swing > 0) s.swing -= dt;
      }
    }

    /* ---------- Divine Smite (player ability) ---------- */
    castSmite(x, y) {
      if (this.result !== 'playing' || this.smite.cd > 0) return false;
      const sm = this.smite, r2 = sm.radius * sm.radius;
      for (const e of this.enemies) {
        if (e.dead || U.dist2(e.x, e.y, x, y) > r2) continue;
        this.damage(e, sm.damage, 'true', null);
        if (!e.dead) e.stunT = Math.max(e.stunT, e.boss ? sm.stun * 0.3 : sm.stun);
      }
      sm.cd = sm.maxCd;
      this.shake = 0.35;
      this.addFx({ kind: 'beam', x, y, life: 0.6, max: 0.6 });
      this.addFx({ kind: 'ring', x, y, r0: 10, r1: sm.radius, life: 0.5, max: 0.5, color: '#fff2b0', w: 6 });
      this.addFx({ kind: 'flash', x, y, r: sm.radius * 1.4, life: 0.35, max: 0.35, color: '255,240,180' });
      this.burst(x, y, '#fff2b0', 30, 200, 'spark');
      this.emit('sfx', 'smite');
      return true;
    }

    /* ---------- Effects (visual only, but simulated here to keep render stateless) ---------- */
    addFx(f) { if (this.fx.length < C.MAX_FX) this.fx.push(f); }
    burst(x, y, color, n, speed, kind) {
      for (let i = 0; i < n; i++) {
        const a = this.rand() * Math.PI * 2, v = speed * (0.3 + this.rand() * 0.7);
        this.addFx({ kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (kind === 'smoke' ? 20 : 30), life: kind === 'smoke' ? 0.9 : 0.5, max: kind === 'smoke' ? 0.9 : 0.5, size: kind === 'smoke' ? 5 + this.rand() * 4 : 2 + this.rand() * 2, color });
      }
    }
    updateFx(dt) {
      const list = this.fx;
      for (let i = list.length - 1; i >= 0; i--) {
        const f = list[i];
        f.life -= dt;
        if (f.life <= 0) { list[i] = list[list.length - 1]; list.pop(); continue; }
        if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.kind === 'spark') f.vy += 160 * dt; else if (f.kind === 'smoke') { f.vx *= 0.96; f.vy *= 0.96; } }
        else if (f.vy) f.y += f.vy * dt;
      }
      if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 1.6);
    }

    /* ---------- Main step ---------- */
    update(dt) {
      if (this.result !== 'playing') { this.updateFx(dt); return; }
      this.time += dt;
      if (this.smite.cd > 0) this.smite.cd = Math.max(0, this.smite.cd - dt);

      if (this.spawning) {
        this.waveTime += dt;
        const q = this.spawnQueue;
        while (q.length && q[0].t <= this.waveTime) this.spawnEnemy(q.shift());
        if (!q.length) {
          this.spawning = false;
          this.waveSpawnDone[this.waveIdx] = true;
          this.checkWaveBonus(this.waveIdx);
        }
      }

      this.updateEnemies(dt);
      if (this.result !== 'playing') return;
      this.updateTowers(dt);
      this.updateSummons(dt);
      this.updateProjectiles(dt);
      this.updateFx(dt);

      // Compact dead enemies (swap-free filter keeps order stable for rendering).
      let w = 0;
      for (let i = 0; i < this.enemies.length; i++) { const e = this.enemies[i]; if (!e.dead) this.enemies[w++] = e; }
      this.enemies.length = w;

      if (this.waveIdx === this.nWaves - 1 && !this.spawning && this.enemies.length === 0) this.finish('victory');
    }

    finish(result) {
      if (this.result !== 'playing') return;
      this.result = result;
      this.emit('sfx', result === 'victory' ? 'victory' : 'defeat');
      this.emit('end', { result });
    }

    get aliveCount() { return this.enemies.length + this.spawnQueue.length; }
  }

  RG.Battle = Battle;
})();

  <script>/* js/render/sprites.js */
/* =====================================================================
 * Realm Guardians — render/sprites.js
 * All art is drawn procedurally with Canvas 2D paths: no image files,
 * no licensing issues, crisp at any resolution.
 * Sprites are drawn around (0,0) with the "feet" at y≈0 unless noted.
 * ===================================================================== */

RG.Sprites = (function () {
  const TAU = Math.PI * 2;

  function circle(ctx, x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
  function ellipse(ctx, x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
  function poly(ctx, pts, fill, stroke, lw) {
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }
  function rect(ctx, x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  function line(ctx, x1, y1, x2, y2, color, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
  function glow(ctx, x, y, r, rgb, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  /* ------------------------------------------------------------------ */
  /* Towers: drawn centred on the tile, base at y=+14                   */
  /* ------------------------------------------------------------------ */
  function stoneBase(ctx, tier, w) {
    ellipse(ctx, 0, 15, w + 3, 6, 'rgba(0,0,0,0.35)');
    const top = tier >= 3 ? '#9c937f' : '#8a8577';
    poly(ctx, [-w, 12, -w + 3, 6, w - 3, 6, w, 12, w - 2, 16, -w + 2, 16], top, '#3b372f', 1.5);
    if (tier >= 3) line(ctx, -w + 3, 7, w - 3, 7, '#e2b65c', 1.5);
  }

  function tierPips(ctx, tier, y) {
    for (let i = 0; i < tier; i++) {
      const x = (i - (tier - 1) / 2) * 6;
      poly(ctx, [x, y - 3, x + 2.5, y, x, y + 3, x - 2.5, y], i === 3 ? '#ffe9a0' : '#e2b65c', '#5a3f12', 0.8);
    }
  }

  function drawTower(ctx, type, tier, time, angle, anim, stunned, stunFx) {
    ctx.save();
    const recoil = anim > 0 ? anim / 0.18 : 0;

      case 'archer': {
        stoneBase(ctx, tier, 15);
        const h = 26 + tier * 3;
        // wooden tower body
        poly(ctx, [-10, 8, -8, 8 - h, 8, 8 - h, 10, 8], '#7a5230', '#3a2412', 1.5);
        for (let y = 4; y > 8 - h; y -= 6) line(ctx, -9, y, 9, y, 'rgba(40,20,8,0.5)', 1);
        // platform
        rect(ctx, -12, 4 - h, 24, 5, '#5e3d22');
        for (let i = -12; i < 12; i += 6) rect(ctx, i, 1 - h, 4, 3, '#5e3d22');
        // roof
        if (tier >= 2) poly(ctx, [-13, 4 - h - 10, 0, 4 - h - 24 - tier * 2, 13, 4 - h - 10], tier >= 4 ? '#2f7a3a' : '#3b8a45', '#1d4524', 1.5);
        if (tier >= 4) { line(ctx, 0, 4 - h - 24 - tier * 2, 0, 4 - h - 36 - tier * 2, '#6b4a2a', 1.5); poly(ctx, [0, 4 - h - 36 - tier * 2, 9, 4 - h - 33 - tier * 2, 0, 4 - h - 30 - tier * 2], '#e2b65c'); }
        // archer
        const ay = 1 - h;
        circle(ctx, 0, ay - 3, 3.6, '#e2c39a');
        poly(ctx, [-3.5, ay - 6, 0, ay - 10, 3.5, ay - 6], '#3f8a3e');
        ctx.save(); ctx.translate(0, ay - 2); ctx.rotate(angle);
        ctx.beginPath(); ctx.arc(-recoil * 2, 0, 7, -1.2, 1.2); ctx.strokeStyle = '#d9b16a'; ctx.lineWidth = 1.8; ctx.stroke();
        line(ctx, 2.5 - recoil * 2, -6.5, 2.5 - recoil * 2, 6.5, 'rgba(255,255,255,0.7)', 0.7);
        ctx.restore();
        tierPips(ctx, tier, 22);
        break;
      }
      case 'mage': {
        stoneBase(ctx, tier, 14);
        const h = 30 + tier * 4;
        poly(ctx, [-9, 8, -7, 8 - h, 7, 8 - h, 9, 8], '#cfd5e6', '#4f5770', 1.5);
        rect(ctx, -2.5, -4, 5, 9, '#2a3150');
        circle(ctx, 0, -10 - h * 0.3, 2.4, '#7fd0ff');
        poly(ctx, [-11, 8 - h, 0, 8 - h - 18 - tier * 3, 11, 8 - h], tier >= 3 ? '#4a3a9a' : '#3e4fa8', '#1d2252', 1.5);
        for (let i = 0; i < tier; i++) circle(ctx, -4 + i * 3, 8 - h - 6 - i * 3, 0.9, '#ffe9a0');
        const oy = 8 - h - 24 - tier * 3 + Math.sin(time * 3) * 2;
        glow(ctx, 0, oy, 14 + recoil * 8, '120,200,255', 0.55);
        circle(ctx, 0, oy, 4 + recoil * 1.5, '#bfe9ff');
        circle(ctx, 0, oy, 2, '#ffffff');
        if (tier >= 4) for (let i = 0; i < 3; i++) { const a = time * 2 + i * TAU / 3; circle(ctx, Math.cos(a) * 9, oy + Math.sin(a) * 4, 1.6, '#c9a2ff'); }
        tierPips(ctx, tier, 22);
        break;
      }
      case 'cannon': {
        stoneBase(ctx, tier, 16);
        const w = 13 + tier;
        poly(ctx, [-w, 10, -w + 2, -6, w - 2, -6, w, 10], '#7b7468', '#2f2b25', 1.5);
        for (let i = -w + 2; i < w - 2; i += 6) rect(ctx, i, -10, 4, 4, '#6c665b');
        if (tier >= 3) { rect(ctx, -w + 1, 0, w * 2 - 2, 3, '#c98a4a'); }
        // barrel
        ctx.save(); ctx.translate(0, -8); ctx.rotate(angle);
        const bl = 14 + tier * 2 - recoil * 4;
        rect(ctx, -2, -4.5 - tier * 0.4, bl, 9 + tier * 0.8, '#2b2a2e');
        rect(ctx, bl - 4, -5.5 - tier * 0.4, 4, 11 + tier * 0.8, '#45434a');
        if (tier >= 4) rect(ctx, 4, -5 - tier * 0.4, 2, 10 + tier * 0.8, '#e2b65c');
        ctx.restore();
        circle(ctx, 0, -8, 5, '#3a383d');
        if (recoil > 0.5) glow(ctx, Math.cos(angle) * 22, -8 + Math.sin(angle) * 22, 12, '255,180,80', recoil);
        tierPips(ctx, tier, 22);
        break;
      }
      case 'lich': {
        stoneBase(ctx, tier, 13);
        const h = 30 + tier * 4;
        poly(ctx, [-8, 8, -4, 8 - h, 4, 8 - h, 8, 8], '#2a2236', '#0f0b16', 1.5);
        line(ctx, -2, 2, 1, 2 - h * 0.6, 'rgba(158,255,168,0.5)', 1.2);
        // skull
        const sy = 8 - h - 6 + Math.sin(time * 2) * 1.5;
        glow(ctx, 0, sy, 18 + recoil * 6, '158,255,168', 0.35);
        circle(ctx, 0, sy, 6, '#ddd6c4');
        rect(ctx, -3.5, sy + 3, 7, 4, '#ddd6c4');
        circle(ctx, -2.2, sy - 0.5, 1.6, '#3cff7a'); circle(ctx, 2.2, sy - 0.5, 1.6, '#3cff7a');
        poly(ctx, [-7, sy - 4, -5, sy - 11, -2, sy - 6, 0, sy - 12, 2, sy - 6, 5, sy - 11, 7, sy - 4], '#7a5ac0');
        for (let i = 0; i < 2 + tier; i++) {
          const a = time * 1.6 + i * TAU / (2 + tier);
          const x = Math.cos(a) * 13, y = sy + 6 + Math.sin(a) * 5;
          poly(ctx, [x, y - 4, x + 2, y, x, y + 4, x - 2, y], '#9a6ad8');
        }
        tierPips(ctx, tier, 22);
        break;
      }
      case 'necro': {
        stoneBase(ctx, tier, 15);
        // mausoleum
        poly(ctx, [-12, 10, -12, -10, 12, -10, 12, 10], '#5d6a66', '#232a28', 1.5);
        poly(ctx, [-15, -10, 0, -22 - tier * 2, 15, -10], '#44504c', '#1a201e', 1.5);
        ctx.beginPath(); ctx.arc(0, 4, 6, Math.PI, 0); ctx.lineTo(6, 10); ctx.lineTo(-6, 10); ctx.closePath(); ctx.fillStyle = '#0d1412'; ctx.fill();
        glow(ctx, 0, 4, 10 + recoil * 5, '79,198,160', 0.6);
        circle(ctx, 0, -14 - tier, 2.4, '#e8e2d0');
        // braziers
        for (const s of [-1, 1]) {
          rect(ctx, s * 15 - 2, -2, 4, 10, '#3a3a3a');
          const fl = Math.sin(time * 9 + s) * 1.5;
          poly(ctx, [s * 15 - 3, -2, s * 15, -9 - fl - tier, s * 15 + 3, -2], '#4fc6a0');
          poly(ctx, [s * 15 - 1.5, -2, s * 15, -6 - fl, s * 15 + 1.5, -2], '#d8f7e8');
        }
        if (tier >= 3) for (const s of [-1, 1]) circle(ctx, s * 7, -6, 1.8, '#e8e2d0');
        tierPips(ctx, tier, 22);
        break;
      }
    }
    if (stunned) {
      const col = stunFx === 'ice' ? '170,225,255' : stunFx === 'rock' ? '160,140,110' : '255,120,40';
      glow(ctx, 0, -10, 26, col, 0.55);
      if (stunFx === 'ice') { poly(ctx, [-12, 12, -9, -16, 0, -24, 9, -16, 12, 12], 'rgba(190,235,255,0.45)', 'rgba(255,255,255,0.7)', 1); }
      else for (let i = 0; i < 3; i++) { const a = time * 4 + i * 2.1; poly(ctx, [Math.cos(a) * 9, -28, Math.cos(a) * 9 + 3, -22, Math.cos(a) * 9 - 3, -22], '#ffe08a'); }
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------------ */
  /* Enemies: feet at (0,0), facing right; caller flips for facing left */
  /* ------------------------------------------------------------------ */
  const legs = (ctx, s, a, color, spread) => {
    const k = Math.sin(a * 14) * s * 0.25;
    line(ctx, -spread, -s * 0.3, -spread + k, 0, color, s * 0.18);
    line(ctx, spread, -s * 0.3, spread - k, 0, color, s * 0.18);
  };

  const ENEMY = {
    goblin(ctx, s, a) {
      const b = Math.abs(Math.sin(a * 14)) * 1.2;
      legs(ctx, s, a, '#3c5a24', s * 0.25);
      ellipse(ctx, 0, -s * 0.75 - b, s * 0.55, s * 0.6, '#6b4a2b');
      circle(ctx, s * 0.15, -s * 1.45 - b, s * 0.5, '#7cb24a');

    spiderling(ctx, s, a) { ENEMY.spider(ctx, s, a); },

  function drawDragon(ctx, s, a, body, belly, big) {
    const f = Math.sin(a * (big ? 5 : 8));
    const wy = f * s * 0.8;
    // wings
    poly(ctx, [-s * 0.2, -s * 1.3, -s * 1.6, -s * 2.4 + wy, -s * 2.2, -s * 1.4 + wy * 0.5, -s * 1.4, -s * 1.5 + wy * 0.4, -s * 0.9, -s * 1.0], body, 'rgba(0,0,0,0.4)', 1);
    poly(ctx, [s * 0.2, -s * 1.3, s * 1.0, -s * 2.6 + wy, s * 1.6, -s * 1.7 + wy * 0.5, s * 1.1, -s * 1.5 + wy * 0.4, s * 0.6, -s * 1.0], body, 'rgba(0,0,0,0.4)', 1);
    // tail
    ctx.beginPath(); ctx.moveTo(-s * 0.6, -s * 1.0);
    ctx.quadraticCurveTo(-s * 1.6, -s * 0.6 + f * 3, -s * 2.1, -s * 1.2);
    ctx.strokeStyle = body; ctx.lineWidth = s * 0.22; ctx.lineCap = 'round'; ctx.stroke();
    poly(ctx, [-s * 2.1, -s * 1.2, -s * 2.5, -s * 1.5, -s * 2.3, -s * 1.0], belly);
    // body & neck
    ellipse(ctx, 0, -s * 1.05, s * 0.9, s * 0.5, body);
    ellipse(ctx, 0.1 * s, -s * 0.9, s * 0.6, s * 0.25, belly);
    ctx.beginPath(); ctx.moveTo(s * 0.6, -s * 1.2); ctx.quadraticCurveTo(s * 1.0, -s * 1.9, s * 1.35, -s * 1.8);
    ctx.strokeStyle = body; ctx.lineWidth = s * 0.32; ctx.stroke();
    ellipse(ctx, s * 1.45, -s * 1.8, s * 0.42, s * 0.26, body, 0.15);
    poly(ctx, [s * 1.3, -s * 2.0, s * 1.15, -s * 2.4, s * 1.45, -s * 2.05], belly);
    circle(ctx, s * 1.55, -s * 1.85, s * 0.07, '#ffe05a');
    if (big) {
      for (let i = 0; i < 5; i++) poly(ctx, [-s * 0.6 + i * s * 0.3, -s * 1.5, -s * 0.5 + i * s * 0.3, -s * 1.75, -s * 0.4 + i * s * 0.3, -s * 1.5], belly);
      glow(ctx, s * 1.85, -s * 1.75, s * 0.5, '255,140,40', 0.4 + 0.3 * Math.abs(f));
    }
  }

  function drawEnemy(ctx, e, time) {
    const s = e.size, def = e.def;
    ctx.save();
    ctx.translate(e.x, e.y);
    const flyLift = e.flying ? -16 - Math.sin(e.anim * 3) * 3 : 0;
    // shadow
    ellipse(ctx, 0, 1, s * (e.flying ? 0.7 : 0.9), s * 0.3, 'rgba(0,0,0,' + (e.flying ? 0.18 : 0.3) + ')');
    if (e.elite) {
      ctx.beginPath(); ctx.ellipse(0, 1, s * 1.2, s * 0.45, 0, 0, TAU);
      ctx.strokeStyle = 'rgba(255,207,74,' + (0.6 + Math.sin(time * 6) * 0.3) + ')'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (e.boss) glow(ctx, 0, -s, s * 2.2, e.enraged ? '255,60,30' : '255,180,80', 0.25);
    if (e.buffT > 0) glow(ctx, 0, -s, s * 1.6, '255,60,40', 0.35);
    ctx.translate(0, flyLift);
    ctx.save();
    ctx.scale(e.facing, 1);
    const fn = ENEMY[e.type] || ENEMY.goblin;
    fn(ctx, s, e.anim);
    ctx.restore();
    if (e.hitFlash > 0) { ctx.globalCompositeOperation = 'lighter'; glow(ctx, 0, -s, s * 1.3, '255,255,255', 0.5); ctx.globalCompositeOperation = 'source-over'; }
    if (e.slowT > 0) { ctx.beginPath(); ctx.ellipse(0, -1, s * 0.9, s * 0.3, 0, 0, TAU); ctx.strokeStyle = 'rgba(140,210,255,0.85)'; ctx.lineWidth = 2; ctx.stroke(); }
    if (e.curse) for (let i = 0; i < 2; i++) { const t = (time * 1.5 + i * 0.5) % 1; circle(ctx, Math.sin(t * 9 + i) * s * 0.6, -s * 2 * t - s * 0.6, 2.2 * (1 - t), 'rgba(170,110,255,' + (1 - t) + ')'); }
    if (e.shield > 0) { ctx.beginPath(); ctx.arc(0, -s, s * 1.3, 0, TAU); ctx.strokeStyle = 'rgba(127,211,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    if (e.stunT > 0) for (let i = 0; i < 3; i++) { const a = time * 5 + i * 2.1; circle(ctx, Math.cos(a) * s * 0.7, -s * 2.3 + Math.sin(a) * 2, 1.8, '#ffe08a'); }

    if (!e.boss && (e.hp < e.maxHp || e.elite)) {

      const f = Math.max(0, e.hp / e.maxHp);
      rect(ctx, -w / 2, y, w * f, 3, f > 0.5 ? '#6fd36a' : f > 0.25 ? '#e8c34a' : '#e25a4a');
      if (e.shield > 0) rect(ctx, -w / 2, y - 2, w * Math.min(1, e.shield / e.maxHp), 1.5, '#7fd3ff');
    }
    ctx.restore();
  }

  function drawSummon(ctx, sm, time) {
    ctx.save();
    ctx.translate(sm.x, sm.y);
    const rise = sm.rise > 0 ? sm.rise / 0.4 : 0;
    ellipse(ctx, 0, 1, sm.size * 0.9, sm.size * 0.3, 'rgba(0,0,0,0.3)');
    ctx.beginPath(); ctx.ellipse(0, 1, sm.size * 1.0, sm.size * 0.35, 0, 0, TAU); ctx.strokeStyle = 'rgba(79,198,160,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
    if (rise > 0) { ctx.beginPath(); ctx.rect(-30, -60, 60, 60); ctx.clip(); ctx.translate(0, rise * sm.size * 2.2); }
    ctx.save();
    ctx.scale(sm.facing, 1);
    const s = sm.size;
    ENEMY.skeleton(ctx, s, sm.anim, true);
    if (sm.champion) {
      poly(ctx, [-s * 0.45, -s * 1.85, -s * 0.35, -s * 2.3, 0, -s * 2.05, s * 0.35, -s * 2.3, s * 0.45, -s * 1.85], '#4fc6a0');

    if (sm.swing > 0) { ctx.beginPath(); ctx.arc(s * 0.4, -s * 1.1, s * 1.2, -1.2, 0.6); ctx.strokeStyle = 'rgba(220,255,240,0.6)'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.restore();
    if (rise <= 0) {

  /* ------------------------------------------------------------------ */

  <script>/* js/render/renderer.js */
/* =====================================================================
 * Realm Guardians — render/renderer.js
 * Draws a Battle onto a canvas. Static terrain is rendered ONCE into an
 * offscreen canvas per map layout; each frame only blits it and draws
 * moving things. The renderer never mutates battle state.
 * ===================================================================== */

RG.Renderer = (function () {
  const C = RG.CONFIG, S = RG.Sprites, TAU = Math.PI * 2;
  const bgCache = {};

  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  /** Static map art for a layout (cached). Also used for menu thumbnails. */
  function mapImage(mapIdx, layoutIdx) {

    if (bgCache[key]) return bgCache[key];
    const map = RG.MAPS[mapIdx], terr = RG.Terrain.build(mapIdx, layoutIdx), pal = map.palette;

      for (const p of this.ambient) {
        switch (p.kind) {
          case 'snow': S.circle(ctx, p.x, p.y, p.s, 'rgba(255,255,255,0.85)'); break;
          case 'leaves': ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ph * 2); S.ellipse(ctx, 0, 0, p.s * 1.6, p.s * 0.8, 'rgba(190,160,60,0.75)'); ctx.restore(); break;
          case 'embers': S.circle(ctx, p.x, p.y, p.s * 0.8, 'rgba(255,' + (120 + Math.floor(Math.sin(p.ph * 6) * 50)) + ',40,0.85)'); break;
          case 'spores': S.glow(ctx, p.x, p.y, 6, '170,255,140', 0.35 + Math.sin(p.ph * 3) * 0.2); break;
          default: S.circle(ctx, p.x, p.y, p.s * 0.7, 'rgba(230,210,170,0.3)');
        }
      }
    }

    /**
     * @param ui { build, hoverCell, valid, selected, smite, pointer, realTime, dt, showGrid }
     */
    draw(ui) {
      const b = this.battle, ctx = this.ctx;
      if (!b) return;
      const time = b.time;
      this.updateAmbient(ui.dt);
      let sx = 0, sy = 0;
      if (b.shake > 0) { sx = (Math.random() - 0.5) * b.shake * 10; sy = (Math.random() - 0.5) * b.shake * 10; }
      const k = this.scale * this.dpr;
      ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
      ctx.drawImage(this.bg, 0, 0);
      if ((ui.build || ui.selected) && ui.showGrid) { ctx.globalAlpha = 0.6; ctx.drawImage(this.grid, 0, 0); ctx.globalAlpha = 1; }

      // Scorch marks under everything.
      for (const f of b.fx) if (f.kind === 'scorch') { ctx.globalAlpha = 0.35 * (f.life / f.max); S.ellipse(ctx, f.x, f.y, f.r, f.r * 0.5, '#1a120c'); ctx.globalAlpha = 1; }

      // Range of selected tower.
      if (ui.selected) this.drawRange(ctx, ui.selected.x, ui.selected.y, ui.selected.stats.range, true);
      // Necro rally markers.
      for (const t of b.towers) if (t.type === 'necro' && t.rally && (ui.selected === t || ui.build === 'necro')) {
        ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(79,198,160,0.7)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.rally.x, t.rally.y); ctx.stroke(); ctx.restore();
        S.circle(ctx, t.rally.x, t.rally.y, 4, '#4fc6a0');
      }

      S.drawCastle(ctx, b.castle.x, b.castle.y, time, b.lives / b.maxLives, b.map.id);

      // Depth-sorted ground entities.
      const list = this.drawList; list.length = 0;
      for (const t of b.towers) list.push(t);
      for (const e of b.enemies) if (!e.flying) list.push(e);
      for (const s of b.summons) list.push(s);
      list.sort((a, c) => a.y - c.y);
      for (const it of list) {
        if (it.def && it.stats) { // tower
          ctx.save(); ctx.translate(it.x, it.y);
          if (ui.selected === it) S.glow(ctx, 0, 6, 30, '255,220,120', 0.35);
          S.drawTower(ctx, it.type, it.tier, time, it.angle, it.anim, it.stunned > 0, it.stunFx);
          ctx.restore();
        } else if (it.tower) S.drawSummon(ctx, it, time);
        else S.drawEnemy(ctx, it, time);
      }
      for (const e of b.enemies) if (e.flying) S.drawEnemy(ctx, e, time);

      this.drawProjectiles(ctx, b);
      this.drawFx(ctx, b);

      // Placement preview.
      if (ui.build && ui.hoverCell) {
        const { c, r } = ui.hoverCell, x = (c + 0.5) * C.TILE, y = (r + 0.5) * C.TILE;
        const def = RG.TOWERS[ui.build];
        const st = RG.computeTowerStats(ui.build, 1, b.heroLevel(ui.build));
        ctx.fillStyle = ui.valid ? 'rgba(120,255,140,0.25)' : 'rgba(255,80,80,0.3)';
        ctx.fillRect(c * C.TILE + 2, r * C.TILE + 2, C.TILE - 4, C.TILE - 4);
        this.drawRange(ctx, x, y, st.range, ui.valid);
        ctx.save(); ctx.globalAlpha = 0.65; ctx.translate(x, y);
        S.drawTower(ctx, ui.build, 1, time, -0.5, 0, false); ctx.restore();
        if (!ui.valid || b.gold < def.cost) {
          ctx.font = '600 12px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillStyle = '#ffb0a0';
          ctx.fillText(b.gold < def.cost ? 'Need ' + def.cost + ' gold' : 'Blocked', x, y - 42);
        }
      }
      if (ui.smite && ui.pointer) {
        const r = b.smite.radius;
        ctx.save();
        ctx.beginPath(); ctx.arc(ui.pointer.x, ui.pointer.y, r, 0, TAU);
        ctx.fillStyle = 'rgba(255,240,170,0.15)'; ctx.fill();
        ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(255,240,170,0.9)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
      }

      this.drawAmbient(ctx);
      if (b.boss && !b.boss.dead) this.drawBossBar(ctx, b.boss);
    }

    drawRange(ctx, x, y, r, ok) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = ok ? 'rgba(255,230,150,0.1)' : 'rgba(255,90,90,0.1)'; ctx.fill();
      ctx.strokeStyle = ok ? 'rgba(255,230,150,0.75)' : 'rgba(255,110,110,0.8)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([7, 5]); ctx.stroke(); ctx.setLineDash([]);
    }

    drawProjectiles(ctx, b) {
      for (const p of b.projectiles) {
        switch (p.kind) {
          case 'arrow': {
            const a = p.a, c = Math.cos(a), s = Math.sin(a);
            S.line(ctx, p.x - c * 12, p.y - s * 12, p.x, p.y, p.pierce ? '#ffe9a0' : '#d9b16a', p.pierce ? 2.2 : 1.6);
            S.line(ctx, p.x - c * 3, p.y - s * 3, p.x + c * 2, p.y + s * 2, '#f2f2f2', 2.2);
            if (p.pierce || p.crit) S.glow(ctx, p.x, p.y, 8, '255,230,140', 0.5);
            break;
          }
          case 'orb': S.glow(ctx, p.x, p.y, p.nova ? 16 : 11, p.nova ? '200,150,255' : '120,200,255', 0.8); S.circle(ctx, p.x, p.y, 3, '#eaf8ff'); break;
          case 'shadow': S.glow(ctx, p.x, p.y, 12, '150,90,230', 0.75); S.circle(ctx, p.x, p.y, 3.2, '#1a0f26'); S.circle(ctx, p.x, p.y, 1.5, '#9effa8'); break;
          case 'bone': ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin || 0); S.line(ctx, -5, 0, 5, 0, '#efe9d8', 2.4); S.circle(ctx, -5, 0, 2, '#efe9d8'); S.circle(ctx, 5, 0, 2, '#efe9d8'); ctx.restore(); break;
          case 'enemyBolt': S.glow(ctx, p.x, p.y, 10, '197,139,255', 0.8); S.circle(ctx, p.x, p.y, 2.5, '#f0dcff'); break;
          case 'bomb': {
            const r = p.small ? 3 : 5.5;
            S.ellipse(ctx, p.x, p.y, r, r * 0.45, 'rgba(0,0,0,0.3)');
            S.circle(ctx, p.x, p.y - p.z, r, '#1c1b20');
            S.circle(ctx, p.x - r * 0.3, p.y - p.z - r * 0.3, r * 0.35, 'rgba(255,255,255,0.35)');
            if (!p.small) S.circle(ctx, p.x + 3, p.y - p.z - 5, 1.6, Math.random() > 0.5 ? '#ffd04a' : '#ff7a2a');
            break;
          }
        }
      }
    }

    drawFx(ctx, b) {
      for (const f of b.fx) {
        const t = f.life / f.max;
        switch (f.kind) {
          case 'spark': ctx.globalAlpha = t; S.circle(ctx, f.x, f.y, f.size * (0.5 + t * 0.5), f.color); break;
          case 'smoke': ctx.globalAlpha = t * 0.6; S.circle(ctx, f.x, f.y, f.size * (1.6 - t * 0.6), f.color); break;
          case 'ring':
            ctx.globalAlpha = t; ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - t), 0, TAU);
            ctx.strokeStyle = f.color; ctx.lineWidth = f.w * t + 0.5; ctx.stroke(); break;
          case 'flash': ctx.globalAlpha = 1; S.glow(ctx, f.x, f.y, f.r, f.color, 0.6 * t); break;
          case 'bolt': {
            ctx.globalAlpha = t;
            const pts = f.pts;
            const drawPath = (w, col) => {
              ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
              for (let i = 1; i < pts.length; i++) {
                const a = pts[i - 1], c = pts[i];
                if (f.jag) for (let k = 1; k < 4; k++) { const u = k / 4; ctx.lineTo(a.x + (c.x - a.x) * u + (Math.random() - 0.5) * 10, a.y + (c.y - a.y) * u + (Math.random() - 0.5) * 10); }
                ctx.lineTo(c.x, c.y);
              }
              ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
            };
            if (f.glow) drawPath(f.w * 3, 'rgba(255,255,255,0.18)');
            drawPath(f.w, f.color);
            break;
          }
          case 'text':
            ctx.globalAlpha = Math.min(1, t * 2);
            ctx.font = (f.big ? '700 15px ' : '600 11px ') + 'system-ui, sans-serif'; ctx.textAlign = 'center';
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(f.text, f.x, f.y);
            ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); break;
          case 'beam': {
            ctx.globalAlpha = t;
            const g = ctx.createLinearGradient(f.x, 0, f.x, f.y);
            g.addColorStop(0, 'rgba(255,245,200,0)'); g.addColorStop(1, 'rgba(255,245,200,0.9)');
            ctx.fillStyle = g; ctx.fillRect(f.x - 18 * t, 0, 36 * t, f.y);
            break;
          }
          case 'soul': {
            const u = 1 - t;
            ctx.globalAlpha = t;
            S.glow(ctx, f.x + (f.tx - f.x) * u, f.y + (f.ty - f.y) * u - Math.sin(u * Math.PI) * 20, 9, '158,255,168', 0.8);
            break;
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    drawBossBar(ctx, e) {
      const w = 380, x = (C.WORLD_W - w) / 2, y = 14;
      ctx.save();
      ctx.fillStyle = 'rgba(10,14,30,0.85)'; ctx.fillRect(x - 4, y - 4, w + 8, 26);
      ctx.strokeStyle = '#e2b65c'; ctx.lineWidth = 1.5; ctx.strokeRect(x - 4, y - 4, w + 8, 26);
      const f = Math.max(0, e.hp / e.maxHp);
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, '#7a1414'); g.addColorStop(1, e.enraged ? '#ff5a2a' : '#d43a2a');
      ctx.fillStyle = g; ctx.fillRect(x, y, w * f, 18);
      if (e.shield > 0) { ctx.fillStyle = 'rgba(127,211,255,0.7)'; ctx.fillRect(x, y, w * Math.min(1, e.shield / e.maxHp), 4); }
      ctx.font = '700 12px Cinzel, Georgia, serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff3d6';
      ctx.fillText(e.def.name + (e.enraged ? ' — Enraged' : ''), C.WORLD_W / 2, y + 13);
      ctx.restore();
    }
  }

  Renderer.mapImage = mapImage;
  return Renderer;
})();

</script>

  crystal: '<svg viewBox="0 0 24 24"><path d="M12 2.5 19 9l-7 12.5L5 9z" fill="#8f6ee8" stroke="#2e1a6b" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 9h14M12 2.5 9 9l3 12.5L15 9z" stroke="#d6c8ff" stroke-width="1" fill="none" opacity=".8"/></svg>',
  skull: '<svg viewBox="0 0 24 24"><path d="M12 3a7.5 7.5 0 0 0-7.5 7.5c0 2.6 1.3 4.4 3 5.4V19h9v-3.1c1.7-1 3-2.8 3-5.4A7.5 7.5 0 0 0 12 3z" fill="#e8e2d0" stroke="#4a4234" stroke-width="1.4"/><circle cx="9" cy="11" r="2" fill="#2a2418"/><circle cx="15" cy="11" r="2" fill="#2a2418"/><path d="M10 19v2M14 19v2" stroke="#4a4234" stroke-width="1.4"/></svg>',

  crown: '<svg viewBox="0 0 24 24"><path d="M3.5 17 5 7l4.5 4.5L12 5l2.5 6.5L19 7l1.5 10z" fill="#e9b949" stroke="#6b4a10" stroke-width="1.3" stroke-linejoin="round"/><rect x="3.5" y="17" width="17" height="3" rx="1" fill="#c9962e"/></svg>',
  horns: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6" fill="#b04a3a" stroke="#4a1410" stroke-width="1.3"/><path d="M7 9 4 3l6 4M17 9l3-6-6 4" fill="#e8e2d0" stroke="#4a4234" stroke-width="1"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path d="M13 2 5 13.5h6L10 22l9-12h-6z" fill="#ffe8a0" stroke="#7a5212" stroke-width="1.3" stroke-linejoin="round"/></svg>',

RG.icon = name => '<i class="ico ico-' + name + '" aria-hidden="true">' + (RG.ICONS[name] || '') + '</i>';
RG.paintIcons = root => {
  root.querySelectorAll('i[data-icon]').forEach(el => {
    el.classList.add('ico');
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = RG.ICONS[el.dataset.icon] || '';

};

  <script>/* js/ui/screens.js */
/* =====================================================================
 * Realm Guardians — ui/screens.js
 * Menu screens rendered as HTML into #screen-root. A single delegated
 * click handler dispatches [data-act] buttons to ACTIONS.
 * Screens: menu · campaign · levels · heroes · hero · kingdom · settings · howto
 * ===================================================================== */

RG.UI = (function () {
  const P = RG.Progress, U = RG.util;
  let root, current = null, currentArg = null;
  const ui = { selectedLevel: {}, confirmReset: false };

  const G = () => RG.Game;
  const save = () => RG.Game.save;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const crystals = () => '<div class="purse" title="Crystals: spend them on heroes and kingdom upgrades">' + RG.icon('crystal') + '<b>' + U.fmt(save().crystals) + '</b></div>';
  const stars = (n, max = 3) => '<span class="stars" aria-label="' + n + ' of ' + max + ' stars">' + Array.from({ length: max }, (_, i) => '<span class="star' + (i < n ? ' on' : '') + '">' + RG.ICONS.star + '</span>').join('') + '</span>';
  const pips = (n, max) => '<span class="pips" aria-label="Level ' + n + ' of ' + max + '">' + Array.from({ length: max }, (_, i) => '<span class="pip' + (i < n ? ' on' : '') + '"></span>').join('') + '</span>';
  const topbar = (title, backTo, backArg) =>
    '<header class="topbar"><button class="btn-back" data-act="go" data-to="' + backTo + '"' + (backArg != null ? ' data-arg="' + backArg + '"' : '') + '>' + RG.icon('back') + '<span>Back</span></button><h2>' + title + '</h2>' + crystals() + '</header>';

  /* ---------------- Screens ---------------- */
  const SCREENS = {};

  SCREENS.menu = function () {
    const s = save();
    const next = nextStage();
    const total = P.totalStars(s);
    const cont = next
      ? '<button class="btn btn-gold btn-lg" data-act="go" data-to="levels" data-arg="' + next.m + '" data-lvl="' + next.l + '">' + (P.isCompleted(s, 0, 0) ? 'Continue: stage ' + U.levelLabel(next.m, next.l) : 'Begin the campaign') + '</button>'
      : '<button class="btn btn-gold btn-lg" data-act="go" data-to="campaign">Campaign</button>';
    return '<div class="screen menu">' +
      '<canvas class="menu-bg" id="menu-bg" aria-hidden="true"></canvas>' +
      '<div class="menu-inner">' +
      '<h1 class="title"><span class="t1">Realm</span><span class="t2">Guardians</span></h1>' +
      '<p class="tagline">The kingdom has one gate left. Hold it.</p>' +
      '<nav class="menu-nav">' + cont +
      '<button class="btn" data-act="go" data-to="campaign">Campaign map</button>' +
      '<button class="btn" data-act="go" data-to="heroes">Heroes' + (heroAlert() ? ' <span class="dot" title="Something can be unlocked or upgraded"></span>' : '') + '</button>' +
      '<button class="btn" data-act="go" data-to="kingdom">Kingdom</button>' +
      '<div class="menu-row"><button class="btn btn-quiet" data-act="go" data-to="howto">How to play</button><button class="btn btn-quiet" data-act="go" data-to="settings">Settings</button></div>' +
      '</nav>' +
      '<div class="menu-foot">' + crystals() + '<div class="purse">' + RG.icon('star') + '<b>' + total + '</b><span>/ 150</span></div></div>' +
      '</div><p class="version">v' + RG.CONFIG.VERSION + (RG.Save.isPersistent() ? '' : ' · progress can\'t be saved in this browser') + '</p></div>';
  };

  SCREENS.campaign = function () {
    const s = save();
    const cards = RG.MAPS.map((map, m) => {
      const open = P.isMapUnlocked(s, m);
      let cleared = 0;
      for (let l = 0; l < 10; l++) if (P.isCompleted(s, m, l)) cleared++;
      const bossDef = RG.ENEMIES[map.boss];
      return '<button class="map-card' + (open ? '' : ' locked') + '" style="--accent:' + map.palette.ui + '" ' + (open ? 'data-act="go" data-to="levels" data-arg="' + m + '"' : 'disabled') + '>' +
        '<canvas class="thumb" data-map="' + m + '" data-layout="0"></canvas>' +
        '<div class="map-info"><span class="region">Region ' + (m + 1) + '</span><h3>' + esc(map.name) + '</h3><p>' + esc(map.subtitle) + '</p>' +
        (open
          ? '<div class="map-meta">' + stars(1, 1) + '<b>' + P.mapStars(s, m) + '</b>/30<span class="sep"></span>' + cleared + ' of 10 cleared</div>' +
            '<div class="map-boss">' + RG.icon('crown') + 'Boss: ' + esc(bossDef.name) + '</div>'
          : '<div class="map-meta">' + RG.icon('lock') + ' Defeat ' + esc(RG.ENEMIES[RG.MAPS[m - 1].boss].name) + ' to enter</div>') +
        '</div></button>';
    }).join('');
    return '<div class="screen">' + topbar('Campaign', 'menu') + '<div class="map-grid">' + cards + '</div></div>';
  };

  // Node positions (percent) for the ten stage markers on the region map.
  const NODE_POS = [[8, 72], [18, 50], [27, 28], [38, 44], [48, 66], [58, 46], [66, 24], [76, 40], [84, 62], [92, 36]];

  SCREENS.levels = function (m) {
    m = +m || 0;
    const s = save(), map = RG.MAPS[m];
    if (ui.selectedLevel[m] == null) {
      let l = 0;
      while (l < 9 && P.isCompleted(s, m, l)) l++;
      ui.selectedLevel[m] = l;
    }
    const sel = ui.selectedLevel[m];
    const line = NODE_POS.map(p => p[0] + ',' + p[1]).join(' ');
    const nodes = NODE_POS.map((p, l) => {
      const open = P.isLevelUnlocked(s, m, l), r = P.rec(s, m, l);
      const cls = 'node' + (open ? '' : ' locked') + (r.completed ? ' done' : '') + (l === sel ? ' sel' : '') + (l === 9 ? ' boss' : l === 4 ? ' mini' : '');

      '</div>';
    return '<div class="screen">' + topbar(esc(map.name), 'campaign') +

  function levelDetail(m, l) {

  SCREENS.hero = function (id) {
    const s = save(), d = RG.TOWERS[id], h = s.heroes[id];

        (h.unlocked && lv < 5 ? nxt.filter(([k]) => !cur.some(c => c[0] === k)).map(([k, v]) => '<div class="new"><dt>' + k + '</dt><dd><span class="up">' + v + '</span></dd></div>').join('') : '') +

      '<section class="hd-left panel">' +

      '<p class="hd-blurb">' + d.blurb + '</p>' +
      '<div class="hd-meta"><span>' + RG.icon('coin') + d.cost + ' to build</span><span>Tier upgrades ' + d.upgradeCosts.join(' / ') + '</span><span>Hotkey ' + d.key + '</span></div>' +
