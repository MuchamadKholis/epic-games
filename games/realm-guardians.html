  /* ---------------- Helpers ---------------- */
  function nextStage() {
    const s = save();
    for (let m = 0; m < RG.MAPS.length; m++) for (let l = 0; l < 10; l++) if (P.isLevelUnlocked(s, m, l) && !P.isCompleted(s, m, l)) return { m, l };
    return null;
  }
  function heroAlert() {
    const s = save();
    return RG.TOWER_ORDER.some(id => P.canUnlockHero(s, id) || P.canUpgradeHero(s, id));
  }

  function paintCanvases() {
    root.querySelectorAll('canvas[data-map]').forEach(cv => {
      const img = RG.Renderer.mapImage(+cv.dataset.map, +cv.dataset.layout);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return;
      cv.width = w * dpr; cv.height = h * dpr;
      const ctx = cv.getContext('2d');
      const sc = Math.max(cv.width / img.width, cv.height / img.height);
      ctx.drawImage(img, (cv.width - img.width * sc) / 2, (cv.height - img.height * sc) / 2, img.width * sc, img.height * sc);
    });
    root.querySelectorAll('canvas[data-tower]').forEach(cv => RG.Sprites.towerIcon(cv, cv.dataset.tower, +cv.dataset.tier || 1, { bg: cv.dataset.bg ? '255,210,120' : null }));
    root.querySelectorAll('canvas[data-enemy]').forEach(cv => RG.Sprites.enemyIcon(cv, cv.dataset.enemy));
    const bg = root.querySelector('#menu-bg');
    if (bg) drawMenuBackdrop(bg);
  }

  /** The title-screen scene: a moonlit kingdom with its last castle. */
  function drawMenuBackdrop(cv) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const rnd = U.rng(77);
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#060a1a'); sky.addColorStop(0.55, '#141f45'); sky.addColorStop(1, '#2a2440');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) { ctx.globalAlpha = 0.3 + rnd() * 0.7; ctx.fillStyle = '#fff6dc'; ctx.fillRect(rnd() * w, rnd() * h * 0.6, rnd() * 1.6 + 0.4, rnd() * 1.6 + 0.4); }
    ctx.globalAlpha = 1;
    const mx = w * 0.78, my = h * 0.2;
    RG.Sprites.glow(ctx, mx, my, Math.min(w, h) * 0.3, '255,236,190', 0.22);
    RG.Sprites.circle(ctx, mx, my, Math.min(w, h) * 0.055, '#f6ecd0');
    const ridge = (base, amp, color, seed) => {
      const r = U.rng(seed);
      ctx.beginPath(); ctx.moveTo(0, h);
      for (let x = 0; x <= w + 40; x += 40) ctx.lineTo(x, base - r() * amp - Math.sin(x / 140 + seed) * amp * 0.4);
      ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    };
    ridge(h * 0.62, h * 0.16, '#1c2448', 3);
    ridge(h * 0.74, h * 0.1, '#141a36', 9);
    // Castle silhouette on the right hill.
    const cx = w * 0.72, cy = h * 0.74, k = Math.max(0.7, Math.min(1.6, h / 600));
    ctx.save(); ctx.translate(cx, cy); ctx.scale(k * 1.6, k * 1.6);
    ctx.fillStyle = '#0b1028';
    ctx.fillRect(-48, -40, 96, 40);
    for (let i = -48; i < 48; i += 10) ctx.fillRect(i, -46, 6, 6);
    for (const s of [-1, 1]) { ctx.fillRect(s * 48 - 12, -72, 24, 72); ctx.beginPath(); ctx.moveTo(s * 48 - 15, -72); ctx.lineTo(s * 48, -98); ctx.lineTo(s * 48 + 15, -72); ctx.fill(); }
    ctx.fillRect(-16, -84, 32, 44); ctx.beginPath(); ctx.moveTo(-20, -84); ctx.lineTo(0, -118); ctx.lineTo(20, -84); ctx.fill();
    ctx.fillStyle = '#ffcf6a';
    for (const [x, y] of [[-50, -56], [46, -60], [-4, -70], [-26, -26], [22, -24]]) { ctx.globalAlpha = 0.85; ctx.fillRect(x, y, 3.5, 6); }
    ctx.globalAlpha = 1;
    ctx.restore();
    ridge(h * 0.9, h * 0.06, '#0a0e22', 21);
    // Distant torches of the approaching horde.
    for (let i = 0; i < 26; i++) { const x = w * (0.04 + rnd() * 0.4), y = h * (0.8 + rnd() * 0.12); RG.Sprites.glow(ctx, x, y, 7, '255,120,50', 0.7); }
  }

  function show(name, arg) {
    if (!SCREENS[name]) name = 'menu';
    if (name !== 'settings') ui.confirmReset = false;
    current = name; currentArg = arg;
    hideTooltip();
    root.innerHTML = SCREENS[name](arg);
    root.classList.remove('hidden');
    root.scrollTop = 0;
    const scr = root.firstElementChild;
    if (scr) scr.classList.add('enter');
    requestAnimationFrame(paintCanvases);
    RG.Audio.startMusic('menu');
  }
  function refresh() { const top = root.scrollTop; show(current, currentArg); root.scrollTop = top; }
  function hide() { root.classList.add('hidden'); root.innerHTML = ''; current = null; }

  /* ---------------- Actions ---------------- */
  const ACTIONS = {
    go(b) { if (b.dataset.lvl != null) ui.selectedLevel[+b.dataset.arg] = +b.dataset.lvl; show(b.dataset.to, b.dataset.arg); },
    'pick-level'(b) {
      const m = +b.dataset.m, l = +b.dataset.l;
      ui.selectedLevel[m] = l;
      const panel = root.querySelector('.level-panel');
      root.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', n === b));
      const detail = panel.querySelector('.level-detail');
      detail.outerHTML = levelDetail(m, l);
      requestAnimationFrame(paintCanvases);
      if (window.matchMedia('(max-width: 860px)').matches) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    start(b) {
      const m = +b.dataset.m, l = +b.dataset.l;
      if (!P.isLevelUnlocked(save(), m, l)) { RG.Audio.play('error'); return; }
      RG.BattleUI.open(m, l);
    },
    'unlock-hero'(b) {
      if (P.unlockHero(save(), b.dataset.id)) { G().persist(); RG.Audio.play('unlock'); refresh(); } else RG.Audio.play('error');
    },
    'upgrade-hero'(b) {
      if (P.upgradeHero(save(), b.dataset.id)) { G().persist(); RG.Audio.play('upgrade'); refresh(); } else RG.Audio.play('error');
    },
    kingdom(b) {
      if (P.buyKingdom(save(), b.dataset.k)) { G().persist(); RG.Audio.play('upgrade'); refresh(); } else RG.Audio.play('error');
    },
    reset() { ui.confirmReset = true; refresh(); },
    'reset-cancel'() { ui.confirmReset = false; refresh(); },
    'reset-confirm'() {
      const settings = save().settings;
      RG.Game.save = RG.Save.reset();
      RG.Game.save.settings = settings;
      G().persist();
      ui.confirmReset = false; ui.selectedLevel = {};
      show('menu');
    },
  };

  /* ---------------- Tooltip (enemy chips etc.) ---------------- */
  const tip = () => document.getElementById('tooltip');
  function showTooltip(el, html) {
    const t = tip();
    t.innerHTML = html;
    t.classList.remove('hidden');
    const r = el.getBoundingClientRect(), tw = t.offsetWidth, th = t.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 8;
    if (y < 8) y = r.bottom + 8;
    x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }
  function hideTooltip() { const t = tip(); if (t) t.classList.add('hidden'); }

  function init() {
    root = document.getElementById('screen-root');
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      RG.Audio.play('click');
      const fn = ACTIONS[b.dataset.act];
      if (fn) fn(b);
    });
    root.addEventListener('input', e => {
      const el = e.target, key = el.dataset.set;
      if (!key) return;
      const st = save().settings;
      if (el.type === 'range') { st[key] = el.value / 100; el.nextElementSibling.textContent = el.value + '%'; }
      else if (el.type === 'checkbox') st[key] = el.checked;
      else if (el.tagName === 'SELECT') st[key] = +el.value;
      RG.Audio.apply(st);
      G().persist();
    });
    root.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el) showTooltip(el, esc(el.dataset.tip)); });
    root.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) hideTooltip(); });
    root.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTooltip(el, esc(el.dataset.tip)); });
    let rt;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (current) paintCanvases(); }, 120); });
  }

  return { init, show, hide, refresh, current: () => current, showTooltip, hideTooltip, esc, stars };
})();

  <script>/* js/ui/battleui.js */
/* =====================================================================
 * Realm Guardians — ui/battleui.js
 * Connects a Battle to the screen: HUD, build bar, tower panel, input,
 * pause/victory/defeat overlays, toasts and the first-stage tutorial.
 * The fixed-timestep loop lives in tick(), called from main.js.
 * ===================================================================== */

RG.BattleUI = (function () {
  const C = RG.CONFIG, P = RG.Progress, U = RG.util;
  const $ = id => document.getElementById(id);
  const esc = s => RG.UI.esc(s);

  let el = {}, battle = null, renderer = null, level = null;
  const st = {
    build: null, selected: null, hover: null, valid: false, smite: false, pointer: null,
    paused: false, speed: 1, acc: 0, endShown: false, endTimer: 0, touchCell: null,
    panelTimer: 0, panelKey: '', hud: {}, tut: null,
  };

  /* ---------------- Setup ---------------- */
  function init() {
    el = {
      root: $('battle'), canvas: $('game-canvas'), stage: $('stage'), build: $('buildbar'), panel: $('tower-panel'),
      overlay: $('overlay'), toasts: $('toasts'), banner: $('banner'), tutorial: $('tutorial'),
      gold: $('hud-gold'), lives: $('hud-lives'), wave: $('hud-wave'), enemies: $('hud-enemies'),
      stageNum: $('hud-stage-num'), stageName: $('hud-stage-name'),
      pause: $('btn-pause'), speed: $('btn-speed'), waveBtn: $('btn-wave'),
    };
    RG.paintIcons(el.root);
    el.pause.innerHTML = RG.icon('pause');
    renderer = new RG.Renderer(el.canvas);

    // Build bar
    el.build.innerHTML = RG.TOWER_ORDER.map(id => {
      const d = RG.TOWERS[id];
      return '<button class="build-btn" data-tower="' + id + '" style="--accent:' + d.color + '"><canvas data-icon-tower="' + id + '"></canvas>' +
        '<span class="bb-name">' + d.name + '</span><span class="bb-cost">' + RG.icon('coin') + d.cost + '</span><kbd>' + d.key + '</kbd><span class="bb-lock">' + RG.icon('lock') + '</span></button>';
    }).join('') +
      '<button class="build-btn smite-btn" data-smite="1"><span class="smite-ring"></span>' + RG.icon('bolt') + '<span class="bb-name">Smite</span><span class="bb-cost" id="smite-cd">Ready</span><kbd>Q</kbd></button>';
    el.build.addEventListener('click', e => {
      const b = e.target.closest('.build-btn');
      if (!b || !battle) return;
      ensureAudio();
      if (b.dataset.smite) toggleSmite(); else selectBuild(b.dataset.tower);
    });
    el.build.addEventListener('pointerover', e => {
      const b = e.target.closest('.build-btn');
      if (!b || e.pointerType === 'touch') return;
      if (b.dataset.smite) RG.UI.showTooltip(b, '<b>Divine Smite</b><br>Holy damage to everything in an area, plus a short stun. Recharges over time.');
      else {
        const d = RG.TOWERS[b.dataset.tower], h = RG.Game.save.heroes[d.id];
        RG.UI.showTooltip(b, '<b>' + d.name + '</b> · level ' + h.level + '<br>' + d.blurb + (h.unlocked ? '' : '<br><em>Recruit this hero on the Heroes screen.</em>'));
      }
    });
    el.build.addEventListener('pointerout', () => RG.UI.hideTooltip());

    // HUD
    el.pause.addEventListener('click', () => { ensureAudio(); togglePause(); });
    el.speed.addEventListener('click', () => { ensureAudio(); cycleSpeed(); });
    el.waveBtn.addEventListener('click', () => { ensureAudio(); callWave(); });

    // Canvas input
    el.canvas.addEventListener('pointermove', onPointerMove);
    el.canvas.addEventListener('pointerdown', onPointerDown);
    el.canvas.addEventListener('pointerleave', () => { if (st.build && !st.touchCell) st.hover = null; st.pointer = st.smite ? st.pointer : null; });
    el.canvas.addEventListener('contextmenu', e => { e.preventDefault(); cancelModes(); });

    el.panel.addEventListener('click', onPanelClick);
    el.overlay.addEventListener('click', onOverlayClick);
    window.addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', () => { if (document.hidden && battle && battle.result === 'playing' && !st.paused) togglePause(true); });
    new ResizeObserver(fit).observe(el.stage);
  }

  function ensureAudio() { RG.Audio.ensure(); }

  /* ---------------- Opening / closing ---------------- */
  function open(m, l) {
    const save = RG.Game.save;
    if (!P.isLevelUnlocked(save, m, l)) return false;
    level = RG.Levels.get(m, l);
    battle = new RG.Battle(level, save, { damageNumbers: save.settings.damageNumbers });
    battle.onEvent = onBattleEvent;
    renderer.setBattle(battle);
    Object.assign(st, { build: null, selected: null, hover: null, smite: false, pointer: null, paused: false, speed: save.settings.defaultSpeed || 1, acc: 0, endShown: false, endTimer: 0, touchCell: null, panelKey: '', hud: {}, tut: null });
    save.stats.played++;
    RG.Game.persist();

    el.stageNum.textContent = U.levelLabel(m, l);
    el.stageName.textContent = level.name;
    el.root.style.setProperty('--map-accent', battle.map.palette.ui);
    el.toasts.innerHTML = '';
    el.banner.className = 'banner';
    hidePanel();
    el.overlay.classList.add('hidden');
    el.overlay.innerHTML = '';
    RG.UI.hide();
    el.root.classList.remove('hidden');
    el.build.querySelectorAll('canvas[data-icon-tower]').forEach(cv => RG.Sprites.towerIcon(cv, cv.dataset.iconTower, 1));
    updateBuildBar(true);
    fit();
    RG.Audio.startMusic('battle', battle.map.music.root);
    showBanner(level.name, 'Stage ' + U.levelLabel(m, l) + ' · ' + level.waves.length + ' waves');
    el.tutorial.classList.add('hidden');
    if (m === 0 && l === 0 && !save.seenTutorial) startTutorial();
    else if (level.isBoss) toast(RG.ENEMIES[battle.map.boss].hint, 'gold', battle.map.boss);
    return true;
  }

  function close(to, arg) {
    battle = null;
    el.root.classList.add('hidden');
    el.overlay.classList.add('hidden');
    el.tutorial.classList.add('hidden');
    RG.UI.hideTooltip();
    RG.UI.show(to || 'levels', arg != null ? arg : level.mapIdx);
  }

  function fit() {
    if (!battle) return;
    const r = el.stage.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    const scale = Math.min(r.width / C.WORLD_W, r.height / C.WORLD_H);
    renderer.resize(Math.floor(C.WORLD_W * scale), Math.floor(C.WORLD_H * scale));
    st.panelKey = '';
  }

  /* ---------------- Loop ---------------- */
  function tick(dt) {
    if (!battle) return;
    if (!st.paused && !st.endShown) {
      st.acc += dt * st.speed;
      let steps = 0;
      while (st.acc >= C.STEP && steps < C.MAX_STEPS_PER_FRAME * st.speed) { battle.update(C.STEP); st.acc -= C.STEP; steps++; }
      if (steps >= C.MAX_STEPS_PER_FRAME * st.speed) st.acc = 0;
    }
    if (battle.result !== 'playing' && !st.endShown) {
      if (!st.endTimer) { st.endTimer = 1.4; cancelModes(); hidePanel(); }
      if (!st.paused) battle.updateFx(dt);
      st.endTimer -= dt;
      if (st.endTimer <= 0) showEnd();
    }
    if (st.selected && !battle.towers.includes(st.selected)) hidePanel();
    renderer.draw({ build: st.build, hoverCell: st.hover, valid: st.valid, selected: st.selected, smite: st.smite, pointer: st.pointer, dt: st.paused ? 0 : dt, showGrid: RG.Game.save.settings.showGrid });
    updateHud();
    st.panelTimer -= dt;
    if (st.selected && st.panelTimer <= 0) { st.panelTimer = 0.2; renderPanel(); }
  }

  /* ---------------- HUD ---------------- */
  function setText(node, key, v) { if (st.hud[key] !== v) { st.hud[key] = v; node.textContent = v; } }
  function updateHud() {
    const b = battle;
    setText(el.gold, 'gold', U.fmt(b.gold));
    setText(el.lives, 'lives', String(b.lives));
    setText(el.wave, 'wave', Math.max(0, b.waveIdx + 1) + '/' + b.nWaves);
    setText(el.enemies, 'en', String(b.aliveCount));
    const low = b.lives <= b.maxLives * 0.3;
    if (st.hud.low !== low) { st.hud.low = low; el.lives.parentElement.classList.toggle('danger', low); }
    let label, enabled = b.canStartWave();
    if (b.waveIdx < 0) label = 'Start battle';
    else if (b.spawning) label = 'Wave incoming';
    else if (b.waveIdx >= b.nWaves - 1) label = b.result === 'playing' ? 'Final wave' : '—';
    else { const bonus = b.earlyBonus(); label = bonus ? 'Next wave +' + bonus : 'Next wave'; }
    setText(el.waveBtn, 'wbl', label);
    if (st.hud.wbe !== enabled) { st.hud.wbe = enabled; el.waveBtn.disabled = !enabled; el.waveBtn.classList.toggle('pulse', enabled && (b.waveIdx < 0 || b.enemies.length === 0)); }
    setText(el.speed, 'spd', st.speed + '×');
    if (st.hud.paused !== st.paused) { st.hud.paused = st.paused; el.pause.innerHTML = RG.icon(st.paused ? 'play' : 'pause'); el.pause.setAttribute('aria-label', st.paused ? 'Resume' : 'Pause'); }
    updateBuildBar(false);
  }

  function updateBuildBar(force) {
    const b = battle, save = RG.Game.save;
    const key = b.gold + '|' + st.build + '|' + st.smite + '|' + Math.ceil(b.smite.cd);
    if (!force && key === st.hud.bb) return;
    st.hud.bb = key;
    el.build.querySelectorAll('.build-btn').forEach(btn => {
      if (btn.dataset.smite) {
        const cd = b.smite.cd;
        btn.classList.toggle('active', st.smite);
        btn.classList.toggle('cooling', cd > 0);
        btn.style.setProperty('--cd', (cd / b.smite.maxCd).toFixed(3));
        btn.querySelector('#smite-cd').textContent = cd > 0 ? Math.ceil(cd) + 's' : 'Ready';
        return;
      }
      const id = btn.dataset.tower, d = RG.TOWERS[id], unlocked = save.heroes[id].unlocked;
      btn.classList.toggle('locked', !unlocked);
      btn.classList.toggle('poor', unlocked && b.gold < d.cost);
      btn.classList.toggle('active', st.build === id);
      btn.setAttribute('aria-pressed', st.build === id ? 'true' : 'false');
    });
  }

  /* ---------------- Modes ---------------- */
  function selectBuild(id) {
    if (!battle || battle.result !== 'playing') return;
    const save = RG.Game.save;
    if (!save.heroes[id].unlocked) { toast(RG.TOWERS[id].name + ' isn\'t recruited yet. Recruit heroes with crystals on the Heroes screen.', 'warn'); RG.Audio.play('error'); return; }
    st.smite = false;
    st.build = st.build === id ? null : id;
    st.touchCell = null;
    if (st.build) hidePanel();
    RG.Audio.play('click');
    tutorialEvent('select');
    updateBuildBar(true);
  }
  function toggleSmite() {
    if (!battle || battle.result !== 'playing') return;
    if (battle.smite.cd > 0) { toast('Divine Smite recharges in ' + Math.ceil(battle.smite.cd) + 's.', 'warn'); RG.Audio.play('error'); return; }
    st.smite = !st.smite; st.build = null; hidePanel();
    if (st.smite) toast('Click the battlefield to call down Divine Smite.', 'info');
    updateBuildBar(true);
  }
  function cancelModes() { st.build = null; st.smite = false; st.hover = null; st.touchCell = null; if (battle) updateBuildBar(true); }

  function togglePause(force) {
    if (!battle || battle.result !== 'playing') return;
    st.paused = force === true ? true : !st.paused;
    if (st.paused) showPauseMenu(); else el.overlay.classList.add('hidden');
  }
  function cycleSpeed() { st.speed = st.speed >= 3 ? 1 : st.speed + 1; }
  function callWave() {
    if (!battle) return;
    if (battle.startNextWave()) tutorialEvent('wave');
  }

  /* ---------------- Pointer input ---------------- */
  function worldPos(e) {
    const r = el.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * C.WORLD_W, y: (e.clientY - r.top) / r.height * C.WORLD_H };
  }
  function updateHover(p) {
    const c = Math.floor(p.x / C.TILE), r = Math.floor(p.y / C.TILE);
    st.hover = battle.inBounds(c, r) ? { c, r } : null;
    st.valid = !!st.hover && battle.canPlace(c, r) && battle.gold >= RG.TOWERS[st.build].cost;
  }
  function onPointerMove(e) {
    if (!battle) return;
    const p = worldPos(e);
    st.pointer = p;
    if (st.build && e.pointerType !== 'touch') updateHover(p);
    el.canvas.style.cursor = st.build || st.smite ? 'crosshair' : battle.towerAtCell(Math.floor(p.x / C.TILE), Math.floor(p.y / C.TILE)) ? 'pointer' : 'default';
  }
  function onPointerDown(e) {
    if (!battle || battle.result !== 'playing' || st.paused) return;
    ensureAudio();
    if (e.button === 2) return;
    const p = worldPos(e);
    st.pointer = p;
    const c = Math.floor(p.x / C.TILE), r = Math.floor(p.y / C.TILE);
    if (st.smite) {
      if (battle.castSmite(p.x, p.y)) st.smite = false;
      updateBuildBar(true);
      return;
    }
    if (st.build) {
      updateHover(p);
      // On touch, the first tap previews and the second tap on the same tile builds.
      if (e.pointerType === 'touch' && (!st.touchCell || st.touchCell.c !== c || st.touchCell.r !== r)) { st.touchCell = { c, r }; return; }
      const res = battle.placeTower(st.build, c, r);
      if (res.ok) {
        tutorialEvent('place');
        if (!e.shiftKey) cancelModes(); else updateHover(p);
        st.touchCell = null;
      } else {
        RG.Audio.play('error');
        toast(res.reason === 'Can\'t build there' ? 'Build on open ground, not on the road or scenery.' : res.reason + '.', 'warn');
      }
      return;
    }
    const t = battle.towerAtCell(c, r);
    if (t) { st.selected = t; st.panelKey = ''; renderPanel(); RG.Audio.play('click'); }
    else hidePanel();
  }

  function onKey(e) {
    if (!battle || el.root.classList.contains('hidden')) return;
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'p') { e.preventDefault(); togglePause(); return; }
    if (k === 'escape') { if (st.paused) togglePause(); else if (st.build || st.smite) cancelModes(); else if (st.selected) hidePanel(); else togglePause(); return; }
    if (st.paused || battle.result !== 'playing') return;
    const tower = RG.TOWER_ORDER.find(id => RG.TOWERS[id].key === k);
    if (tower) { selectBuild(tower); return; }
    if (k === 'q') toggleSmite();
    else if (k === 'n' || k === 'enter') callWave();
    else if (k === 'f') cycleSpeed();
    else if (st.selected && k === 'u') doUpgrade();
    else if (st.selected && k === 's') doSell();
    else if (st.selected && k === 't') { const modes = ['first', 'last', 'strong', 'close']; battle.setTargeting(st.selected, modes[(modes.indexOf(st.selected.targeting) + 1) % 4]); st.panelKey = ''; renderPanel(); }
  }

  /* ---------------- Tower panel ---------------- */
  const TARGET_TIPS = { first: 'Enemy closest to your castle', last: 'Enemy furthest from your castle', strong: 'Enemy with the most health', close: 'Enemy nearest this tower' };
  function hidePanel() { st.selected = null; st.panelKey = ''; el.panel.classList.add('hidden'); }

  function renderPanel() {
    const t = st.selected;
    if (!t || !battle) return hidePanel();
    const cost = battle.upgradeCost(t);
    const key = t.tier + '|' + t.targeting + '|' + (cost !== null && battle.gold >= cost) + '|' + t.kills + '|' + Math.round(t.dmgDealt / 50);
    if (key !== st.panelKey) {
      st.panelKey = key;
      const d = t.def;
      const cur = RG.describeStats(t.stats);
      const nxt = cost !== null ? Object.fromEntries(RG.describeStats(RG.computeTowerStats(t.type, t.tier + 1, battle.heroLevel(t.type)))) : {};
      const rows = cur.map(([k, v]) => '<div><dt>' + k + '</dt><dd>' + v + (nxt[k] !== undefined && String(nxt[k]) !== String(v) ? '<span class="up">' + nxt[k] + '</span>' : '') + '</dd></div>').join('');
      const extra = Object.keys(nxt).filter(k => !cur.some(c => c[0] === k)).map(k => '<div><dt>' + k + '</dt><dd><span class="up">' + nxt[k] + '</span></dd></div>').join('');
      const warn = t.type === 'necro' && !t.rally ? '<p class="tp-warn">No road in range: skeletons can\'t be raised here.</p>' : '';
      el.panel.innerHTML =
        '<div class="tp-head"><canvas data-tp></canvas><div><b>' + d.name + '</b><span>Tier ' + t.tier + ': ' + d.tierNames[t.tier - 1] + '</span></div>' +
        '<button class="btn-icon tp-close" data-tp-act="close" aria-label="Close">' + RG.icon('close') + '</button></div>' +
        warn + '<dl class="tp-stats">' + rows + extra + '</dl>' +
        '<div class="tp-target"><span>Target</span>' + [['first', 'First'], ['last', 'Last'], ['strong', 'Strong'], ['close', 'Nearest']].map(([m, label]) => '<button data-tp-act="target" data-mode="' + m + '" class="' + (t.targeting === m ? 'on' : '') + '" title="' + TARGET_TIPS[m] + '">' + label + '</button>').join('') + '</div>' +
        '<div class="tp-foot"><span>' + t.kills + ' kills · ' + U.fmt(t.dmgDealt) + ' damage</span></div>' +
        '<div class="tp-actions">' +
        (cost === null ? '<button class="btn" disabled>Max tier</button>'
          : '<button class="btn btn-gold" data-tp-act="upgrade"' + (battle.gold >= cost ? '' : ' disabled') + '>Upgrade ' + RG.icon('coin') + cost + '</button>') +
        '<button class="btn btn-danger-quiet" data-tp-act="sell">Sell +' + battle.sellValue(t) + '</button></div>';
      RG.Sprites.towerIcon(el.panel.querySelector('canvas[data-tp]'), t.type, t.tier);
    }
    positionPanel(t);
  }

  function positionPanel(t) {
    el.panel.classList.remove('hidden');
    const cr = el.canvas.getBoundingClientRect(), sr = el.stage.getBoundingClientRect();
    const k = cr.width / C.WORLD_W;
    const tx = cr.left - sr.left + t.x * k, ty = cr.top - sr.top + t.y * k;
    const pw = el.panel.offsetWidth, ph = el.panel.offsetHeight;
    let x = tx + 34 * k + 8, y = ty - ph / 2;
    if (x + pw > sr.width - 6) x = tx - 34 * k - pw - 8;
    if (x < 6) x = Math.max(6, Math.min(sr.width - pw - 6, tx - pw / 2));
    y = Math.max(6, Math.min(sr.height - ph - 6, y));
    el.panel.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
  }

  function doUpgrade() {
    const t = st.selected;
    if (!t) return;
    const r = battle.upgradeTower(t);
    if (!r.ok) { RG.Audio.play('error'); toast(r.reason + '.', 'warn'); }
    else tutorialEvent('upgrade');
    st.panelKey = ''; renderPanel();
  }
  function doSell() { const t = st.selected; if (t && battle.sellTower(t).ok) hidePanel(); }

  function onPanelClick(e) {
    const b = e.target.closest('[data-tp-act]');
    if (!b || b.disabled || !st.selected) return;
    const a = b.dataset.tpAct;
    if (a === 'close') hidePanel();
    else if (a === 'upgrade') doUpgrade();
    else if (a === 'sell') doSell();
    else if (a === 'target') { battle.setTargeting(st.selected, b.dataset.mode); st.panelKey = ''; renderPanel(); RG.Audio.play('click'); }
  }

  /* ---------------- Battle events ---------------- */
  function onBattleEvent(type, data) {
    switch (type) {
      case 'sfx': RG.Audio.play(data); break;
      case 'toast': toast(data.text, data.kind); break;
      case 'newEnemy': {
        const def = RG.ENEMIES[data];
        if (def.hint && !def.boss) toast(def.hint, 'enemy', data);
        break;
      }
      case 'boss':
        showBanner(data.def.name, data.def.desc, 'boss');
        toast(data.def.hint, 'danger', data.type);
        RG.Audio.startMusic('boss');
        break;
      case 'wave':
        showBanner('Wave ' + (data.index + 1), data.bonus ? 'Early call bonus +' + data.bonus + ' gold' : (data.index === battle.nWaves - 1 ? 'Final wave' : ''), 'wave');
        break;
      case 'waveClear':
        toast('Wave ' + (data.wave + 1) + ' cleared: +' + data.bonus + ' gold', 'gold');
        RG.Audio.play('coin');
        break;
      case 'end': break;
    }
  }

  function toast(text, kind, enemyType) {
    if (!text) return;
    const n = document.createElement('div');
    n.className = 'toast toast-' + (kind || 'info');
    n.innerHTML = (enemyType ? '<canvas></canvas>' : '') + '<span>' + esc(text) + '</span>';
    el.toasts.appendChild(n);
    if (enemyType) RG.Sprites.enemyIcon(n.querySelector('canvas'), enemyType);
    while (el.toasts.children.length > 3) el.toasts.firstChild.remove();
    setTimeout(() => n.classList.add('out'), kind === 'enemy' || kind === 'danger' ? 5200 : 3200);
    setTimeout(() => n.remove(), kind === 'enemy' || kind === 'danger' ? 5700 : 3700);
  }

  let bannerTimer;
  function showBanner(title, sub, kind) {
    el.banner.className = 'banner';
    el.banner.innerHTML = '<b>' + esc(title) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '');
    void el.banner.offsetWidth;
    el.banner.className = 'banner show ' + (kind || '');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => el.banner.classList.remove('show'), kind === 'boss' ? 3000 : 1800);
  }

  /* ---------------- Overlays ---------------- */
  function showPauseMenu() {
    const s = RG.Game.save.settings;
    el.overlay.innerHTML = '<div class="modal">' +
      '<h2>Paused</h2><p class="modal-sub">Stage ' + U.levelLabel(level.mapIdx, level.lvlIdx) + ': ' + esc(level.name) + '</p>' +
      '<div class="modal-actions col"><button class="btn btn-gold btn-lg" data-ov="resume">Resume</button>' +
      '<button class="btn" data-ov="restart">Restart stage</button>' +
      '<button class="btn" data-ov="quit">Leave battle</button></div>' +
      '<div class="quick-set"><label><input type="checkbox" data-qs="muted"' + (s.muted ? ' checked' : '') + '> Mute</label>' +
      '<label><input type="checkbox" data-qs="damageNumbers"' + (s.damageNumbers ? ' checked' : '') + '> Damage numbers</label>' +
      '<label><input type="checkbox" data-qs="showGrid"' + (s.showGrid ? ' checked' : '') + '> Build grid</label></div>' +
      '<p class="modal-hint">Leaving or restarting forfeits this attempt. Nothing is lost from your campaign.</p></div>';
    el.overlay.classList.remove('hidden');
    el.overlay.querySelectorAll('[data-qs]').forEach(cb => cb.addEventListener('change', () => {
      s[cb.dataset.qs] = cb.checked;
      if (cb.dataset.qs === 'damageNumbers') battle.opts.damageNumbers = cb.checked;
      RG.Audio.apply(s); RG.Game.persist();
    }));
  }

  function showEnd() {
    st.endShown = true;
    const b = battle, save = RG.Game.save, m = level.mapIdx, l = level.lvlIdx;
    save.stats.kills += b.stats.kills;
    let html;
    if (b.result === 'victory') {
      const stars = P.starsFor(b.lives, b.maxLives);
      const before = RG.TOWER_ORDER.filter(id => P.heroReqMet(save, id));
      const res = P.recordVictory(save, m, l, stars);
      if (m === 0 && l === 0) save.seenTutorial = true;
      RG.Game.persist();
      const newHeroes = RG.TOWER_ORDER.filter(id => !save.heroes[id].unlocked && P.heroReqMet(save, id) && !before.includes(id));
      const next = P.nextStage(m, l);
      const lines = [];
      if (res.starGain) lines.push(['Stars earned', res.starGain]);
      if (res.replay) lines.push(['Replay reward', res.replay]);
      if (res.mapBonus) lines.push(['Region conquered', res.mapBonus]);
      html = '<div class="modal end victory' + (level.isBoss ? ' boss-win' : '') + '">' +
        '<div class="end-rays"></div><h2>' + (level.isBoss ? 'Region liberated' : 'Victory') + '</h2>' +
        '<p class="modal-sub">Stage ' + U.levelLabel(m, l) + ': ' + esc(level.name) + '</p>' +
        '<div class="end-stars">' + [1, 2, 3].map(i => '<span class="big-star' + (i <= stars ? ' on' : '') + '" style="--i:' + i + '">' + RG.ICONS.star + '</span>').join('') + '</div>' +
        '<p class="end-lives">' + b.lives + ' of ' + b.maxLives + ' lives kept' + (stars < 3 ? ' · keep ' + Math.ceil(b.maxLives * C.STARS[0]) + ' for 3 stars' : '') + '</p>' +
        '<div class="end-reward">' + RG.icon('crystal') + '<b>+' + res.crystals + '</b><span>crystals</span></div>' +
        (lines.length ? '<ul class="end-lines">' + lines.map(([k, v]) => '<li><span>' + k + '</span><b>+' + v + '</b></li>').join('') + '</ul>' : '<p class="end-note">You already earned every star here.</p>') +
        '<ul class="end-stats"><li>' + b.stats.kills + ' enemies slain</li><li>' + U.fmt(b.stats.goldEarned) + ' gold earned</li></ul>' +
        (res.newlyUnlocked ? '<p class="end-unlock">' + (res.newlyUnlocked.l === 0 ? 'New region unlocked: ' + esc(RG.MAPS[res.newlyUnlocked.m].name) : 'Stage ' + U.levelLabel(res.newlyUnlocked.m, res.newlyUnlocked.l) + ' unlocked') + '</p>' : '') +
        (newHeroes.length ? '<p class="end-unlock hero">' + newHeroes.map(id => RG.TOWERS[id].name).join(' and ') + ' can now be recruited on the Heroes screen.</p>' : '') +
        '<div class="modal-actions">' +
        (next ? '<button class="btn btn-gold btn-lg" data-ov="next" data-m="' + next.m + '" data-l="' + next.l + '">Next stage</button>' : '<button class="btn btn-gold btn-lg" data-ov="quit">Campaign complete</button>') +
        '<button class="btn" data-ov="restart">Play again</button><button class="btn" data-ov="heroes">Heroes</button><button class="btn" data-ov="quit">Stage map</button></div></div>';
    } else {
      RG.Game.persist();
      html = '<div class="modal end defeat"><h2>The gate has fallen</h2>' +
        '<p class="modal-sub">Stage ' + U.levelLabel(m, l) + ': ' + esc(level.name) + ' · reached wave ' + (b.waveIdx + 1) + ' of ' + b.nWaves + '</p>' +
        '<p class="end-tip">' + defeatTip(b) + '</p>' +
        '<ul class="end-stats"><li>' + b.stats.kills + ' enemies slain</li><li>' + b.stats.leaked + ' got through</li></ul>' +
        '<div class="modal-actions"><button class="btn btn-gold btn-lg" data-ov="restart">Try again</button><button class="btn" data-ov="heroes">Upgrade heroes</button><button class="btn" data-ov="quit">Stage map</button></div></div>';
    }
    el.overlay.innerHTML = html;
    el.overlay.classList.remove('hidden');
    RG.Audio.startMusic('menu');
  }

  function defeatTip(b) {
    const types = Array.from(b.seen);
    if (types.some(t => RG.ENEMIES[t].boss)) return 'Bosses are tough: stack your best towers along the end of their route, upgrade them fully, and save Divine Smite for the boss.';
    if (types.some(t => RG.ENEMIES[t].flying)) return 'Flyers skip the road and follow the dotted sky route. Put Archers or Mages along it.';
    if (types.includes('orc') || types.includes('iceWraith')) return 'Armored enemies shrug off arrows. Mages and Lich curses pierce armor.';
    if (types.includes('wolf')) return 'Wolves outrun slow towers. Mage frost and Necromancer skeletons hold them in range.';
    return 'Build near the bends of the road where towers can hit enemies twice, and upgrade a few strong towers rather than spreading thin.';
  }

  function onOverlayClick(e) {
    const b = e.target.closest('[data-ov]');
    if (!b) return;
    RG.Audio.play('click');
    switch (b.dataset.ov) {
      case 'resume': togglePause(); break;
      case 'restart': open(level.mapIdx, level.lvlIdx); break;
      case 'next': open(+b.dataset.m, +b.dataset.l); break;
      case 'heroes': close('heroes'); break;
      case 'quit': close('levels', level.mapIdx); break;
    }
  }

  /* ---------------- Tutorial (stage 1-1, first time) ---------------- */
  const TUT = [
    { on: 'select', text: 'Pick the Archer in the build bar (or press 1). The number shows its gold cost.' },
    { on: 'place', text: 'Click a grass tile next to the road. The ring shows its range.' },
    { on: 'wave', text: 'Press Start battle when you\'re ready. Enemies walk the road toward your castle.' },
    { on: 'upgrade', text: 'Click a tower to upgrade it or change its targeting. Build more as gold comes in.', optional: true },
  ];
  function startTutorial() { st.tut = 0; renderTutorial(); }
  // (st.tut is reset to null in open(), which also hides any leftover hint)
  function renderTutorial() {
    if (st.tut === null || st.tut >= TUT.length) { el.tutorial.classList.add('hidden'); return; }
    el.tutorial.innerHTML = '<span class="tut-step">' + (st.tut + 1) + '/' + TUT.length + '</span>' + TUT[st.tut].text;
    el.tutorial.classList.remove('hidden');
    if (TUT[st.tut].optional) setTimeout(() => { if (st.tut === TUT.length - 1) { st.tut = null; renderTutorial(); } }, 9000);
  }
  function tutorialEvent(ev) {
    if (st.tut === null) return;
    if (TUT[st.tut] && TUT[st.tut].on === ev) { st.tut++; renderTutorial(); }
  }

  return { init, open, close, tick, active: () => !!battle && !el.root.classList.contains('hidden'), get battle() { return battle; }, _state: st };
})();

</script>
  <script>/* js/main.js */
/* =====================================================================
 * Realm Guardians — main.js
 * Boots the game: loads the save, wires audio unlock, shows the menu
 * and runs the requestAnimationFrame loop.
 * ===================================================================== */

RG.Game = {
  save: null,
  persist() { RG.Save.save(this.save); },
};

(function boot() {
  RG.Game.save = RG.Save.load();
  RG.Audio.apply(RG.Game.save.settings);

  RG.UI.init();
  RG.BattleUI.init();
  RG.UI.show('menu');

  // Browsers only allow audio after a user gesture.
  const unlockAudio = () => { RG.Audio.ensure(); };
  window.addEventListener('pointerdown', unlockAudio, { capture: true });
  window.addEventListener('keydown', unlockAudio, { capture: true });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    try {
      RG.BattleUI.tick(dt);
    } catch (err) {
      // Surface the error once instead of failing silently every frame.
      console.error('[Realm Guardians] frame error', err);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
