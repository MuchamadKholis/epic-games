<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1028">
  <title>Eldoria: Pet Guardians</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
:root { --bg: #0b1028; --panel: rgba(18, 26, 64, 0.94); --line: rgba(255, 220, 140, 0.35); --gold: #ffc94a; --gold-hi: #ffe08a; --text: #f4efe2; --muted: #a8b0cc; --green: #5fd17a; --red: #ff5a4a; --display: 'Cinzel', Georgia, serif; --body: 'Nunito', system-ui, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font-family: var(--body); font-weight: 900; color: var(--text); cursor: pointer; border: 0; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 14px; background: linear-gradient(180deg, #3a4a8a, #26306a); border: 2px solid rgba(255,255,255,0.15); font-size: 0.95rem; box-shadow: 0 3px 0 rgba(0,0,0,0.35); display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn:disabled { opacity: 0.45; }
.btn-gold { background: linear-gradient(180deg, #ffe08a, #e0a52a); color: #3a2204; border-color: #fff4c8; }
.btn-gem { background: linear-gradient(180deg, #7affc8, #2aa87a); color: #06301f; }
.btn-red { background: linear-gradient(180deg, #ff7a6a, #c22e20); }
.btn-lg { min-height: 58px; font-size: 1.25rem; padding: 10px 28px; border-radius: 18px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.screen.home { background: radial-gradient(ellipse at 50% 30%, #2a3a7a 0%, #0b1028 70%); }
.topbar { display: flex; gap: 6px; padding: 8px; align-items: center; justify-content: space-between; }
.res { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 900; font-size: 0.85rem; white-space: nowrap; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); font-size: 1.1rem; }
.title { text-align: center; padding-top: 10vh; }
.title h1 { font-family: var(--display); font-size: clamp(2rem, 9vw, 3.6rem); margin: 0; color: var(--gold-hi); text-shadow: 0 4px 0 #6a3a0a, 0 0 30px rgba(255,200,80,0.5); line-height: 1.05; }
.title h1 small { display: block; font-size: 0.45em; color: #bfe0ff; letter-spacing: 0.2em; text-shadow: none; }
.title p { color: var(--muted); max-width: 30rem; margin: 14px auto; padding: 0 16px; }
.title-pets { display: flex; justify-content: center; gap: 4px; margin: 12px 0 18px; }
.title-pets canvas { width: 70px; height: 70px; }
.content { flex: 1; overflow-y: auto; padding: 8px 12px 100px; }
.chapter { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px; max-width: 520px; margin: 0 auto; }
.chapter-head { display: flex; align-items: center; gap: 8px; }
.chapter-head h2 { flex: 1; text-align: center; font-family: var(--display); color: var(--gold-hi); margin: 0; font-size: 1.3rem; }
.chapter-art { width: 100%; height: 120px; border-radius: 12px; margin: 10px 0; object-fit: cover; display: block; }
.stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.stage { aspect-ratio: 1; border-radius: 14px; background: #26306a; border: 2px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.05rem; padding: 0; }
.stage small { font-size: 0.62rem; color: var(--gold); letter-spacing: -1px; }
.stage.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,201,74,0.5); }
.stage.boss { background: #5a1a28; }
.stage.locked { opacity: 0.35; }
.play-row { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.nav { position: absolute; left: 6px; right: 6px; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); display: flex; gap: 4px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 4px; max-width: 560px; margin: 0 auto; }
.nav button { flex: 1; min-height: 56px; border-radius: 14px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.72rem; gap: 2px; }
.nav button b { font-size: 1.35rem; }
.nav button.on { background: linear-gradient(180deg, #ffe08a, #e0a52a); color: #3a2204; }
.dot { color: var(--red); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 760px; margin: 0 auto; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.card canvas { width: 96px; height: 96px; }
.card.locked canvas { filter: brightness(0) opacity(0.4); }
.card b { font-size: 1rem; } .card .muted { font-size: 0.78rem; }
.rar { font-size: 0.72rem; font-weight: 900; }
.stars { color: var(--gold); letter-spacing: 1px; }
.team { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
.slot { width: 74px; height: 86px; border-radius: 14px; border: 2px dashed var(--line); background: rgba(255,255,255,0.04); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; }
.slot canvas { width: 64px; height: 64px; }
.muted { color: var(--muted); }
.good { color: var(--green); } .warn { color: #ffb86a; }
h3.sec { font-family: var(--display); color: var(--gold-hi); text-align: center; margin: 10px 0; }
.eggs { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.egg { width: 160px; text-align: center; }
.egg .shell { width: 100px; height: 130px; margin: 0 auto 8px; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; position: relative; box-shadow: inset -12px -14px 0 rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.4); }
.egg .shell.common { background: radial-gradient(circle at 35% 30%, #fff, #b8e08a 60%, #6aa83a); }
.egg .shell.mystic { background: radial-gradient(circle at 35% 30%, #fff, #c8a8ff 55%, #6a3ad8); box-shadow: inset -12px -14px 0 rgba(0,0,0,0.18), 0 0 30px rgba(180,120,255,0.7); }
.shake { animation: shake 0.12s 8 alternate; }
@keyframes shake { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 6px; right: 6px; display: flex; gap: 6px; align-items: center; }
.hud-top .grow { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.bar { height: 10px; border-radius: 999px; background: rgba(0,0,0,0.5); overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #5fd17a, #b8ff8a); transition: width 0.15s; }
.bar.xp i { background: linear-gradient(90deg, #5fb0ff, #b8e0ff); }
.bar.boss i { background: linear-gradient(90deg, #ff3a2a, #ff9a6a); }
.hud-lbl { font-size: 0.72rem; font-weight: 900; display: flex; justify-content: space-between; text-shadow: 0 1px 2px #000; }
.boss-bar { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 60px); left: 50%; transform: translateX(-50%); width: min(320px, 80%); }
.ult { position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: 76px; height: 76px; border-radius: 50%; font-size: 1.8rem; background: conic-gradient(#ffd34a var(--p), rgba(0,0,0,0.6) 0); border: 3px solid #fff4c8; display: grid; place-items: center; }
.ult span { position: absolute; bottom: -18px; font-size: 0.65rem; white-space: nowrap; text-shadow: 0 1px 2px #000; }
.ult.ready { animation: pulse 0.8s infinite alternate; box-shadow: 0 0 24px #ffd34a; }
@keyframes pulse { to { transform: scale(1.08); } }
.skills-mini { position: absolute; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-wrap: wrap; gap: 3px; max-width: 60%; font-size: 0.9rem; pointer-events: none; }
.skills-mini span { background: rgba(0,0,0,0.5); border-radius: 8px; padding: 1px 5px; }
.banner { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 1.8rem; color: var(--gold-hi); text-shadow: 0 3px 0 #000, 0 0 20px rgba(255,200,80,0.6); pointer-events: none; animation: fade 1.6s forwards; }
@keyframes fade { 0% { opacity: 0; transform: scale(0.8); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
.modal { position: absolute; inset: 0; background: rgba(5, 8, 24, 0.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal-card { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 18px; width: min(460px, 100%); max-height: 92vh; overflow-y: auto; text-align: center; }
.modal-card h2 { font-family: var(--display); color: var(--gold-hi); margin: 0 0 8px; }
.cards { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.skill { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; border-radius: 16px; background: linear-gradient(180deg, #34428a, #222c66); border: 2px solid rgba(255,255,255,0.18); }
.skill b { display: block; font-size: 1.05rem; } .skill .ic { font-size: 2rem; width: 44px; text-align: center; }
.skill:hover { border-color: var(--gold); }
.big-stars { font-size: 2.6rem; letter-spacing: 6px; color: var(--gold); }
.big-stars .off { color: rgba(255,255,255,0.2); }
.rw { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.toasts { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 90px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; }
.toast { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 900; font-size: 0.85rem; animation: fade 2.4s forwards; }
input[type=text] { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: rgba(0,0,0,0.35); color: var(--text); font: 800 1rem var(--body); text-transform: uppercase; user-select: text; -webkit-user-select: text; }
.hero-card.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,201,74,0.4); }
@media (min-width: 900px) { .content { padding-bottom: 110px; } }

</style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="screen" class="screen"></div>
    <div id="hud" class="hud hidden"></div>
    <div id="modal" class="modal hidden"></div>
    <div id="toasts" class="toasts"></div>
  </div>
  <script>
/* js/shared/defs.js */
/* =====================================================================
 * Eldoria — data/defs.js
 * Global config + every data-driven definition in the game.
 * Ranges and speeds are in TILES; the engine converts to pixels.
 * Add content here; the engine, UI and save system pick it up.
 * ===================================================================== */
window.CH = window.CH || {};

CH.CONFIG = {
  VERSION: '1.0.0',
  SAVE_KEY: 'eldoria.save.v1',
  COLS: 30, ROWS: 22, T: 32,
  STEP: 1 / 60,
  MAX_CASTLE: 8,
  // Buildable kingdom area (cols, rows) for each castle level; it grows when the castle is upgraded.
  AREA: [[14, 12], [16, 13], [18, 14], [20, 15], [22, 16], [24, 17], [26, 18], [26, 18]],
  START_RES: { gold: 1500, wood: 1500, stone: 1000, food: 3000, gems: 200, runes: 0 },
  // ---- World (Eldoria) ----
  HOME_AREA: { x: 1, y: 1, w: 28, h: 20 }, // your buildable kingdom (fixed; the whole map minus a border)
  WORLD_SIZE: 96,          // world map is WORLD_SIZE × WORLD_SIZE tiles
  AI_COUNT: 60,            // AI kingdoms generated (architecture supports many more)
  SEC_PER_TILE: 6,         // base march time per tile (seconds), divided by troop march speed
  ENEMY_WARNING: 150,      // AI attacks on you always give at least this many seconds of warning
  AI_THINK: 120,           // seconds between an AI kingdom's decisions
  OFFLINE_CAP_H: 12,       // offline catch-up is capped (the world "rests" beyond this)
  BEGINNER_MIN: 45,        // beginner protection: first 45 minutes AND castle level < 3
  POST_ATTACK_SHIELD_MIN: 60,  // after you win a defense (90 after a partial loss, 120 after a total loss)
  INCOMING_GAP_MIN: 60,    // minimum gap between two AI attacks on you
  AI_PLAYER_COOLDOWN_H: 3, // one AI won't attack you again for 3h (2h if it holds a grudge)
  MAX_OFFLINE_ATTACKS: 2,
  RAID_TIME: 180,
  WALL_PATH_COST: 7,      // extra A* cost for walking through a wall tile (attackers break it)
  BUILDING_PATH_COST: 22, // extra A* cost for walking through any other building
};

CH.util = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  geo: (base, growth, L) => Math.round(base * Math.pow(growth, L - 1)),
  rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  },
  pick: (arr, rnd) => arr[Math.floor(rnd() * arr.length)],
  // Troops in the thousands: 12.3k / 1.2M
  fmt(n) { n = Math.floor(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(n); },
  time(s) { s = Math.max(0, Math.ceil(s)); if (s < 60) return s + 's'; const m = Math.floor(s / 60); if (m < 60) return m + 'm ' + (s % 60) + 's'; return Math.floor(m / 60) + 'h ' + (m % 60) + 'm'; },
};

const g = CH.util.geo;
const costFn = (gold, wood, stone, gr) => L => ({ gold: gold ? g(gold, gr, L) : 0, wood: wood ? g(wood, gr, L) : 0, stone: stone ? g(stone, gr, L) : 0 });

/* ---------------------------------------------------------------------
 * BUILDINGS
 *  cat: core | econ | storage | army | defense | wall | trap | obstacle | objective
 *  counts[castleLevel-1] = how many you may own at that castle level
 *  cost(L) / time(L): price and seconds to build or upgrade TO level L
 *  Max building level is min(maxLevel, castleLevel + 1) (castle: maxLevel)
 * ------------------------------------------------------------------- */
CH.BUILDINGS = {
  castle: { name: 'Castle', cat: 'core', size: 3, unlock: 1, counts: [1, 1, 1, 1, 1, 1, 1, 1], maxLevel: 8,
    cost: costFn(450, 450, 300, 2.05), time: L => g(12, 1.75, L - 1), hp: L => g(2600, 1.35, L),
    cap: L => g(6000, 1.6, L), loot: 0.3,
    atk: { kind: 'arrow', dmg: L => g(20, 1.3, L), rate: 1.0, range: 5, air: true, ground: true },
    desc: 'The heart of your kingdom. Its garrison of archers defends it. Its level caps every other building and unlocks new structures, regions and modes. If it falls in a defense, the battle is lost.' },
  builderHut: { name: 'Builder Hut', cat: 'core', size: 2, unlock: 1, counts: [2, 2, 3, 3, 3, 4, 4, 5], maxLevel: 1,
    cost: () => ({ gold: 0, wood: 0, stone: 0 }), countCost: n => ({ gold: g(900, 2.6, n - 1), wood: g(600, 2.6, n - 1), stone: 0 }),
    time: () => 5, hp: () => 400, desc: 'Each hut is one builder. More builders let you construct more things at once.' },
  goldMine: { name: 'Gold Mine', cat: 'econ', size: 2, unlock: 1, counts: [1, 2, 2, 3, 3, 3, 4, 4], maxLevel: 8, res: 'gold',
    cost: costFn(0, 140, 50, 1.85), time: L => g(4, 1.8, L), hp: L => g(420, 1.3, L),
    prod: L => g(36, 1.4, L), buf: L => g(36, 1.4, L) * 40, loot: 0.5, desc: 'Digs up gold over time. Tap it to collect.' },
  lumberMill: { name: 'Lumber Mill', cat: 'econ', size: 2, unlock: 1, counts: [1, 2, 2, 3, 3, 3, 4, 4], maxLevel: 8, res: 'wood',
    cost: costFn(140, 0, 50, 1.85), time: L => g(4, 1.8, L), hp: L => g(420, 1.3, L),
    prod: L => g(36, 1.4, L), buf: L => g(36, 1.4, L) * 40, loot: 0.5, desc: 'Cuts wood over time. Tap it to collect.' },
  stoneQuarry: { name: 'Stone Quarry', cat: 'econ', size: 2, unlock: 1, counts: [1, 1, 2, 2, 3, 3, 3, 4], maxLevel: 8, res: 'stone',
    cost: costFn(140, 100, 0, 1.85), time: L => g(5, 1.8, L), hp: L => g(460, 1.3, L),
    prod: L => g(26, 1.4, L), buf: L => g(26, 1.4, L) * 40, loot: 0.5, desc: 'Quarries stone for walls, defenses and research.' },
  goldStorage: { name: 'Gold Vault', cat: 'storage', size: 2, unlock: 1, counts: [1, 1, 2, 2, 2, 3, 3, 3], maxLevel: 8, res: 'gold',
    cost: costFn(0, 220, 120, 1.9), time: L => g(5, 1.8, L), hp: L => g(700, 1.3, L), cap: L => g(2000, 1.7, L), loot: 0.25,
    desc: 'Raises how much gold you can hold.' },
  woodStorage: { name: 'Timber Yard', cat: 'storage', size: 2, unlock: 1, counts: [1, 1, 2, 2, 2, 3, 3, 3], maxLevel: 8, res: 'wood',
    cost: costFn(220, 0, 120, 1.9), time: L => g(5, 1.8, L), hp: L => g(700, 1.3, L), cap: L => g(2000, 1.7, L), loot: 0.25,
    desc: 'Raises how much wood you can hold.' },
  stoneStorage: { name: 'Stone Depot', cat: 'storage', size: 2, unlock: 1, counts: [1, 1, 1, 2, 2, 2, 3, 3], maxLevel: 8, res: 'stone',
    cost: costFn(220, 160, 0, 1.9), time: L => g(5, 1.8, L), hp: L => g(800, 1.3, L), cap: L => g(1600, 1.7, L), loot: 0.25,
    desc: 'Raises how much stone you can hold.' },
  barracks: { name: 'Barracks', cat: 'army', size: 2, unlock: 1, counts: [1, 1, 1, 1, 1, 1, 1, 1], maxLevel: 8, trains: 'barracks',
    cost: costFn(180, 260, 0, 1.95), time: L => g(5, 1.8, L), hp: L => g(600, 1.3, L), batch: L => g(60, 1.55, L),
    desc: 'Trains infantry and undead. Higher levels unlock stronger troops, bigger batches and faster training.' },
  archeryRange: { name: 'Archery Range', cat: 'army', size: 2, unlock: 1, counts: [1, 1, 1, 1, 1, 1, 1, 1], maxLevel: 8, trains: 'archeryRange',
    cost: costFn(160, 280, 0, 1.95), time: L => g(5, 1.8, L), hp: L => g(560, 1.3, L), batch: L => g(60, 1.55, L),
    desc: 'Trains archers, crossbowmen, longbowmen and mages.' },
  stable: { name: 'Stable', cat: 'army', size: 2, unlock: 2, counts: [0, 1, 1, 1, 1, 1, 1, 1], maxLevel: 8, trains: 'stable',
    cost: costFn(260, 300, 60, 1.95), time: L => g(8, 1.8, L), hp: L => g(640, 1.3, L), batch: L => g(50, 1.55, L),
    desc: 'Trains cavalry, griffins and dragons.' },
  siegeWorkshop: { name: 'Siege Workshop', cat: 'army', size: 2, unlock: 3, counts: [0, 0, 1, 1, 1, 1, 1, 1], maxLevel: 8, trains: 'siegeWorkshop',
    cost: costFn(300, 400, 200, 1.95), time: L => g(10, 1.8, L), hp: L => g(700, 1.3, L), batch: L => g(30, 1.55, L),
    desc: 'Builds rams, catapults, ballistae, trebuchets and golems: deadly against walls and towers.' },
  farm: { name: 'Farm', cat: 'econ', size: 2, unlock: 1, counts: [2, 2, 3, 3, 4, 4, 5, 5], maxLevel: 8, res: 'food',
    cost: costFn(100, 120, 0, 1.85), time: L => g(4, 1.8, L), hp: L => g(380, 1.3, L),
    prod: L => g(60, 1.4, L), buf: L => g(60, 1.4, L) * 40, loot: 0.5, desc: 'Grows food. Every troop eats food each hour.' },
  granary: { name: 'Granary', cat: 'storage', size: 2, unlock: 1, counts: [1, 1, 2, 2, 2, 3, 3, 3], maxLevel: 8, res: 'food',
    cost: costFn(180, 200, 0, 1.9), time: L => g(5, 1.8, L), hp: L => g(700, 1.3, L), cap: L => g(4000, 1.7, L), loot: 0.25,
    desc: 'Stores food and protects part of it from raiders.' },
  infirmary: { name: 'Infirmary', cat: 'civic', size: 2, unlock: 1, counts: [1, 1, 1, 2, 2, 2, 3, 3], maxLevel: 8,
    cost: costFn(220, 180, 120, 1.9), time: L => g(6, 1.8, L), hp: L => g(600, 1.3, L), beds: L => g(150, 1.6, L),
    desc: 'Wounded troops recover here instead of dying, up to its bed capacity.' },
  watchtower: { name: 'Watchtower', cat: 'civic', size: 2, unlock: 2, counts: [0, 1, 1, 1, 1, 1, 1, 1], maxLevel: 8,
    cost: costFn(250, 250, 150, 1.9), time: L => g(8, 1.8, L), hp: L => g(650, 1.3, L),

  <script>
/* js/shared/art.js */
/* =====================================================================
 * Eldoria — render/art.js
 * All art is drawn in code (2.5D: top-down ground, buildings with height
 * facing the viewer). No image files, no licensing questions.
 * Buildings change look at level tiers 1-2 / 3-5 / 6-8.
 * ===================================================================== */
CH.Art = (function () {
  const TAU = Math.PI * 2, T = CH.CONFIG.T;
  const circle = (c, x, y, r, f) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = f; c.fill(); };
  const ell = (c, x, y, rx, ry, f) => { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fillStyle = f; c.fill(); };
  const rect = (c, x, y, w, h, f) => { c.fillStyle = f; c.fillRect(x, y, w, h); };
  const poly = (c, p, f, s, lw) => { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); if (f) { c.fillStyle = f; c.fill(); } if (s) { c.strokeStyle = s; c.lineWidth = lw || 1; c.stroke(); } };
  const line = (c, a, b, d, e, col, w) => { c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.stroke(); };
  const glow = (c, x, y, r, rgb, a) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  const rrect = (c, x, y, w, h, r, f, s) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); if (f) { c.fillStyle = f; c.fill(); } if (s) { c.strokeStyle = s; c.lineWidth = 1.5; c.stroke(); } };
  const tierOf = L => (L <= 2 ? 0 : L <= 5 ? 1 : 2);
  const STONE = ['#9b8f7a', '#a9a6a0', '#d9d4c8'], STONE_D = ['#6d6352', '#77746e', '#a49e90'];
  const TRIM = ['#6b4a2a', '#5a5f6b', '#d4a843'];

  /** A front-facing block building: walls of height wh, gabled roof of height rh. */
  function house(c, cx, by, w, wh, rh, wall, roof, t, opts = {}) {
    rect(c, cx - w / 2, by - wh, w, wh, wall);
    rect(c, cx - w / 2, by - wh, w, 3, 'rgba(0,0,0,0.15)');
    if (opts.beams) { line(c, cx - w / 2 + 2, by - wh, cx - w / 2 + 2, by, 'rgba(60,35,15,0.6)', 2); line(c, cx + w / 2 - 2, by - wh, cx + w / 2 - 2, by, 'rgba(60,35,15,0.6)', 2); }
    poly(c, [cx - w / 2 - 4, by - wh + 1, cx, by - wh - rh, cx + w / 2 + 4, by - wh + 1], roof, 'rgba(0,0,0,0.35)', 1.2);
    poly(c, [cx, by - wh - rh, cx + w / 2 + 4, by - wh + 1, cx, by - wh + 1], 'rgba(0,0,0,0.14)');
    if (opts.door !== false) { c.beginPath(); c.arc(cx, by - 7, 5, Math.PI, 0); c.lineTo(cx + 5, by); c.lineTo(cx - 5, by); c.closePath(); c.fillStyle = '#3a2614'; c.fill(); }
    if (t >= 1) line(c, cx - w / 2 - 4, by - wh + 1, cx + w / 2 + 4, by - wh + 1, TRIM[t], 2);
  }
  function pad(c, x, y, s, t) {
    rrect(c, x + 2, y + 3, s - 4, s - 4, 6, 'rgba(0,0,0,0.25)');
    rrect(c, x + 2, y + 2, s - 4, s - 4, 6, t >= 2 ? '#bdb5a3' : t ? '#a59c88' : '#8f7f62');
    rrect(c, x + 5, y + 5, s - 10, s - 10, 4, t >= 2 ? '#cfc8b8' : t ? '#b6ae9b' : '#9f906f');
  }
  function flag(c, x, y, col, time) { line(c, x, y, x, y - 16, '#4a3420', 1.5); const w = Math.sin(time * 4 + x) * 1.5; poly(c, [x, y - 16, x + 10, y - 14 + w, x, y - 11], col); }
  function stars(c, cx, y, L) { c.font = '700 9px system-ui, sans-serif'; c.textAlign = 'center'; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.65)'; c.strokeText(L, cx, y); c.fillStyle = '#ffe08a'; c.fillText(L, cx, y); }

  /* ---------------- Buildings ---------------- */
  const BLD = {
    castle(c, x, y, s, L, t, time) {
      const tt = tierOf(L), cx = x + s / 2, by = y + s - 10;
      pad(c, x, y, s, tt);
      const st = STONE[tt], sd = STONE_D[tt], roof = ['#3b5aa8', '#a83b3b', '#5b3aa8'][tt];
      // back towers
      for (const dx of [-30, 30]) { rect(c, cx + dx - 9, by - 52 - L * 2, 18, 30, sd); poly(c, [cx + dx - 11, by - 52 - L * 2, cx + dx, by - 72 - L * 2, cx + dx + 11, by - 52 - L * 2], roof); }
      // curtain wall
      rect(c, cx - 40, by - 30, 80, 30, st); rect(c, cx - 40, by - 30, 80, 4, 'rgba(0,0,0,0.12)');
      for (let i = -40; i < 40; i += 9) rect(c, cx + i, by - 36, 6, 6, st);
      c.strokeStyle = 'rgba(0,0,0,0.13)'; c.lineWidth = 1;
      for (let r = 0; r < 4; r++) for (let k = -40 + (r % 2) * 5; k < 38; k += 10) c.strokeRect(cx + k, by - 28 + r * 7, 10, 7);
      // keep
      rect(c, cx - 16, by - 56 - L * 3, 32, 28 + L * 3, st);
      for (let i = -16; i < 16; i += 8) rect(c, cx + i, by - 61 - L * 3, 5, 5, st);
      poly(c, [cx - 19, by - 58 - L * 3, cx, by - 84 - L * 4, cx + 19, by - 58 - L * 3], roof, 'rgba(0,0,0,0.35)', 1.2);
      rect(c, cx - 3, by - 46 - L * 3, 6, 8, '#2a1e12');
      if (tt >= 1) { line(c, cx - 40, by - 30, cx + 40, by - 30, TRIM[tt], 2); line(c, cx - 16, by - 56 - L * 3, cx + 16, by - 56 - L * 3, TRIM[tt], 2); }
      // gate
      c.beginPath(); c.arc(cx, by - 10, 8, Math.PI, 0); c.lineTo(cx + 8, by); c.lineTo(cx - 8, by); c.closePath(); c.fillStyle = '#2a1d12'; c.fill();
      for (let i = -6; i <= 6; i += 4) line(c, cx + i, by - 16, cx + i, by, '#6b5233', 1.2);
      // front towers
      for (const dx of [-40, 40]) { rect(c, cx + dx - 8, by - 40, 16, 40, st); rect(c, cx + dx - 8, by - 40, 16, 40, 'rgba(0,0,0,0.06)'); poly(c, [cx + dx - 10, by - 40, cx + dx, by - 56, cx + dx + 10, by - 40], roof, 'rgba(0,0,0,0.3)', 1); }
      flag(c, cx, by - 84 - L * 4, tt === 2 ? '#e2b65c' : '#d4a843', time);
      if (tt === 2) { glow(c, cx, by - 70 - L * 4, 14, '255,215,120', 0.4); }
    },
    builderHut(c, x, y, s, L, t, time) {

/* js/shared/audio.js */
/* =====================================================================
 * Crownhold — core/audio.js
 * Every sound is synthesised with the Web Audio API: no audio files to
 * download or license. Music is a small generative modal sequencer.
 * The AudioContext is created on the first user gesture (browser rule).
 * To swap in recorded audio later, replace the bodies of SFX entries.
 * ===================================================================== */

CH.Audio = (function () {
  let ctx = null, master, sfxGain, musicGain, noiseBuf = null;
  let settings = { music: 0.45, sfx: 0.7, muted: false };
  const last = {};
  const music = { timer: null, theme: null, step: 0, next: 0, pending: null };

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.connect(ctx.destination);
    sfxGain = ctx.createGain(); sfxGain.connect(master);
    musicGain = ctx.createGain(); musicGain.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    apply();
    if (music.pending) { const p = music.pending; music.pending = null; startMusic(p); }
    return true;
  }

  function apply(s) {
    if (s) settings = s;
    if (!ctx) return;
    master.gain.value = settings.muted ? 0 : 1;
    sfxGain.gain.value = settings.sfx * 0.9;
    musicGain.gain.value = settings.music * 0.32;

    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, freq, vol, type, delay, dest) {
    const t = ctx.currentTime + (delay || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || sfxGain);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  const SFX = {
    click() { tone(720, 0.05, 'triangle', 0.1); },
    bow() { noise(0.07, 2600, 0.14, 'bandpass'); tone(520, 0.06, 'triangle', 0.04, 260); },
    magic() { tone(700, 0.16, 'sine', 0.07, 1400); tone(1050, 0.12, 'triangle', 0.03, 1800, 0.02); },
    zap() { noise(0.1, 4500, 0.09, 'highpass'); tone(1800, 0.06, 'square', 0.02, 900); },
    nova() { tone(300, 0.4, 'sine', 0.12, 900); noise(0.3, 1800, 0.1, 'bandpass'); },
    cannon() { noise(0.18, 500, 0.22); tone(140, 0.15, 'sine', 0.18, 60); },
    boom() { noise(0.4, 700, 0.28); tone(90, 0.3, 'sine', 0.24, 35); },
    curse() { tone(240, 0.22, 'sawtooth', 0.035, 120); tone(180, 0.25, 'sine', 0.05, 90); },
    bone() { tone(320, 0.07, 'square', 0.03, 180); },
    summon() { tone(150, 0.35, 'sawtooth', 0.05, 330); noise(0.25, 900, 0.07, 'bandpass'); },
    death() { tone(280, 0.1, 'square', 0.03, 110); },
    leak() { tone(220, 0.3, 'sawtooth', 0.1, 90); noise(0.2, 300, 0.12); },
    place() { noise(0.12, 320, 0.22); tone(150, 0.14, 'sine', 0.18, 80); },
    upgrade() { [523, 659, 784].forEach((f, i) => tone(f, 0.16, 'triangle', 0.09, null, i * 0.07)); },
    sell() { tone(880, 0.07, 'triangle', 0.09); tone(660, 0.12, 'triangle', 0.09, null, 0.06); },
    coin() { tone(1250, 0.05, 'square', 0.03); tone(1650, 0.08, 'square', 0.03, null, 0.05); },
    wave() { tone(196, 0.55, 'sawtooth', 0.06); tone(294, 0.55, 'sawtooth', 0.05, null, 0.06); },
    warcry() { tone(110, 0.5, 'sawtooth', 0.12, 160); noise(0.4, 600, 0.1, 'bandpass'); },
    boss() { tone(65, 1.3, 'sawtooth', 0.16, 42); noise(1.1, 220, 0.18); },
    bossDeath() { noise(1.3, 500, 0.35); tone(95, 1.1, 'sine', 0.3, 30); [392, 494, 587, 784].forEach((f, i) => tone(f, 0.4, 'triangle', 0.08, null, 0.5 + i * 0.12)); },
    smite() { noise(0.6, 3200, 0.22, 'highpass'); tone(1400, 0.45, 'sine', 0.1, 220); tone(110, 0.5, 'sine', 0.2, 50); },
    fire() { noise(0.7, 900, 0.22, 'bandpass'); tone(160, 0.6, 'sawtooth', 0.05, 80); },
    stun() { tone(520, 0.28, 'sine', 0.06, 160); noise(0.2, 2000, 0.06, 'highpass'); },
    sword() { noise(0.06, 3200, 0.08, 'highpass'); tone(900, 0.05, 'triangle', 0.03, 500); },
    smash() { noise(0.25, 300, 0.25); tone(90, 0.2, 'sine', 0.2, 45); },
    deploy() { tone(330, 0.08, 'triangle', 0.08); tone(495, 0.08, 'triangle', 0.06, null, 0.05); },
    heroDeploy() { [392, 523, 659].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.06)); },
    heroDown() { tone(300, 0.6, 'sawtooth', 0.08, 90); },
    roar() { noise(0.9, 260, 0.25); tone(85, 0.9, 'sawtooth', 0.14, 50); tone(130, 0.7, 'square', 0.04, 70, 0.05); },
    collapse() { noise(0.5, 420, 0.28); tone(70, 0.4, 'sine', 0.2, 35); },
    wallBreak() { noise(0.22, 900, 0.16, 'bandpass'); },
    spike() { noise(0.08, 4000, 0.12, 'highpass'); tone(700, 0.08, 'square', 0.04, 300); },
    frost() { tone(1500, 0.18, 'sine', 0.05, 2400); noise(0.15, 6000, 0.05, 'highpass'); },
    ballista() { noise(0.1, 1200, 0.15, 'bandpass'); tone(200, 0.15, 'triangle', 0.1, 90); },
    mortar() { noise(0.2, 300, 0.2); tone(120, 0.2, 'sine', 0.16, 60); },
    fireShot() { noise(0.18, 1400, 0.1, 'bandpass'); },
    star() { [784, 988, 1319].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.07)); },
    horn() { tone(196, 0.7, 'sawtooth', 0.07); tone(294, 0.7, 'sawtooth', 0.05, null, 0.06); },
    heal() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'sine', 0.05, null, i * 0.05)); },
    freeze() { noise(0.5, 5000, 0.12, 'highpass'); tone(1800, 0.4, 'sine', 0.05, 900); },
    collect() { tone(1050, 0.06, 'square', 0.04); tone(1400, 0.08, 'square', 0.04, null, 0.05); tone(1750, 0.08, 'triangle', 0.04, null, 0.1); },
    build() { noise(0.1, 500, 0.18); tone(220, 0.1, 'triangle', 0.1, 140); noise(0.1, 500, 0.15, 'lowpass', 0.15); },
    victory() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, 'triangle', 0.12, null, i * 0.13)); },
    defeat() { [392, 349, 311, 262].forEach((f, i) => tone(f, 0.55, 'sawtooth', 0.06, null, i * 0.24)); },
    error() { tone(160, 0.12, 'square', 0.05); },
    unlock() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, null, i * 0.08)); },
  };
  const GAP = { sword: 0.04, smash: 0.12, deploy: 0.05, collapse: 0.1, wallBreak: 0.06, frost: 0.08, mortar: 0.1, fireShot: 0.06, ballista: 0.1, bow: 0.05, magic: 0.06, death: 0.035, boom: 0.06, cannon: 0.08, zap: 0.07, bone: 0.08, curse: 0.1, summon: 0.2, coin: 0.05, leak: 0.1, stun: 0.15 };

  function play(name) {
    if (!ctx || settings.muted || settings.sfx <= 0) return;

  }

  /* ---------- Generative music ---------- */
  const DORIAN = [0, 2, 3, 5, 7, 9, 10];
  const PHRYG = [0, 1, 3, 5, 7, 8, 10];
  const THEMES = {
    menu: { root: 50, scale: DORIAN, tempo: 0.36, prog: [0, 5, 3, 4], pattern: [0, 2, 4, 2, 7, 4, 2, 4] },
    battle: { root: 50, scale: DORIAN, tempo: 0.24, prog: [0, 0, 5, 6], pattern: [0, 4, 7, 4, 2, 4, 7, 9] },

/* =====================================================================
 * Ruang Main portal codes.
 * Codes made in the portal's admin menu are cached in localStorage by the
 * portal page (key "ruangmain.codes"). Games served from the same portal
 * check this list after their own built-in codes. Only a hash of each
 * code is stored here, never the code itself.
 * ===================================================================== */
var RMCodes = (function () {
  const KEY = 'ruangmain.codes';
  const norm = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '');
  function fnv(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); }
  /** Portal hash of a code (same function in the portal page). */
  const hash = code => { const n = norm(code); return fnv('ruangmain:' + n) + fnv(n + ':rm'); };
  function list() { try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); return d && Array.isArray(d.codes) ? d.codes : []; } catch (e) { return []; } }
  /** Returns a game-ready entry { hash, label, reward, start, expires } or null. */
  function find(code, game) {
    const n = norm(code); if (!n) return null;
    const ph = hash(n), e = list().find(c => c && c.ph === ph && c.active !== false && (c.game === 'all' || c.game === game));
    if (!e) return null;
    const reward = {}; for (const k in (e.reward || {})) { const v = Math.floor(+e.reward[k]); if (v > 0) reward[k] = v; }
    return { hash: 'rm:' + ph, label: e.label || 'Gift', reward, start: e.start || null, expires: e.expires || null };
  }
  return { find, hash, norm };
})();

/* =====================================================================

<script>

/* =====================================================================
 * Eldoria: Pet Guardians — effects.js

    if (pct < 0.6) { c.strokeStyle = 'rgba(30,20,10,0.7)'; c.lineWidth = 1.3; for (let i = 0; i < (pct < 0.3 ? 6 : 3); i++) { const x = 50 + i * 47; c.beginPath(); c.moveTo(x, WY - 12); c.lineTo(x + 5, WY - 4); c.lineTo(x - 2, WY + 2); c.lineTo(x + 4, WY + 8); c.stroke(); } }
    if (pct < 0.4) for (let i = 0; i < 4; i++) A.smokeFx(c, 40 + i * 90, WY - 10, 14, t + i, 0.45);
  }

  function draw(cv, g, ui) {
    const c = cv.getContext('2d'), t = g.t;
    PG.FX.update(g);
    const k = Math.min(cv.width / W, cv.height / H);
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#0b1028'; c.fillRect(0, 0, cv.width, cv.height);
    const ox = (cv.width - W * k) / 2, oy = (cv.height - H * k) / 2, [sx, sy] = PG.FX.shakeOffset();
    c.setTransform(k, 0, 0, k, ox + sx * k, oy + sy * k);
    ui.k = k; ui.ox = ox; ui.oy = oy;
    c.drawImage(background(g.ch, g.c), -8, -8, W + 16, H + 16);
    PG.FX.drawUnder(c, t);
    // splash rings (non-void) on the ground
    for (const f of g.fx) if (f.kind === 'ring' && f.el !== 'void') { const p = 1 - f.t / f.max; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 1 - p; c.translate(f.x, f.y); c.scale(1, 0.45); c.beginPath(); c.arc(0, 0, f.r * (0.4 + p * 0.7), 0, 6.283); c.strokeStyle = ELEMENT_COLOR[f.el] || f.color || '#fff'; c.lineWidth = 4; c.stroke(); c.restore(); }
    // enemies (back to front)
    const es = g.enemies.filter(e => !e.dead).sort((a, b) => a.y - b.y);
    for (const e of es) PG.Monsters.draw(c, e, t);
    // wall, hero, pets
    drawWall(c, g, t);
    for (const p of g.pets) PG.Sprites.pet(c, p.id, p.x, p.y + 2, 17, t + p.bob, { atk: Math.min(1, p.flash / 0.2) });
    PG.Sprites.hero(c, g.hero.id, g.hero.x, g.hero.y + 4, 15, t, { atk: Math.min(1, g.hero.swing / 0.25), hit: g.wall.hit > 0.1 ? 0.35 : 0 });
    // heal links
    for (const f of g.fx) if (f.kind === 'heal') { const p = 1 - f.t / f.max; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 1 - p; A.glow(c, f.x, WY - 6, 60, '160,255,210', 0.5); c.restore(); }
    // projectiles, lightning, impacts, particles
    PG.FX.drawOver(c, g, t);
    // damage numbers
    c.textAlign = 'center';
    for (const tx of g.texts) { const p = 1 - Math.min(1, tx.t / 0.7), sc = tx.crit ? 1 + Math.max(0, 0.25 - p) * 2 : 1; c.globalAlpha = Math.min(1, tx.t * 2.5); c.save(); c.translate(tx.x, tx.y); c.scale(sc, sc); c.font = (tx.crit ? '900 15px ' : '800 10px ') + 'system-ui'; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.75)'; c.strokeText(tx.v, 0, 0); c.fillStyle = tx.crit ? '#ffd34a' : '#ffffff'; c.fillText(tx.v, 0, 0); c.restore(); }
    c.globalAlpha = 1;
    PG.FX.drawScreen(c);
  }
  const hexRgb = h => { if (!h || h[0] !== '#') return '255,255,255'; const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255); };
  /** Small pet portrait for menus. */
  function petIcon(cv, id, t = 0.5) {
    const c = cv.getContext('2d'), s = Math.min(cv.width, cv.height) * 0.3;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    PG.Sprites.pet(c, id, cv.width / 2, cv.height * 0.9, s * 1.15, t);
  }
  function heroIcon(cv, id) {
    const c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    PG.Sprites.hero(c, id, cv.width / 2, cv.height - 8, cv.height * 0.36, 0.3);
  }
  return { draw, drawPet, petIcon, heroIcon, background };
})();

</script>
  <script>
/* js/ui.js */
/* =====================================================================
 * Eldoria: Pet Guardians — ui.js
 * Screens (home, heroes, pets, eggs, upgrades), battle HUD, skill-card
 * picks, results, and the main loop.
 * ===================================================================== */
(function () {
  const S = PG.State, $ = id => document.getElementById(id);
  const fmt = n => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(Math.floor(n)));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = PG.App = { save: S.load(), screen: 'title', game: null, speed: 1, paused: false, chapter: 0, stage: 0, tab: 'home', ui: {} };
  const sfx = n => { if (app.save.settings.sound) CH.Audio.play(n); };
  const persist = () => S.save(app.save);
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; $('toasts').appendChild(d); setTimeout(() => d.remove(), 2400); }
  function fail(r) { toast(r.reason || 'Not possible'); sfx('error'); }
  function modal(html, on) {
    const m = $('modal'); m.innerHTML = '<div class="modal-card">' + html + '</div>'; m.classList.remove('hidden');
    m.onclick = e => { if (e.target.closest('[data-close]')) return closeModal(); if (on) on(e); };
  }
  const closeModal = () => { $('modal').classList.add('hidden'); $('modal').innerHTML = ''; };
  const paint = root => root.querySelectorAll('canvas[data-pet]').forEach(cv => { cv.width = 192; cv.height = 192; PG.Render.petIcon(cv, cv.dataset.pet, (Date.now() / 1000) % 6); });
  const paintHeroes = root => root.querySelectorAll('canvas[data-hero]').forEach(cv => { cv.width = 192; cv.height = 192; PG.Render.heroIcon(cv, cv.dataset.hero); });
  const rwHtml = r => Object.entries(r).filter(([k, v]) => v && typeof v === 'number').map(([k, v]) => '<span class="pill">' + ({ gold: '🪙', gems: '💎', food: '🍖', commonEgg: '🥚', mysticEgg: '🔮' }[k] || '') + ' ' + fmt(v) + '</span>').join('');
  const top = () => '<div class="topbar"><div class="res"><span class="pill">🪙 ' + fmt(app.save.gold) + '</span><span class="pill">💎 ' + fmt(app.save.gems) + '</span><span class="pill">🍖 ' + fmt(app.save.food) + '</span></div><button class="icon-btn" data-a="settings" aria-label="Settings">⚙</button></div>';
  const nav = () => '<nav class="nav">' + [['home', '⚔', 'Battle'], ['heroes', '👑', 'Heroes'], ['pets', '🐾', 'Pets'], ['eggs', '🥚', 'Eggs' + (app.save.eggs.common + app.save.eggs.mystic ? ' <span class="dot">●</span>' : '')], ['upgrade', '🏰', 'Wall']].map(([k, i, n]) => '<button class="' + (app.tab === k ? 'on' : '') + '" data-tab="' + k + '"><b>' + i + '</b>' + n + '</button>').join('') + '</nav>';

  /* ---------------- Screens ---------------- */
  function title() {
    app.screen = 'title';
    $('screen').className = 'screen home';
    $('screen').innerHTML = '<div class="title"><h1><small>ELDORIA</small>Pet Guardians</h1><div class="title-pets">' + ['emberFox', 'moonUnicorn', 'sparkWolf', 'sunPhoenix'].map(p => '<canvas data-pet="' + p + '"></canvas>').join('') + '</div>' +
      '<p>Monsters from every corner of Eldoria — and beyond the realm portals — march on your castle. Hold the wall with your hero and a band of magical pets.</p><button class="btn btn-gold btn-lg" data-a="start">Play</button><p class="muted" style="font-size:.8rem">v' + PG.VERSION + ' · progress saves in this browser</p></div>';
    paint($('screen'));
    $('screen').onclick = e => { if (e.target.closest('[data-a=start]')) { CH.Audio.ensure && CH.Audio.ensure(); sfx('click'); if (app.save.settings.music) CH.Audio.startMusic('menu'); app.chapter = Math.min(PG.CHAPTERS.length - 1, Math.floor(app.save.progress / 10)); app.stage = Math.min(9, app.save.progress % 10); home(); } };
  }
  function home() {
    app.screen = 'menu'; $('hud').classList.add('hidden');
    $('screen').classList.remove('hidden');
    const s = app.save, tab = app.tab;
    let body = '';
    if (tab === 'home') {
      const ch = PG.CHAPTERS[app.chapter];
      const stages = Array.from({ length: 10 }, (_, i) => { const idx = PG.stageIndex(app.chapter, i), st = s.stars[idx] || 0, locked = idx > s.progress;
        return '<button class="stage' + (i === 9 ? ' boss' : '') + (locked ? ' locked' : '') + (i === app.stage ? ' sel' : '') + '" data-stage="' + i + '"' + (locked ? ' disabled' : '') + '>' + (i === 9 ? '💀' : i + 1) + '<small>' + '★'.repeat(st) + '</small></button>'; }).join('');
      const idx = PG.stageIndex(app.chapter, app.stage);
      body = '<div class="chapter"><div class="chapter-head"><button class="icon-btn" data-a="prev"' + (app.chapter ? '' : ' disabled') + '>◀</button><h2>' + (ch.realm || '') + ' ' + (app.chapter + 1) + '. ' + ch.name + '</h2><button class="icon-btn" data-a="next"' + (app.chapter < PG.CHAPTERS.length - 1 && s.progress >= (app.chapter + 1) * 10 ? '' : ' disabled') + '>▶</button></div>' +
        '<canvas class="chapter-art" id="chart"></canvas><div class="stages">' + stages + '</div>' +
        '<p class="muted" style="text-align:center">Stage ' + (app.chapter + 1) + '-' + (app.stage + 1) + (app.stage === 9 ? ' · Boss: ' + CH.ENEMIES[ch.boss].name : '') + ' · Rewards ' + rwHtml(PG.stageReward(idx, 3)) + '</p>' +
        '<div class="play-row"><button class="btn btn-gold btn-lg" data-a="play">⚔ Battle</button></div>' +
        '<div class="row"><button class="btn" data-a="daily">🎁 Daily chest' + (S.dailyReady(s) ? ' <span class="dot">●</span>' : '') + '</button></div></div>';
    } else if (tab === 'heroes') {
      body = '<h3 class="sec">Heroes</h3><div class="grid">' + PG.HERO_ORDER.map(id => { const H = PG.HEROES[id], h = s.heroes[id], sel = s.hero === id;
        return '<div class="card hero-card' + (sel ? ' sel' : '') + (h.unlocked ? '' : ' locked') + '"><canvas data-hero="' + id + '"></canvas><b>' + H.name + '</b><span class="muted">' + H.title + '</span>' +
          (h.unlocked ? '<span>Level ' + h.level + ' · ⚔ ' + fmt(H.dmg * PG.heroMult(h.level)) + '</span><span class="muted">Ultimate: ' + H.ult.name + '</span>' +
            '<button class="btn btn-gold" data-hl="' + id + '">Level up · 🪙' + fmt(PG.heroCost(h.level).gold) + '</button>' + (sel ? '<span class="good">In battle</span>' : '<button class="btn" data-hs="' + id + '">Choose</button>')
            : '<span class="muted">' + H.ult.desc + '</span><button class="btn btn-gold" data-hu="' + id + '">Recruit · ' + (H.unlock.gold ? '🪙' + fmt(H.unlock.gold) : '💎' + H.unlock.gems) + '</button>') + '</div>'; }).join('') + '</div>';
    } else if (tab === 'pets') {
      const slots = S.teamSlots(s);
      body = '<h3 class="sec">Your pet team (' + s.team.length + '/' + slots + ')</h3><div class="team">' + Array.from({ length: 4 }, (_, i) => i < slots ? (s.team[i] ? '<div class="slot"><canvas data-pet="' + s.team[i] + '"></canvas>' + PG.PETS[s.team[i]].name + '</div>' : '<div class="slot">empty</div>') : '<div class="slot muted">🔒 ' + (i === 2 ? 'stage 11' : 'stage 31') + '</div>').join('') + '</div>' +
        '<div class="grid">' + PG.PET_ORDER.map(id => { const P = PG.PETS[id], p = s.pets[id], R = PG.RARITY[P.rarity];
          return '<div class="card' + (p.owned ? '' : ' locked') + '" data-pet-open="' + id + '"><canvas data-pet="' + id + '"></canvas><b>' + P.name + '</b><span class="rar" style="color:' + R.color + '">' + R.name + '</span>' +
            (p.owned ? '<span class="stars">' + '★'.repeat(p.stars) + '</span><span class="muted">Lv ' + p.level + (s.team.includes(id) ? ' · in team' : '') + '</span>' : '<span class="muted">Hatch from eggs</span>') + '</div>'; }).join('') + '</div>';
    } else if (tab === 'eggs') {
      body = '<h3 class="sec">Hatchery</h3><p class="muted" style="text-align:center">Hatch eggs for new pets. A pet you already own gains a ★ (up to 5) — each star adds 30% power.</p><div class="eggs">' +
        Object.entries(PG.EGGS).map(([k, E]) => '<div class="egg"><div class="shell ' + k + '" id="egg-' + k + '"></div><b>' + E.name + '</b><p class="muted" style="font-size:.75rem">' + Object.entries(E.odds).filter(([, v]) => v).map(([r, v]) => PG.RARITY[r].name + ' ' + Math.round(v * 100) + '%').join(' · ') + '</p>' +
          '<button class="btn btn-gold" data-hatch="' + k + '">' + (s.eggs[k] ? 'Hatch (' + s.eggs[k] + ' owned)' : 'Hatch · ' + (E.cost.gold ? '🪙' + fmt(E.cost.gold) : '💎' + E.cost.gems)) + '</button></div>').join('') + '</div>';
    } else if (tab === 'upgrade') {
      const c = S.wallCost(s);
      body = '<h3 class="sec">Castle wall</h3><div class="chapter" style="text-align:center"><p style="font-size:3rem;margin:6px">🏰</p><p><b>Wall level ' + s.wall + '</b></p><p>Health ' + fmt(S.wallMax(s)) + ' · Armor ' + Math.round(Math.min(50, 1.5 * (s.wall - 1))) + '%</p>' +
        '<button class="btn btn-gold btn-lg" data-a="wall"' + (s.wall >= S.WALL_MAX_LEVEL ? ' disabled' : '') + '>Upgrade · 🪙' + fmt(c.gold) + '</button><p class="muted">Tip: replay cleared stages for more gold.</p></div>' +
        '<h3 class="sec">Stats</h3><p class="muted" style="text-align:center">Stages cleared ' + s.stats.stages + ' · Monsters slain ' + fmt(s.stats.kills) + ' · Eggs hatched ' + s.stats.eggs + ' · Bosses ' + s.stats.bosses + '</p>';
    }
    $('screen').className = 'screen home';
    $('screen').innerHTML = top() + '<div class="content">' + body + '</div>' + nav();
    paint($('screen')); paintHeroes($('screen'));
    const cart = $('chart'); if (cart) { cart.width = 520; cart.height = 120; const c = cart.getContext('2d'); c.drawImage(PG.Render.background(PG.CHAPTERS[app.chapter], app.chapter), 0, 120, 720, 300, 0, 0, 520, 120); const bd = CH.ENEMIES[PG.CHAPTERS[app.chapter].boss]; PG.Monsters.draw(c, { type: PG.CHAPTERS[app.chapter].boss, x: 260, y: 114, size: bd.size * 1.25, def: bd, anim: 0.3, swing: 0, facing: 1, hp: 1, maxHp: 1, boss: true, hit: 0 }, 1); }
    $('screen').onclick = onMenu;
  }
  function onMenu(e) {
    const s = app.save, b = e.target.closest('button,[data-pet-open]'); if (!b) return;
    sfx('click');
    if (b.dataset.tab) { app.tab = b.dataset.tab; return home(); }
    if (b.dataset.stage != null) { app.stage = +b.dataset.stage; return home(); }
    if (b.dataset.hl) { const r = S.levelHero(s, b.dataset.hl); if (!r.ok) return fail(r); sfx('upgrade'); persist(); return home(); }
    if (b.dataset.hs) { s.hero = b.dataset.hs; persist(); return home(); }
    if (b.dataset.hu) { const r = S.unlockHero(s, b.dataset.hu); if (!r.ok) return fail(r); sfx('heroDeploy'); persist(); toast(PG.HEROES[b.dataset.hu].name + ' joins you!'); return home(); }
    if (b.dataset.petOpen) return petModal(b.dataset.petOpen);
    if (b.dataset.hatch) return hatch(b.dataset.hatch);
    switch (b.dataset.a) {
      case 'prev': app.chapter--; app.stage = 0; return home();
      case 'next': app.chapter++; app.stage = 0; return home();
      case 'play': return startBattle(app.chapter, app.stage);
      case 'wall': { const r = S.upgradeWall(s); if (!r.ok) return fail(r); sfx('upgrade'); persist(); return home(); }
      case 'daily': { const r = S.claimDaily(s); if (!r.ok) return fail(r); sfx('victory'); persist(); modal('<h2>🎁 Daily chest</h2><div class="rw">' + rwHtml(r.rw) + '</div><button class="btn btn-gold" data-close>Nice!</button>'); return home(); }
      case 'settings': return settings();
    }
  }
  function petModal(id) {
    const s = app.save, P = PG.PETS[id], p = s.pets[id], R = PG.RARITY[P.rarity], inTeam = s.team.includes(id);
    const c = PG.petLevelCost(p.level), power = p.owned ? Math.round(P.dmg * PG.petMult(p)) : P.dmg;
    modal('<canvas data-pet="' + id + '" style="width:140px;height:140px"></canvas><h2>' + P.name + '</h2><p class="rar" style="color:' + R.color + '">' + R.name + ' · ' + P.kind + ' · ' + P.element + '</p><p>' + P.desc + '</p>' +
      (p.owned ? '<p><span class="stars">' + '★'.repeat(p.stars) + '</span> · Level ' + p.level + ' · Damage ' + power + ' · ' + P.rate + ' attacks/s</p><div class="row">' +
        '<button class="btn btn-gold" data-lv' + (p.level >= PG.PET_MAX_LEVEL ? ' disabled' : '') + '>Level up · 🪙' + fmt(c.gold) + ' 🍖' + fmt(c.food) + '</button>' +
        '<button class="btn" data-team>' + (inTeam ? 'Remove from team' : 'Add to team') + '</button></div>' : '<p class="muted">Not hatched yet.</p>') + '<div class="row"><button class="btn" data-close>Close</button></div>', e => {
      if (e.target.closest('[data-lv]')) { const r = S.levelPet(s, id); if (!r.ok) return fail(r); sfx('upgrade'); persist(); petModal(id); home(); }
      if (e.target.closest('[data-team]')) { const r = S.toggleTeam(s, id); if (!r.ok) return fail(r); persist(); closeModal(); home(); }
    });
    paint($('modal'));
  }
  function hatch(kind) {
    const s = app.save, r = S.hatch(s, kind);
    if (!r.ok) return fail(r);
    persist(); home();
    const el = $('egg-' + kind); if (el) el.classList.add('shake');
    sfx('summon');
    setTimeout(() => {
      const P = PG.PETS[r.id], R = PG.RARITY[r.rarity];
      sfx(r.rarity === 'legendary' || r.rarity === 'epic' ? 'victory' : 'heroDeploy');
      modal('<p class="rar" style="color:' + R.color + ';font-size:1rem">' + R.name.toUpperCase() + '</p><canvas data-pet="' + r.id + '" style="width:170px;height:170px"></canvas><h2>' + P.name + '</h2><p>' +
        (r.result === 'new' ? '🎉 A new pet!' : r.result === 'star' ? '★ Already yours: it gained a star (' + s.pets[r.id].stars + '★)!' : 'Already at 5★: turned into 60 pet food.') + '</p><p class="muted">' + P.desc + '</p><button class="btn btn-gold" data-close>Great!</button>');
      paint($('modal'));
    }, 950);
  }
  function settings() {
    const s = app.save;
    modal('<h2>Settings</h2><div class="row"><button class="btn" data-snd>Sound: ' + (s.settings.sound ? 'on' : 'off') + '</button><button class="btn" data-mus>Music: ' + (s.settings.music ? 'on' : 'off') + '</button></div>' +
      '<h2 style="margin-top:14px">🎁 Redeem code</h2><input type="text" id="code" placeholder="e.g. PETGUARD" maxlength="32"><div class="row"><button class="btn btn-gold" data-redeem>Redeem</button></div>' +
      '<div class="row"><button class="btn btn-red" data-reset>Reset progress</button><button class="btn" data-close>Close</button></div>', e => {
      if (e.target.closest('[data-snd]')) { s.settings.sound = !s.settings.sound; persist(); settings(); }
      if (e.target.closest('[data-mus]')) { s.settings.music = !s.settings.music; persist(); if (s.settings.music) CH.Audio.startMusic('menu'); else CH.Audio.stopMusic(); settings(); }
      if (e.target.closest('[data-redeem]')) { const r = S.redeem(s, $('code').value); if (!r.ok) return fail(r); persist(); sfx('victory'); modal('<h2>🎁 ' + esc(r.label) + '</h2><div class="rw">' + rwHtml(r.reward) + (r.reward.pets || []).map(p => '<span class="pill">🐾 ' + PG.PETS[p].name + '</span>').join('') + '</div><button class="btn btn-gold" data-close>Thanks!</button>'); home(); }
      if (e.target.closest('[data-reset]')) { if (confirm('Erase all progress?')) { app.save = S.defaults(); persist(); closeModal(); app.tab = 'home'; app.chapter = 0; app.stage = 0; home(); } }
    });
  }

  /* ---------------- Battle ---------------- */
  function startBattle(c, st) {
    const s = app.save;
    if (PG.stageIndex(c, st) > s.progress) return fail({ reason: 'Clear the previous stage first' });
    if (!s.team.length) return fail({ reason: 'Add at least one pet to your team' });
    app.game = new PG.Game({ save: s, chapter: c, stage: st, seed: (Date.now() % 1e9) | 0 });
    app.screen = 'battle'; app.paused = false;
    $('screen').classList.add('hidden'); $('hud').classList.remove('hidden');
    $('hud').innerHTML = '<div class="hud-top"><button class="icon-btn" data-h="pause">⏸</button><div class="grow"><div class="hud-lbl"><span id="h-wave"></span><span id="h-wall"></span></div><div class="bar"><i id="h-wbar"></i></div><div class="hud-lbl"><span id="h-lvl"></span><span id="h-kills"></span></div><div class="bar xp"><i id="h-xp"></i></div></div><button class="icon-btn" data-h="speed" id="h-speed">1×</button></div>' +
      '<div class="boss-bar hidden" id="h-boss"><div class="hud-lbl"><span id="h-bname"></span></div><div class="bar boss"><i id="h-bhp"></i></div></div>' +
      '<div class="skills-mini" id="h-sk"></div><button class="ult" data-h="ult" id="h-ult">' + ({ elara: '🏹', aldric: '👑', thorne: '🐎', magnus: '☄', morgrath: '💀', drakon: '🐉' }[s.hero]) + '<span>' + PG.HEROES[s.hero].ult.name + '</span></button><div id="h-banner"></div>';
    $('hud').onclick = e => {
      const b = e.target.closest('[data-h]'); if (!b) return;
      if (b.dataset.h === 'pause') pauseMenu();
      else if (b.dataset.h === 'speed') { app.speed = app.speed === 1 ? 2 : 1; $('h-speed').textContent = app.speed + '×'; }
      else if (b.dataset.h === 'ult') { if (app.game.castUlt()) { sfx('nova'); } }
    };
    if (s.settings.music) CH.Audio.startMusic(st === 9 ? 'boss' : 'battle');
    banner(PG.CHAPTERS[c].name + ' ' + (c + 1) + '-' + (st + 1));
  }
  function banner(t) { const b = $('h-banner'); if (!b) return; b.innerHTML = '<div class="banner">' + esc(t) + '</div>'; }
  function pauseMenu() {
    app.paused = true;
    modal('<h2>Paused</h2><div class="row"><button class="btn btn-gold" data-resume>Resume</button><button class="btn btn-red" data-quit>Give up</button></div>', e => {
      if (e.target.closest('[data-resume]')) { app.paused = false; closeModal(); }
      if (e.target.closest('[data-quit]')) { closeModal(); app.game.finish(false); app.paused = false; }
    });
  }
  function showChoices(g) {
    const k = g.choices; app.ui.choiceShown = k;
    sfx('upgrade');
    modal('<h2>Level ' + g.level + '!</h2><p class="muted">Choose a power</p><div class="cards">' + k.map((id, i) => { const d = PG.SKILLS[id]; return '<button class="skill" data-pick="' + i + '"><span class="ic">' + d.icon + '</span><span><b>' + d.name + (g.sk[id] ? ' ' + 'I'.repeat(g.sk[id] + 1) : '') + '</b><span class="muted">' + d.desc + '</span></span></button>'; }).join('') + '</div>', e => {
      const b = e.target.closest('[data-pick]'); if (!b) return;
      sfx('click'); closeModal(); app.ui.choiceShown = null; g.choose(+b.dataset.pick);
    });
  }
  function endBattle(g) {
    const s = app.save, idx = PG.stageIndex(g.c, g.s), win = g.result === 'win';
    const out = S.finishStage(s, idx, { win, stars: g.stars, gold: g.gold, kills: g.kills, eggRoll: Math.random() });
    persist();
    sfx(win ? 'victory' : 'defeat');
    const next = win && g.s < 9 ? [g.c, g.s + 1] : win && g.c < PG.CHAPTERS.length - 1 ? [g.c + 1, 0] : null;
    modal('<h2>' + (win ? 'Victory!' : 'The wall has fallen') + '</h2>' + (win ? '<div class="big-stars">' + [1, 2, 3].map(i => i <= g.stars ? '★' : '<span class="off">★</span>').join('') + '</div>' : '') +
      '<p class="muted">' + g.kills + ' monsters slain · wave ' + g.progress().wave + '/' + g.progress().of + '</p><div class="rw">' + rwHtml({ gold: out.gold, gems: out.gems, food: out.food, commonEgg: out.eggs.common || 0, mysticEgg: out.eggs.mystic || 0 }) + '</div>' +
      (out.first ? '<p class="good">First clear bonus!</p>' : '') + (!win ? '<p class="muted">Tip: level your hero and pets, upgrade the wall, or hatch eggs.</p>' : '') +
      '<div class="row">' + (next ? '<button class="btn btn-gold" data-next>Next stage ▶</button>' : '') + '<button class="btn" data-retry>Retry</button><button class="btn" data-home>Home</button></div>', e => {
      if (e.target.closest('[data-next]')) { closeModal(); app.chapter = next[0]; app.stage = next[1]; startBattle(next[0], next[1]); }
      if (e.target.closest('[data-retry]')) { closeModal(); startBattle(g.c, g.s); }
      if (e.target.closest('[data-home]')) { closeModal(); toHome(); }
    });
  }
  function toHome() { app.game = null; app.screen = 'menu'; app.tab = 'home'; if (app.save.settings.music) CH.Audio.startMusic('menu'); home(); }
  function hud(g) {
    const p = g.progress();
    $('h-wave').textContent = 'Wave ' + p.wave + '/' + p.of; $('h-wall').textContent = '🏰 ' + fmt(g.wall.hp) + '/' + fmt(g.wall.max);
    $('h-wbar').style.width = (g.wall.hp / g.wall.max * 100) + '%';
    $('h-lvl').textContent = 'Lv ' + g.level; $('h-kills').textContent = '☠ ' + g.kills + ' · 🪙 ' + g.gold;
    $('h-xp').style.width = (g.xp / g.xpNeed() * 100) + '%';
    const u = $('h-ult'); u.style.setProperty('--p', Math.round(g.ult * 100) + '%'); u.classList.toggle('ready', g.ult >= 1);
    const bb = $('h-boss');
    if (g.boss && !g.boss.dead) { bb.classList.remove('hidden'); $('h-bname').textContent = '💀 ' + g.boss.def.name + (g.boss.enraged ? ' (enraged)' : ''); $('h-bhp').style.width = (g.boss.hp / g.boss.maxHp * 100) + '%'; } else bb.classList.add('hidden');
    const sk = Object.entries(g.sk).filter(([, n]) => n).map(([k, n]) => '<span>' + PG.SKILLS[k].icon + (n > 1 ? n : '') + '</span>').join('');
    if (app.ui.sk !== sk) { app.ui.sk = sk; $('h-sk').innerHTML = sk; }
  }

  /* ---------------- Input: drag to move the hero ---------------- */
  const cv = $('cv');
  const toLogical = e => { const r = cv.getBoundingClientRect(), dpr = cv.width / r.width, ui = app.ui; return { x: ((e.clientX - r.left) * dpr - ui.ox) / ui.k, y: ((e.clientY - r.top) * dpr - ui.oy) / ui.k }; };
  let dragging = false;
  cv.addEventListener('pointerdown', e => { if (app.screen !== 'battle') return; dragging = true; cv.setPointerCapture(e.pointerId); app.game.hero.tx = Math.max(20, Math.min(PG.W - 20, toLogical(e).x)); });
  cv.addEventListener('pointermove', e => { if (dragging && app.game) app.game.hero.tx = Math.max(20, Math.min(PG.W - 20, toLogical(e).x)); });
  cv.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('keydown', e => { if (app.screen !== 'battle' || !app.game) return; if (e.key === ' ' ) app.game.castUlt(); if (e.key === 'ArrowLeft') app.game.hero.tx -= 40; if (e.key === 'ArrowRight') app.game.hero.tx += 40; });
  function resize() { const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  window.addEventListener('resize', resize); resize();

  /* ---------------- Loop ---------------- */
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const g = app.game;
    if (app.screen === 'battle' && g) {
      if (!app.paused && !g.choices && !g.result) { acc += dt * app.speed; let n = 0; while (acc >= 1 / 60 && n++ < 8) { g.update(1 / 60); acc -= 1 / 60; } }
      for (const ev of g.events.splice(0)) {
        if (ev.kind === 'sfx') { if (Math.random() < 0.35) sfx(ev.name); }
        else if (ev.kind === 'wave') banner('Wave ' + ev.n + (ev.n === ev.of ? ' — final!' : ''));
        else if (ev.kind === 'boss') { banner('💀 ' + ev.name); sfx('roar'); if (app.save.settings.music) CH.Audio.startMusic('boss'); }
        else if (ev.kind === 'toast') toast(ev.text);
        else if (ev.kind === 'ult') banner(ev.name + '!');
      }
      if (g.choices && app.ui.choiceShown !== g.choices) showChoices(g);
      PG.Render.draw(cv, g, app.ui); hud(g);
      if (g.result && !g.endHandled) { g.endHandled = true; setTimeout(() => { if (app.game === g) endBattle(g); }, 900); } // exactly once per battle
    } else {
      const c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#0b1028'; c.fillRect(0, 0, cv.width, cv.height);
    }
    requestAnimationFrame(frame);
  }
  app.startBattle = startBattle; app.home = home; app.toHome = toHome;
  title();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
